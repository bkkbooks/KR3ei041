body:
  text: 沈氏女科輯要箋硫卷下産後玉門不閉薛立齋雲氣血虛弱十全大補湯主之箋疏新産而産門不能收合下焦無固攝之權誠是虛症然所以治之者仍當隨其他兼見之證而最為滋補尤必以收攝下元為主十全蠻方何足以盡活潑靈通之變化且其中有肉桂惟有寒症有為宜若在炎天或其人多火即為鴆毒立齋呆漢只為呆用成方只知方名十全大補當然無一不全無一不補何其陋耶此症虛弱之人時有之初胎者尤宜留意故新産後必正臥而緊並其兩足防此患也有家者皆宜知之玉門腫脹焮痛薛云是肝經虛熱加味逍遙散主之坐草遇早産戶傷壤紅腫潰爛痛不可忍用蒸包子籠內荷葉煎湯洗日三次兩日可愈繆德仁治驗箋疏此證難産者多有之初胎亦必有痛甚者外用瘍科腫痛之敷藥治之若內服藥則仍隨其他之兼症而定加味逍遙是不知足而為屢之説但知其不為蕢耳立齋只能為此籠統話庸醫之尤四字確是此公鐵板説法陰脫陳無擇云産後陰脫加脫肛狀及陰下挺出逼迫腫痛舉動房勞即發清水續續小便淋瀝硫黃烏賊骨各二兩五味子二錢半為未糝之日三次箋疏此即於宮之下墜治宜補益固攝若使立齋治此則必曰十全大補加味逍遙矣外治法固亦可備一説但硫黃非通用之藥子宮下墜丹溪云一産子後陰戶下一物如合鉢狀有二岐其夫來求治豫思之此子宮也必氣血弱而下墜遂用升麻當歸黃耆幾帖與之半日後其夫復來云服二次後覺響一聲視之巳收但因經宿干著皮上破一片如掌心大在皮某妻在家哭泣恐傷破不復能生豫思此非腸胃乃脂膏也肌肉破尚可復完若氣血充盛必可生滿遂用四物湯加人參與百帖三年後復有子治子宮下黃耆一錢半人參一錢當歸七分甘草二分作一帖水煎食前服外用五棓子末泡湯洗又用末傅之如此數次宜多服藥永不下箋硫此確是子宮所謂兩岐者正合西學家説所謂子宮之底外有二筋帶懸之此帶無力即有下墜之憂者是也此症虛弱者時有之産後任勞亦有之正是下元無力所致歸耆參朮稍加升舉洵為正鵠至其黏著皮上而脫一片丹溪斷為脂膜亦是至理補養可腹完説亦可信但四物百帖未免太呆則丹溪之書本是淺者為之所以筆下謝陋如此五棓子固澀洗敷自佳産戶下物丹婆云一婦年三十歲生女二日後産戶下一物如手帕下有帕尖約重一斤豫思之此因胎前勞乏傷風或肝痿所致卻喜血不甚虛耳其時歲暮天寒恐冷干壞了急與炙黃耆二錢人參一錢白朮五分當歸一錢半升麻五分三帖連服之即收上得汗通身方安但下翳沾度處乾者落一片約五六兩兩重蓋脂膜也食進得眠診其脈皆澀左略弦視其形卻實與白朮白芍各半錢陳皮一錢生薑一片煎二三帖以養之箋疏此與上條本是一事方亦與上條一轍但傅之稍異遂使字句少有不同堯封兩收之未免失檢術芍陳皮一方不如參朮歸耆升麻遠甚凡古醫籍中似此泛而不切者皆當刪除淨盡否則苗莠同疇徒亂人意水道下肉線乳汁不通湧泉散山甲炮研末酒服方寸匕日二服外以油梳乳即通見經疏陳自明婦人良方曰豫婦食素産後七日乳汁不行赤小豆一升煮粥食之當夜即行一婦乳汁不行煎當歸八錢服即通王不留行白通草穿山甲是要藥箋疏産而無乳氣血虛也甲片通草留行等走竄固佳然不揣其木而齊其末若在瘦弱之人終是礱粳打油手假非徒無益惟壯實氣滯者可用耳當歸活血猶彼善於此吾鄉通用木通豬蹄煮湯飲之通乳固捷然以此二物並作一氣大覺不倫亦是可笑須知鮮豬蹄湯滋液助血確是佳品只此一味淡煮清湯啜之已是有餘何必更以木通苦之是為惡作劇凡乳婦尋常飯膳多飲豬肉鮮湯助乳極佳但宜淡味不宜鹹鹹則耗血又必忌辛辣忌五暈皆足以耗血且令乳汁有暈臭亦非愛子之道也回乳無子吃乳乳不消令人發熱惡寒用大麥芽二兩炒為末每服五錢白湯下箋疏丹溪此法固佳凡消食之藥無一不靈查肉神麯等皆是治乳婦病者亦當留意此一層也乳頭碎裂丹溪老黃茄子燒灰傳之綱目丁香末傳之箋疏此有因發癢而搔碎者稍有滋水是肝胃濕熱宜清肝而少參化濕有乾製作痛者甚至血溢是肝燥有火宜養液而並滋肝腎乳房屬足陽明經乳頭實肝經主之故凡是乳病無不繫於肝者脹痛皆然而外瘍其尤著也外治法當依瘍科例擇藥燥者宜潤挾濕者宜清涼收濕丁香溫燥大非所宜單方之不可呆用如此吹乳繆仲淳云妒乳內外吹乳乳岩乳癰不外陽明厥陰二經之病橘葉最妙又用生半夏一個研末生蔥頭一段研里左右互塞鼻神驗又于山中掘野芥菜去葉用根洗淨搗爛無灰酒煎數滾飲一二次即以渣遏患處凡乳癰未成或腫或硬或脹痛者無不立消屢治經驗野芥菜一名天芥菜又名鸚哥草似芥菜而略矮小其根數出如蘭根用以治乳想其形似乳囊也故用有驗春圃附載箋疏未産前生乳癰名內吹風乳子時生乳癰名曰外吹風皆由理想而得其名謂小兒吮乳口鼻之風吹之猶可説也乃兒在胎中而亦能吹風何其可笑一至於此吾國外科之學鄙陋己極外瘍一切病名可鄙可嗤十而八九醫學空疏真是慚愧欲死宜乎當此開明之世後生小子乍得一知半解者亦得竊笑於其側空穴來風固有自取之道殊不足為若輩責也妒乳之名亦是可笑不如經稱乳癰豈不正大光明名正言順仲淳不外陽明厥陰二經之病洵是至當不易橘葉固佳但乳岩根深蒂固萬不可與乳癰同論總之胎前患此多是肝火止宜清肝少參消散産後患此多是積乳先當消乳早投煎藥可退十之六七惟胎前得之其火必盛産後得之乳積更多加以畏痛不敢使兒吮乳則愈積愈腫所以成潰皆是極易不比其他外瘍之易於消退二三日間無不成膿若新産旬日之間陰虛未復狂焰陡然腫大且堅如瓢如甕者其勢甚急非羚羊角不能稍殺其毒俗名乳發其害猶熾其較輕者則川棟蒲公英地丁銀花丹皮梔子黃芩連翹山查神麯麥芽等足以了之不能顧及回乳一層蓋非此不能釜底抽薪俗子不知猶用歸芎通草之類自謂活血行乳則助之腐也生半夏有毒塞鼻不妥野芥菜不知何物然有芥之名必有辛散作用此症必有心火亦外治用蒲公英地丁馬齒莧木芙蓉葉忍冬藤等搗敷皆可然此類皆清涼有餘火盛勢熾紅腫蔓延者宜之輕症嫌其太涼遏抑氣血反致堅硬難化瘍科書中有如意金黃散清熱而兼有辛散以治尋常之陽發癰腫正合但選藥尚未盡純粹頤習用之桃花丹敷此有效其不甚大者形塊如桃如栗則千槌膏消腫最驗二方見拙編瘍科綱要皆非古之成方乳癰紅腫方發活小鯽魚一尾剖去腸同生山藥寸許搗爛塗之少頃發屢驗無山藥即芋艿亦可箋疏此單方也鮮山藥鮮芋頭生搗多漿汁沾人肌肉其癢異常洵能通利血脈故可消毒散腫然惟小症可用若形塊較巨者少敷則不足以減其勢多敷則皮膚極癢發泡且腐而肌肉之堅腫如故反多一層皮膚病未盡美善不如頤所恆用之桃花丹千槌膏遠甚乳癰已成胡桃膈上培燥研末每服三錢紅糖調勻溫酒送下三服無不全愈又方用玫瑰花五七朵乾者亦可醇酒煎服燙酒極熱沖服亦可即以花瓣摘散鋪貼患處三兩次可愈節己成硬塊者亦可消散會經治驗數人陳載安附識箋疏既曰已成則內有膿矣非針之使潰尚何有退消之法此條二方仍是單方耳輕症初起成能小效必曰可退斷不足恃且更有一大弊在乳癰皆是陽症成潰最迅酒之通經活血能使外瘍消腫軟堅止可治以陰發堅硬木腫之症若陽發飲酒是為厲階以治乳癰尤其抱薪救火吾鄉俗傳治此症尚有一單方用生鹿角研末熱陳酒沖服或謂鹿角霜皆是溫散治法萬無可消陽發之埋而傳者皆言其神妙用之者乃無一成無一不潰而亦無一不大痛三四日所兒所聞不可僂指當與是條二方鼎足成三彼此輝映實則此等方法乃治乳核乳癖堅硬木腫者彼是凝痰結滯其來以漸核小而堅初起不知不覺實即乳岩之小症而亦乳岩之初基故宜用溫和行血之品此三方皆出一派惟無乳汁者有此症而內外吹兩者形似相同情實相反萬不可一例綸治而傳者不悟總因內外分科治內科者遂絶不知有外瘍理法最是內科諸書一大缺陷且彼之結核雖似陰發而病在厥陰之絡內含木火溫經太過亦必助其發揚恐有不可收拾之慮蓋乳房生瘍惟內外吹易潰而易愈癖核雖小潰則甚難收口雖與乳岩絶症稍有輕重之分然潰彼糾經延成癆怯者頤見之已屢且結核漸巨即是成岩異病同源胡可膜視王鴻緒外科全生集大誇基陽和一方妄謂是乳岩瘰癧必用良藥頤授經師李牟云先生次女本患結核誤於陽和陽十六帖兩月而乳岩面又三月而潰腐盈尺滲遭非命即是殷鑑又吾嘉素驥云制一末藥施送説治乳癰乳癬乳岩一服必減三服必痊用石首魚背上鰭生剝撕下貼壁上陰乾積久炒研末每一兩封以小青皮末一兩每服三錢熱陳酒調服實不過宣通經絡殊不足以療大症而亦不可以治乳癰陽發適以使其宣達成膿單方之不可靠如是又草年以前吾鄉有人患疝氣痛聞傳説大茴香末酒服有驗乃購大茴香二十文研末溫酒一次服完半夜七孔流血而絶則又單方之最可駭者也乳岩坎氣洗淨切薄焙燥研末日吃一條酒下約二十條效繆德仁治驗半年以內者效又狗糞東丹獨囊蒜三味搗勻攤布上勿用膏藥令黏貼上微痛數日可愈沈堯封曰乳岩初起堅硬不作膿其成也肌肉疊起形似山岩病起抑鬱不治之證方書云桃花開時死出鮮血者死余見一婦患此已四年診時出鮮血盈盂以為必死日服人參錢許竟不死明年春桃花大放仍無恙直至秋分節候方斃此婦抑鬱不得志誠是肝病然不死於春而死於秋何哉豈肝病有二其太過者死於旺時其不及者死於衰時耶此證本屬肝病繆以坎氣補腎而愈亦理之不可解者外有方附後瘍科方選中箋疏乳民初起止是一個堅核不脹不腫雖重按之亦不覺痛但塊堅如石興其他瘍症不同故不能消散苟能養血調肝開懷解鬱止可保其不大不脹經數十年終身不為患者所見已多若多勞多鬱則變化亦易逮漸大而知作脹已難治療若時作一抽之痛則調經更是棗手雖能養陰亦多無益斷不可誤投破氣消勉及軟堅走竄之藥當見誤服甲片皂剌應手焮發速其脹裂最是催命靈符其潰也浮面發腐其中仍如勉石嵌空而堅止有血水並不流膿且易溢血必無帶病延齡之望坎氣亦是單方恐未必果有效力蒜頭塗法必令發癢如其浮皮一破即是弄假成真必不可試總之此症無論柯藥斷無能令必愈之理沈謂外有方附後今亦未見豈傳抄有脫佚耶然使縱有方亦無效果闕之可耳王孟英曰吳鞠通云常歸芎窮為産後要藥然惟血虛而熱者斷不可用蓋富歸香竄異常甚於麻辛急走善行不能靜守止能運血裒多益寡如亡血液虧孤陽上冒等證而欲望其補血不亦愚哉芎窮有車輪紋其性更急於當歸蓋物性之偏長於通者必不長於守也世人不敢用芍藥而恣用歸何其顛倒哉余謂今人血虛而熱者為多産後血液大耗孤陽易浮吳氏此言深中時弊又論達生篇所用方藥未可盡信皆先得我心之同然者詳見解産難醫者宜究心焉箋疏當歸善行川芎善升血虛火動者當為禁藥而俗子誤以為補血之專品者只緣四物湯方泛稱補血遂不辨菽麥而浪用之耳鞠通此説確不可易熱入血室仲景傷寒論云婦人傷寒發熱經水適來書日明瞭暮則譫語如見鬼狀者此為熱入血室無犯胃氣及上二焦必自愈又婦人中風發熱惡寒經水適來得之七八日熱除而脈遲身涼胸脅下滿如結胸狀譫語者此為熱入血室也當刺期門隨其實而瀉之又婦人中風七八日續得寒熱發作有時經水適斷者此為熱入血室其血必結故使如瘧狀發作有時小柴胡湯主之沈堯封曰論言勿犯胃氣及上二焦者謂不可攻下並不可吐汗也然有似是實非之證不可不辨箋疏發熱而經水適來有適逢信期者亦有不及信期而熱逼經行者書日明瞭暮則謂語以熱入陰分故日暮陰氣用事而神憒也法當破瘀其應甚捷仲景謂無犯胃氣及上二焦以此之譫語非陽明症恐人誤認陽明妄投承氣故為叮嚀又謂無犯上二焦則必治下焦可知陸九芝解此最是明白胸脅下滿是血滯而肝絡不疏故宜瀉期門則推之藥理亦必瀉去血滯可知其小柴胡湯一條明言經水適斷此為經淨自斷者而言以經行既盡則血氬空疏而邪熱乘之陷入下焦乃是虛證故以柴胡提其下陷之氣而參甘大棗方為對病非凡是熱入血室皆用是方亦有經行未淨熱盛瘀結因而適斷者更富破瘀通經尤非小柴胡之升舉補中所可妄試揆之藥理蓋亦可知則本論小柴胡湯條中其血必結四字願疑是上二條之脫説非然者血已瘀結而更可投柴之升提參棗之補仲景安有此理然古今之為本論作注者竟謂小柴胡一方為通治熱入血室寧非大誤徐洄溪傷寒類方於暮則譫語如見鬼狀條下尚謂用小柴胡湯亦是誤認堯封謂有似是實非之症亦指小柴胡一方不可妄用下文醫案三條皆用是方而增劇蓋本是熱病不問由而輒以柴胡升之參甘大棗補之謬妄尚何待言讀古人書豈可如此呆板陳良甫曰脈遲身涼而胸脅下滿如結胸狀譫語者當刺期門穴下針病人五吸停針良久徐出針凡針期門穴必瀉勿補肥人二寸半箋疏期門穴在兩乳直下右當肝藏部位何可刺入才半及二寸古書皆云可刺四分而陳良甫獨為是説必有訛誤不可不正許學士治一婦病傷寒發寒熱遇夜則如見鬼狀經六七日忽然昏塞涎響如引鋸牙開緊急瞑目不知人病勢危困許視之曰得病之初會值月向來否其家云經水方來病作而經遂止後三日發寒熱畫雖靜而夜則見鬼昨日不省人事許曰此是熱入血室證醫者不曉以剛劑與之故致此當先化痰後治其熱乃急以一呷散投之兩時許涎下得睡即省人事次投以小柴胡湯加生地三服而熱遂除不汗而自解箋疏此見本事方夜則譫語確見熱入血室然至昏瞀痰鳴牙開緊閉已是氣升火升血沖腦經之症許謂醫以剛劑與之當指溫升辛散諸藥故為此病許先化痰誠是泄降正治一呷散方未見必是滌痰法次謂小柴胡加生地許書中有是方謂治婦人室女傷寒發熱或發寒熱經水適來或適斷畫則明瞭夜則譫語如見鬼狀亦治産後惡露方來忽爾斷絶云云雖是仲景本論固有之法其加生地者古稱地黃能破瘀也然以適來適斷併為一談已非仲師真旨且謂可治産後惡露方來忽爾斷絶則凡是血瘀皆主柴胡已覺不可為訓而此病直是氣血上衝腦經受病而柴胡升揚參甘生地皆是膩補姑不論古人入不知腦神經病或有誤認然痰涎壅塞之後又豈此藥可愈恐是臆説不敢信也又一熱入血室證醫用補血調氣藥治之數日遂成血結胸或勸用前藥許以小柴胡已遲不可行矣刺期門則可請善針者治之如言而愈或問何為而成結胸許曰邪氣乘虛入於血塞血為邪所迫上入肝經則譫語見鬼復入膻中則血結於胸中矣故鯛之則痛非藥可及當用刺法箋疏此亦見本事方謂血結膻中似亦未可深信沈堯封曰一婦熱多寒少譫語夜甚經水來三日病發而止本家亦知熱入血室醫用小柴胡數帖病增舌色黃燥上下齒俱是乾血余用生地丹皮麥冬等藥不應藥入則乾嘔脈象弱而不大因恩弱脈多火胃液乾燥所以作嘔遂用白虎湯加生地麥冬二劑熱退神清唯二十餘日不大便為苦與麻仁丸三服得便而安一室女發熱經來醫用表散藥增劇譫語夜甚投小柴胡湯不應夜起如狂或疑蓄血投涼血消瘀藥亦不應左關脈弦硬搏指詢知病從怒起因用膽草黃芩山梔丹皮羚羊角蘆薈甘草歸身等藥煎服一劑知四劑愈箋疏兩症皆是熱入血室而皆用小柴胡增劇妄升妄補無一非熱病鴆毒呆讀古者此其殷鑑惟胃火脈當滑大而反弱者津干液耗脈反無力耳沈謂弱脈多火大有語病此兩條沈皆憑證用藥非熱入血室之通治法若執此兩條以通治經來譫語又是呆漢矣沈又曰張儀表令愛發熱經來昏夜譫語如見鬼狀投小柴胡增劇詢其病情云醒時下體惡寒即憒時亦嘗牽被斂衣因悟此證平素必患帶下且完姻未久隱曲之事未免過當復值經來過多精血兩虧陰陽並竭其惡寒發熱由陰陽相乘所致非外感熱邪深入也誤投發散清熱證同亡陽傷寒論云亡陽則譫語內經云脫陽者見鬼是也因用腎氣丸早晚各二錢神氣即清隨以蓯蓉易附桂數劑全愈此則前所云似是實非之證不可不瓣者也堯封自記箋疏血虛而浪投柴胡乃至不醒人事升提虛陽為禍固是甚捷但此是陰虛陽浮之候法當滋填鎮攝者而用腎氣甚不可解或傳為者失其真耶咽哽金匱婦人咽中有炙臠半夏厚朴湯主之千金所云咽中帖帖如有炙肉吐之不出吞之不下是也半夏一升厚朴三兩茯芩四兩生薑五兩蘇葉二兩水煎分四服日三夜一箋疏此痰氣互陰之症尤在涇謂凝痰結氣陰塞咽嗌者是也臟燥婦人臟燥悲傷欲哭象如神靈所作數欠伸甘麥大棗湯主之甘草三兩小麥一升大棗十枚水煎分三服箋疏此血少而心氣不安神虛氣餒故多悲傷此方極驗近人醫案有之頤已録入醫案平議神志門尤氏金匱心典解此甚明白今録於後尤在涇曰此症沈氏所謂子宮血虛受風化熱者是也血虛藏燥則內火擾而神不髯悲傷欲哭有如神靈而實為虛病前五藏風寒積聚篇所謂邪哭使魂魄不安者血氣少而屬於心也數欠伸者經云腎為欠為嚏又腎病者善數欠顏黑蓋五志生火動必關心藏陰既傷勢必及腎也小麥為肝之谷而善養心氣甘草大棗甘潤生陰所以滋藏氣而止其燥也陰寒金匱凡陰寒溫陰中坐藥蛇床之散主之蛇床子末以白紛少許和合相得如棗大錦里納之自溫箋疏此外治法然亦不必呆守蛇床一味著學古人者亦可自知變化陰吹金匱胃氣下泄陰吹而正喧此穀氣之實也豬膏發煎導之豬膏半斤亂髮如雞子大三枚膏中和煎之發消藥成分再服王孟英曰陰吹亦婦人恆有之事別無所苦者亦不為病況屬隱微之候故醫亦不知耳俗傅産後未彌月而啖蔥者必患此惟吹之太喧而大便艱燥乃稱為病然仲聖但潤其陽明之燥則府氣自通仍不必治其吹也箋疏此是隱曲之微恙不足為病觀仲景汪通陽明而兼有導淤性質蓋國有瘀滯經隧不利故為此患則用藥之理可想而知亦不必拘拘於古人之成方也陰癢善邑西門外三里有婦人陰中極癢難忍因寡居無人轉述醫者莫知病情治皆不效至蘇就葉天士診微露其意葉用蛇床子煎湯洗內服龜鹿二仙膠四日而愈陰蝕有用豬肝煮熟削如梃鑽孔數十納陰中良久取出必有蟲在肝孔內另易一梃納之蟲儘自愈亦良法也箋疏此濕熱下注葉氏此法蛇床子湯外洗尚是盡人所能其內服二仙膠者必其人真陰素虛清氣下陷而稍挾濕熱故用藥如此若濕火偏盛則必非龜鹿溫補所宜藥豈一端各有所當弗謂葉老此方為專療是症之唯一祕訣陰蝕成瘡濕熱生蟲坐藥亦其一端然必須洗法而兼服導濕清熱以疏利之王孟英曰尚有陰梃一證用飛磯六兩桃仁一兩五味子雄黃各五錢銅緑四錢末之煉蜜丸每重四錢即以方內雄黃為衣坐入玉門重者二次必愈箋疏此亦濕熱為患此間極少是症聞南方閩廣及北地燕齊多有之南方則地溫而上濕北方則席地而坐夜臥火坑皆濕與熱交互為患盂英此方固是燥濕殺蟲導淤澀斂法極完善當能有效但病由漸起甚者經年纍月必謂兩次可愈重症似亦未免言之太易王宇泰女科證治準繩序云婦人有專治方舊矣史稱扁鵲過邯鄲聞貴婦人即為帶下醫語兼長也然帶下直婦人一病耳調經雜證懷子免身患苦百出療治萬方一帶寧遽盡之乎世所傳張長沙雜病方論三卷婦人居一焉其方用之奇驗奈弗廣何孫真人著千金方特以婦人為首蓋易基幹坤詩首關睢之義其説曰特須教子女學習此三卷婦人方令其精曉即於倉卒之秋何憂畏也而精於醫者未之深許也唐大中初白敏中守成都其家有因免乳死者訪問名醫得咱殷務集驗方三百七十八首以就是為産寶宋時濮陽李師聖得産論二十一篇有説無方醫學教授郭嵇中以方附焉而陳無擇於三因方評其得失詳矣婺醫杜荍又附益之是為産育寶慶集臨川陳自明良甫以為諸書綱領散漫而無統節目簡略而未備醫者局於簡易不能深求遍覽有總進一方不效輒束手者有無方可據揣摩臆度者乃採托諸家之善附以家傳驗方編葺成篇凡八門門數十餘體總三百六十餘論論後列方綱領節目燦然可觀是為大全良方良方出而閨閣之調將大備矣然其論多采巢氏病源什九歸諸風冷藥偏獷熱未有條分縷晰其宜否者近代薛氏新埔始取良方增注其論酌寒熱之中大抵依於養脾胃補氣血不以去病為事可謂救時之良醫也已第陳氏所葺多上古專科禁方具有源流本末不可沒也而薛氏一切以已意芟除變亂使古方自此湮沒余重惜之故於是編附存陳氏之舊而刪其偏駁者然亦存十之六七而已至薛氏之説則盡收之取其以養正為主且簡易易守惟女子學習無難也若易水瀔水師弟則後長沙而精於醫者一方一論具掇是中乃他書所無有挾是而過邯鄲庶無道少之患哉其積德求子與夫安産藏衣吉凶方位皆非醫家事故削不戰雲箋疏黃肯堂此序歷敘女科書源委甚詳可謂是科乏紀事本末肯堂之女科準繩固即本此數家而掇拾為之未嘗不羅羅清疏獨薛新甫治案專用成方絶少裁翦於病情曲折往往不能精切而授學者以因陋就簡之法自薛氏之書盛行而習醫乃極為易事然粗枝大葉似是實非醫學之疏乃益不可問肯堂反喜其簡而易守毋乃不思之甚清干隆時有武叔卿之濟陰綱目亦從準繩撮其大要方論皆穩妥可學有志於婦女專科者循此諸家法守而融會貫通之亦自足以名世矣王盂英曰帶下直婦人一病耳未必人人病此何以扁鵲聞貴婦人即為帶下醫緣帶下本女子生而即有之事原非病也後人以帶脈不主約束一言遂以女人之遺濁稱為帶下之證然則扁鵲為之帶下醫猶今之幼科自稱痘醫也痘雖幼科之一證而亦人人必有之事且世俗無不貴小兒者所以人多樂為痘醫耳箋疏孟英解帶下為婦女科之通稱言雖奇而理實確否則白淫僅百病中之一種而扁鵲遂以之自號最不可解此蓋古時自有此名稱然不可以行之於今者也集方論中所列各方有彼此互見者集録於此以便簡閲其專治者不復贅門類及分兩炮製半參汪認庵醫方集解所録補養六味丸錢仲陽治肝腎不足真陰虧揖精血枯竭地黃砂仁酒拌九蒸九曬八兩山茱肉酒潤四兩山藥四兩茯芩乳拌丹皮澤瀉各三兩蜜丸空心鹽湯下冬酒下六味地黃湯治同上前方煎服八味丸崔氏前方加肉桂附子各一兩名桂附八味丸治相火不足尺脈弱者宜之亦治婦人轉胞前方加黃柏知母各二兩名知柏八味丸治陰虛火盛尺脈旺者宜之箋疏自薛立齋張景嶽趙養葵輩濫用六味地黃而世之醫者無不視六味為滋陰補腎必需之品須知六味之方本於八味腎氣崔氏立方之旨原為腎氣不充不能鼓舞真陽而小便不利者設法故以少少桂附溫養腎氣萸肉固攝肝腎而重用地黃峻滋陰液即以丹皮泄導下焦濕熱茯芩澤瀉淡滲泄水通利小便其用薯蕷者實脾以堤水他觀仲景凡用是方多有小便不利一句則是方真諦全從利水著想顯而易知方名腎氣所重者在乎氣字明非填補腎陰腎陽之意惟金匱消渴門飲一斗小便亦一斗主以此丸似乎渴而且消沃非遍利之意然此亦為腎陽無權不能氣升於上所以上焦反渴乃消症中之不多有者原與肺胃燥火之消渴皎然不同其所以渴者乃因陽虛不能蒸氣化液所以不得不飲然飲一斗而小溲亦是一斗溲不加多又明與下焦有火之飲一溲二大異則小水雖未必不利然尚不加多故茯芩丹澤不嫌滲泄而桂附萸肉溫養肝腎乃為適合至錢仲陽於臂氣丸中減去桂附止用六味以治小兒腎虛為之説者輒曰小兒純陽不需溫腎然中之丹皮芩瀉豈填補腎陰之藥頤謂仲陽制此六味丸方蓋謂病後輕描淡寫作用可助真陰可泄餘熱必無甚病症著乃可用之亦未必遽以為大補之品奈後人不學一見仲陽補腎二字遂謂大補滋填竟是無出此方之右絶不知細心體會一思丹皮澤芩究竟功用奚若此立齊養葵之簡陋本屬醫界之最不可問者而景嶽只知推崇熟地遂亦隨聲附和不辨真味至近今之浪用六八味者則皆中薛趙景嶽之毒者耳最可笑者汪認庵醫方集解竟列六味於補養方中首屈一指俗學見之那不寶若無價之珍而方下謂治肝腎不足真陰虧損精血枯竭等凡七十餘字叢雜繁蕪可鄙已極汪氏書中大都如此毫無辨駁價值頤亦不屑為之妄費筆墨可惜堯封於此乃亦截取其肝腎不足之十二字作為六味主治則果是精血枯竭而可以丹皮澤苓清涼滲泄毋乃不思之甚耶腎氣丸金匱桂附八味丸加車前牛膝劑用地黃四兩山藥以下皆一兩茯苓三兩附子五錢制徐藹輝曰金匱要略用桂枝無車前牛膝治婦人轉胞此名加味腎氣丸系治水腫箋疏此嚴用和濟生方也為導水計故於八味方中加以車前牛膝嚴氏本以附子為君而減少地黃治水腫腎陽衰者以地太膩而減其半亦自有理薛立齋又改用茯芩為君汪氏醫方集解録之於利濕門中名曰加味腎氣丸猶可説也而於六味除了叉曰桂附八味丸加車前牛膝名腎氣丸而注之以金匱二字一似金匱此方本有車前牛膝者何以謬戾至此然汪氏之書世皆喜其卑而易行遂人人心目中皆知金匱腎氣丸方節此十味而市肆中亦皆以十味者稱之為金匱腎氣丸一盲君盲醫藥之學每況愈下皆汪氏始作之務何堯封亦復沿訛襲謬如此真不可解青娥不老丸集解祗名青娥丸未知是一是二治腎虛腰痛破故紙十兩酒蒸為末胡桃肉十二兩去皮研爛杜仲一斤炒去絲生薑炒蒜各四兩蜜調為丸又丹溪青娥丸止用故紙四兩杜仲四兩炒生薑二兩牛炒胡桃肉三十個蜜丸桐子大每服四五十丸鹽酒下箋疏青娥丸出和劑局方專入腎家溫潤固澀頗有意味腰痛多是腎虛經謂腰者腎之府轉搖不能腎將憊矣此方溫養滋填且能封固泃有奇功但是服食之法必久久不懈方能有效黑錫丹治陰陽不升佯上盛下虛頭目眩運黑鉛二兩硫黃二兩將鉛熔化漸入硫黃候結成片傾地上出火毒研之無聲為度箋疏是方治腎氣不攝君陰用事寒水上凌幾欲汨沒微陽者其證則水泛為痰喘促氣急不能安寐故以黑鉛之重合硫磺純陽之精直入腎家收攝元氣泃虛寒喘嗽之要藥但軍用二味猶嫌獷悍不醇未盡美善不如局方為佳面本事方不用陽起石尤為馴良然是方專為陰氣上乘陽虛欲絶而設局方為之升降陰陽己是大有語病而汪認庵之集解竟謂治陰陽不升降究屬是陰是陽是升是降語氣渾侖最不可曉又謂上盛下虛頭目眩運則一似肝膽火升陽浮於上者正與此症之陰寒上逆者一陰一陽適得其反汪氏憒憒本不足道而堯封乃亦依樣葫蘆不為糾正何其疏耶參芩白朮散治脾胃虛弱飲食不消或吐或瀉人參白朮土炒茯芩甘草炙山藥炒扁豆炒薏仁炒蓮子肉去心炒陳皮砂仁枯梗為末每三錢棗湯或米飲調服箋疏此亦和劑局方乃平補脾肯之主藥不偏溫燥最為馴良凡能食而不易消化及飢不思食或納穀無味者宜之八珍湯治心肺虛氣血兩虛心主血肺主氣四君補氣四物補血人參白朮士炒荻苓甘草常婦們洗生地芍藥芍翁箋疏四君四物合為八珍按之藥理功能可謂四君氣藥能助脾陽四物血藥能養脾陰一屬氣一屬血只可專主脾胃構決不能泛泛然謂四君補氣四物補血然汪認庵何知藥物真理但認得一個氣字即曰肺主氣而遂謂四君即是補肺藥又認得一個血字即曰心主血而遂謂四物即是補血藥其醫方集解之八珍湯下竟曰治心肺虛損氣血兩虛而又恐他人不能知其何以可治心肺則又注之曰心主血肺主氣云云於是八珍湯之專補心肺乃為確切不移此則汪氏獨有之藥物學而其他方書之不謂然者究竟此八物之實在功用奚若何一味可以補心補肺分而審之宜悟物理之真合而參之當識調劑之鈔認庵盲瞽安可與語且其他方書言之亦詳何以堯封獨取汪氏豈所謂卑之無甚高論耶然其謬甚矣全大補湯八珍再加黃萇以助陽固表加肉桂以引人歸元金匱虛者十輛勿瀉之是也箋疏八珍以外加之耆桂蓋為脾腎陽袞者設法東垣制此即從保元湯得來本是溫養之意惟中氣虛寒及陽虛於下者宜之諸書有謂升陽滋陰已是大謬而汪認庵且能謂肉桂是引火歸元幾欲以治虛陽上浮之症則陽已露矣而更以歸芎升之耆桂溫之其禍乃可翹足而待補中益氣湯東垣治一切清陽下陷中氣不足之證黃耆蜜炙一錢半人參甘草一錢炙白朮土炒陳皮錢半當歸五分升麻柴胡三分薑三片棗二枚煎箋疏此惟脾胃氣虛清氣陷於陰中而肢體無力面目萎黃飲食無味脈弱不起者為宜所謂陽虛下陷者是矣若陰虛於下根本不堅者得此害如鴆毒昔賢謂脾胃之虛利於升舉肝腎之虛必不可升學者當須識得清楚歸脾湯濟生治心脾受傷不能攝血致血妄行及婦人帶下人參白朮土炒茯神棗仁炒龍眼肉二錢黃耆一錢半炙當歸酒洗遠志一錢木香甘草五分炙薑棗煎四物湯治一切血虛及婦人經病當歸酒洗生地黃芍藥各二錢炒芎窮一錢半箋疏四物出於和劑局方實從金匱膠艾湯來即以原方去阿膠艾葉甘草三味方以地黃養五臟之陰而以芍藥收攝耗散之氣是為補血正義特微嫌其偏於陰分無陽和之氣以懊煦之則滯而不行不能流動乃以當歸之辛溫潤澤者吹噓而助其運行又以川穹升舉之使不專於下趨而後心脾肝腎交得基益四物之所以專為補血者其旨如是若夫臨證之時隨宜進退病偏於陽者宜減歸芎病偏於隧著宜減地芍化裁之妙本非教人拘守此四物一成不變則王海藏之許多六合湯支支節節而為之終未免尚有挂漏矣奇效四物湯治失血內崩當歸酒洗熟地黃芍藥炒川穹阿膠艾葉黃芩炒各一錢箋疏失血成崩虛實寒熱病非一致奇效四物本於準繩以膠地補血芍藥攝陰並用歸芎升舉陷下而以艾葉調氣滯黃芩理血熱本為偏於陽盛者立法則歸芎艾葉宜輕而膩補之膠地必當隨其虛實而量為增損元方七物並用一錢已屬降非然元方下明言治肝經虛熱血沸騰而久不止則藥理頗能精切何堯封於此僅以失血內崩渾淪言之非制方者之本意矣芎歸湯治産後血虛頭痛胎動下血服此即安子死腹中服此即下催生神效亦名常歸湯若腹疼加桂若腹痛自汗頭眩少氣加羊肉婁歸三五錢川芎二錢若為末名佛手散又名一奇散又名君臣散箋疏芎歸二物有陽無陰有走無守抑且川芎疏紲之力極迅惟氣血交滯不利遄行者可暫用之以助運動赦可以試胎古書謂經陰三月莫測是娠是病者以芎歸試之是胎則服湯能動非胎則不動則此方流動之力何等迅疾頤謂胎本安也而無端擾動之弊亦不小如體質柔脆者且恐有墮落之虞究竟是胎是病必有見證堪憑何必冒險妄探或以貽禍此蓋淺者為之高明之士必無取乎此可以止痛脘痛腹痛之氣滯血凝者輕症此方亦效而重亦非二物能盡其妙可開交骨可下胞衣可催生胎可下死胎力量何若而是方之下竟謂以治産後血虛頭痛則血既虛矣孤陽上潛而為頭痛又何可以升舉之歸芎助其激越此抱薪救火之謬説孰謂堯封能為之耶加味芎歸湯川芎當歸各一兩自死龜板一具酥炙生過男女婦人頭髮一握燒存性治分娩交骨不開或五七日不下垂死者每用一兩水煎服良久自下箋疏此治首胎交骨不開之良法歸芎本有關泄之力而以炙酥龜版之下行自解者助之又合以血餘炭之攻破故其效頗捷當歸芍藥散金匱治懷妊腹中㽱痛當歸三兩芍藥一斤茯芩四兩白朮四兩澤瀉半斤芎窮三兩上六味取方寸匕酒和日三服箋疏此脾土卑監而寒水泛溢為病故以白朮培土芍藥斂陰而當歸和血芎窮舉陷更以芩瀉滲泄水道非能給氣滯不行之痛趙注金匱竟為芍藥獨多所以瀉肝似非立方本旨膠艾湯金匱治婦人衛任虛損經水淋瀝及血虛下痢並妊娠腹痛為胞阻各症常歸三兩芍藥四兩乾地黃六兩熟芎窮二兩艾葉三兩阿膠甘草各二兩上七味以水五升清酒三升合煮取三升去渣納膠令消盡溫服一升日三次箋疏此血少而陽氣亦衰不能流利運行致為經事淋瀝不斷或下痢腹痛等疲故以是方補血溫養固攝下焦非能治血熱妄行之淋瀝及濕熱積滯之下痢方下所謂血虛下痢則本非尋常之腸僻可知黃連阿膠湯仲景治傷寒少陰病得之二三日以上心煩不得臥黃連四兩黃芩一兩芍藥二兩阿膠三兩雞子黃二枚生有徐藹輝曰此陰氣為陽熱所灼也用此以收攝其欲亡之微陰故沈謂子煩陰虛火甚者宜服此箋疏此心血既虛而陽邪於之因煩熱而臥寐不安仲景此條之少陰病似以手少陰心立淪非足少陰腎家虛火故以阿膠養心液雞子黃寧心神而芩連瀉其實熱芍藥收攝陰氣惟腎陰虛而相火擾之亦足以使其心煩不臥則此固兩少陰熱熾之主方阿膠雞子黃益陰即所以制陽亢堯封謂子煩為陰虛火甚者亦未始非兩少陰同有之病也祛動大建中湯金匱治心胸中大寒痛嘔不能飲食腹中寒氣上衝高皮起出見有頭足上下痛而不可近者徐藹輝曰心為陽寒為陰寒乘於心陰陽相激故痛寒乘於脾脾冷不消水穀心脾為子母之藏為邪所乘故痛而嘔復不能飲食也蜀椒二合乾薑四兩人參二兩煎去渣入飴糖一升微煎溫服徐藹輝曰陽受氣於胸中陽虛則陰邪得以中之陰寒之氣逆而上衝橫格於中焦故見高起痛嘔不可觸近之症蜀椒辛熱入肺散寒入脾暖腎入腎門補火乾薑辛熱通心助陽遂冷散逆人參甘溫大補脾肺之氣飴糖甘能補土緩可和中所以大祛下焦之陰而復上焦之陽也箋疏此中氣大虛而寒邪泛濫之症陰霾之氣上乘清空汨沒微陽幾於滅絶此非大辛大熱之椒薑何以折服君陰而復離照然非得人參之大力者扶持正氣亦恐小人道長君子道消不易立極奠鰲陽光復闢故三物鼎時顛撲不撓而更以飴糖甘溫緩微大辛之燥烈此建立中州陽氣之大有力者固非彼桂技芍藥之小小建設者所可同日語也小建中湯仲景治傷寒陽脈澀陰脈弦腹中急痛傷寒二三日心悸而煩通治虛勞悸衄裡急腹痛蘿遺精徐藹輝曰三陰下痢而腹痛者裡寒也宜溫也四逆湯附子理中湯腸鳴泄瀉而痛者裡虛有寒也宜小建中散中散寒悸者陽氣虛也煩者陰血虛也與此湯先建其里倍芍藥者酸以斂陰陰收則陽歸附矣喻嘉言曰虛勞病至於亡血失精精血枯稿難為力矣急宜建其中藏使飲食進而陰血旺故但用稼澀作甘之味生其精血而酸辛鹹苦絶所不用舍是無良法也桂枝生薑三兩甘草一兩炙大棗十二枚芍藥六兩入飴糖一升微火解服此即桂枝加芍藥湯但桂有厚薄耳其不名桂枝加芍藥而名建中以飴糖為君也今入用建中者不用飴糖失仲景遺意矣不去薑桂所以散邪吳鶴皋曰桂枝味薄用以解表桂味厚用以建里箋疏仲景此方為中陽虛餒陰氣散漫無制而設陽脈澀則陽綱不振可知陰脈弦則君陰用事將有汨沒陽光之慮古人以弦為陰脈者其旨如是此與肝膽陽強弦數有力之弦脈不同惟其陰盛故腹中急痛方即桂枝湯而倍芍藥則陰藥為主能引桂枝入陰故一變其御外寒和榮衛之作用而以建立中州之陽氣且芍藥能收攝散漫之陰氣則桂枝既能溫中而又得芍藥以收拾陰霾故治腹痛況又有甘棗飴糖甘溫以和緩之乎其又治心悸而煩者則煩非熱煩悸而挾有水氣是中陽虛而腎水上衝故心悸而煩仲景書中凡言悸者多挾寒水之邪皆以桂伐腎水如發汗過多其人叉手自冒心心下悸欲得按者桂枝甘草湯主之發汗後其人臍下悸者欲作奔豚茯芩桂枝甘草大棗湯主之以及欲作奔豚氣從少腹上衝心者與桂枝加桂湯皆以桂枝治悸其義可知則小建中之治心悸可以類推其虛癆而悸者亦中氣虛寒水邪上泛也蓋古之虛為多屬虛寒乃陽虛之症皆是陰虛火炎者絶端對峙故兼有裡急腹痛其為中陽無權又可知則衄亦虛寒而陰不能守所致其淫夢失精皆屬陽虛皆與今人相火不藏之虛勞相反若陰虛陽越為衄為遺則涵斂養陰攝納浮火猶虞不及何可再以桂枝辛溫擾動之此臨症時所當辨別病情而萬不可效顰西家謬謂吾能學古者也喻嘉言論虛勞亡血失精僅甘能生血尚是渾淪吞棗胡可為訓黃耆建中湯金匱治虛勞諸不足準繩血不足而用耆耆味甘大能生血此仲景之妙法蓋稼澀作甘甘能補胃冒為氣血之海氣血所從生也即補血湯耆五倍於當歸之義即前方加黃耆兩半黃耆易當歸名當歸建中湯治産後虛羸不足腹中痛引腰背小腹急若崩傷不止加地黃阿膠箋疏此治虛勞皆虛寒也若今人虛火而妄用之即是抱薪救火當歸建中之産後虛羸者亦然而今之産後又多陰虛陽亢得此無殊鴆毒理中湯仲景治傷寒太陰病自利不渴寒多而嘔腹痛糞溏脈沈無力或厥冷拘急或結胸吐寒蛔及感寒霍亂白朮陳壁上炒二兩人參乾薑炮甘草一兩炙每服四錢本方等分蜜丸名理中丸附子理中湯治中寒腹痛身痛四肢拘急即前方三兩加附子一枚補中湯治泄瀉瀉不已者加附子理中湯加陳皮茯芩改加青皮陳皮名治中湯治大陰傷寒腹滿痞悶兼食積者箋疏此三方皆中氣虛寒之正鵠其理中治塞之吐瀉輕症而近年多直中三陰之真寒霍亂非大劑四逆湯不能挽回什一則必非古法所能療亦讀古書者之不可知王盂英陸九芝兩家在同治初元治霍亂時疫皆言是熱霍亂九芝且謂屬熱者十之九屬寒者十之一然頤三十來所見是症幾無一不屬於真寒者此可知時連遷移僅三十餘年而症情實已大異頤不敢謂九芝所見之偏若在近今之霍亂豈盂英論中之蠶矢湯駕輕湯等數方可能勝任耶東垣別有補中湯乃升麻柴胡當歸蒼朮麥芽澤瀉黃耆甘草五味子神麯紅花與此大異四逆湯仲景治三陰傷寒身痛腹痛下痢清穀惡寒不汗四肢厥冷或反不惡寒面赤煩躁裡寒外熱或乾嘔或咽痛脈沈微細欲絶附子一枚生用乾薑一兩甘草二兩炙冷服面赤者格陽於上也加蔥九莖以通陽腹痛者真陰不足也加芍藥二兩以斂陰咽痛陰氣上結也加桔梗一兩以利咽止痛脈不出加入麥二兩以助陽補氣血嘔吐加生萋二兩以散逆氣上皆通脈四逆湯加減之法箋疏此三陰之真寒腹痛下痢四肢逆冷之主方附子生用欲其力大而專故不炮製以縛賁育之手足其用甘草者本以調和其燥烈之氣焰但陰霾太盛汨沒微陽者即宜獨任薑附而除甘緩庶可犁庭掃穴直搗中堅而嘔吐者甘藥尤為大禁方中注以冷服二字本非仲景所固有蓋以為上有假熱者立法如下利足冷而反有咽痛齒痛面熱頭紅諸症者是若無假熱即當溫服其面赤者是為戴陽乃陰陽之氣格拒不入故亦稱格陽加蔥莖之辛散者以通達氣機則薑附之善守者亦藉其氣而周流不滯腹痛是陰氣散漫故加芍藥以涵斂之此藏陰之耗散故以陰藥同類相求恢復真氣非以芍藥治中下之塞若謂腹痛是陰寒之邪則何得反投陰藥可以止痛此藥理精微之最易誤會者不可不察咽痛亦是格陽於上陰陽二氣不相融洽桔梗苦泄宣過藉以調和陰陽杆格乃開泄府藏之格拒以溝通陰陽於裡者正典蔥莖疏達脈絡之格拒以溝通陰陽之表者各盡其妙故面赤咽痛同是格陽而一表一里病情不同則引導之藥亦復大異古人選藥如是其至精至當實非後人所能探索而説者僅以桔醒利咽止痛尚覺渾侖吞棗未知真味若如潔古張氏竟謂仲景甘桔治咽而謂枯梗是升浮之藥且曰譬如舟枳載藥上浮諸藥中有此一物則藥力即專治其上不能下沉云云試以通脈四逆加桔梗之理思之咽痛已是格陽在上若果桔梗能載薑附上浮豈不助桀為虐本經具在奚有此説潔古之言寧非大誤頤所以調金元諸大家議論多有未可恃者無如俗人寡陋喜其卑而易行簡而易記反以此等無稽之言作為鴻寶甚且無一人不深印腦經永為法守宜乎此學之日以頽敗矣利止而脈仍不出是大泄之後陰液耗竭府藏乾枯故脈絡空虛不能自起此非人參之大力能補五臟真陰者不能充血液麵復脈非以其陽猶未回而以人參作回陽用且方中本以薑附為主已是回陽上將古方精義其旨可尋而此條方後竟曰加參補陽是踵明人之陋陳修園謂仲景諸方凡用人參皆在既汗既下之後惟其陰液已傷故用參以滋津液參是陰藥並非陽藥云云是深得古人真旨者細繹邃古用藥之理確乎不易奈何自明以來君謂參能回陽氣於無何有之鄉果爾則古人四逆正方何以反無人參耶嘔吐是寒氣上逆四逆湯之薑附能守不能走溫中有餘降逆不足生薑散寒而降逆上之氣自與薑附不同仲景治嘔無不加此一味然惟寒邪為患及挾寒飲者宜之若今之嘔吐則多胃熱氣湧之症不可不審如謂仲師聖法可以通用則趙括之亞矣真武湯仲景治少陰傷寒腹痛小便不利四肢重疼痛自下利者此為有水氣或咳或嘔或小便利及太陽病發汗汗出不解仍發熱心悸頭眩筋惕肉瞤振振欲劈地氣寒惡寒此亦腎中陽虛見症仍屬少陰方名真武蓋取固臂之義附子一枚炮白朮二兩炒茯芩三兩芍藥三兩炒生薑三兩水寒相搏咳者加五味子細辛乾薑小便利去茯芩下利去芍藥加乾薑嘔去附子加生薑一倍箋疏真武乃水神之名少陰病而腹痛下利小便不利四肢沉重疼痛是寒水不安其位泛溢上凌幾有匝地滔天壞山襄陵之勢此非得水家神將坐鎮北方何以砥柱中流奠安巨浪附子辛溫剛烈斷推鎮攝陰霾之上將直入腎藏固護兀陽即以白朮實脾堤水而又重任芍藥作陰分之嚮導以收攝其散漫之陰氣乃佐以茯芩滲泄下趨導之去路則水歸其壑而腎陽復辟錫玄圭以告厥成功是亦神禹鎖縶巫支祁之絶大作用也太陽病發汗過多傷其心液引動腎中寒水泛濫上僭水氣凌心故為心悸陰居陽位故為頭眩君陰川事心陽無依故為筋惕肉瞤振動不息此其病狀與上條各各不同而其父寒水之邪則一故亦主以是方於此可知治病之法但當於病理中求其真詮則披大郤導大窽無不迎刃而解彼徒於見證上支支節節而為之者又何足以知此附十湯伸景治少陰病身軀痛手足寒骨節痛脈沈者及少陰病得之二三日口中和背惡寒者前方去生薑加人參二兩箋疏此證又皆少陰寒水之邪故治法仍與真武湯方無甚出入烏梅丸仲景治傷寒厥陰證寒厥吐蛔傷寒藏厥打死藏厥脈微而厥至七八日膚冷發躁無暫安時也蛔厥者蛔上入膈則煩須臾復止得食則嘔而又煩蛔聞食臭復出也此為藏寒當與此丸溫藏安蛔亦治胃府發咳咳而嘔嘔甚則長蟲出亦主久利烏梅三百個細辛桂枝人參附子炮黃檗六兩黃連一斤乾薑十兩川椒去汗當歸四兩苦酒醋也浸烏梅一宿去核蒸熟和藥蜜丸箋疏厥陰為三陰之盡本是陰分自多寒證而陰之盡即是陽之初陰陽遞嬗之交即生生不息之機寓焉且風木之藏涵有相火故厥陰之動又多陽病烏梅丸專治厥陰寒劂自必以薑辛桂附川椒之辛溫剛燥為主而即佐之以連柏苦寒互用溫涼最是別開生面此中機栝如可思又以將軍之官性情剛暴辛燥之藥恐助橫決則更以烏梅苦酒之酸收者柔馴之一劑之中而剛柔寒熱參錯其間治厥陰病者均可以此化而栽之量為增損無餘蘊矣蛔亦感風木之氣化而生故為厥陰之病大辛大苦均是殺蟲利器而古人必謂之安蛔不肯説出一個殺字者皆誤認蛔蟲是吾身必有之物似乎不當聚而殲之者究竟此非應有之物所謂蝨生於吾而吾非蝨父母蝨非吾之子孫者何有不可殲滅之理此方治蛔本以殺蟲安於何有其亦治嘔甚及久利者嘔固厥陰之氣上逆久利亦厥陰之疏泄無度辛溫攝納而苦以堅之中樞有權庶不上泛下泄惟病家體質虛實寒熱各有不同則亦不必呆守成方是在臨證時消息而量度之古人固未嘗不許吾斟酌而損益之也祛風小續命湯千金治中風不省人事神氣潰亂半身不遂筋急拘攣口眼喎斜語言蹇澀風濕腰痛痰火併多六經中風及剛柔二痙亦治産後中風論見前麻黃去節杏仁去皮尖炒研桂枝白芍酒炒甘草炙人參川芎黃芩防已各一兩防風兩半附子半兩炮去皮膚每服三錢或四五錢加薑棗煎溫服取微汗筋急語遲脈弦者倍人參去芩芍以避中寒服後稍輕再加當歸煩躁不大便去桂附倍芍藥加竹瀝熱去附子入白附子亦可如不大便日久胸中不快加大黃枳殼如藏寒下利去黃芩防已倍附子加朮嘔逆加半夏語言蹇澀手足戰掉加菖蒲竹瀝身痛發搐加羌活口渴加麥冬花粉煩渴多驚加犀角羚羊角汗多去麻杏加白朮舌燥去桂附加石膏參丹溪心法箋疏中風一症自金匱以後無不以外風立論且無不以為肅殺之寒風故千金外臺兩書續命湯方多以百計無一不麻桂羌防薑辛烏附者然既用大辛大溫為主而又多合以清涼之藥甚至犀羚石膏恆與桂附烏雄雜然並列已是莫明其妙而金元以來説到西北有真寒東南多濕熱痰一層乃有真中類中之分始稍稍判一界限然所言治法仍惟以續命等方推為前列藥不對症將誰適從所以二千餘年凡論是症莫不撲朔迷離無可究結終未兒一明白瞭解可以起而能行行而有效者直至近今西學家有血沖腦經之説始知素問所謂血菀於上使人薄厥又謂血之與氣並走於上則為大厥諸條早已露其端倪而張伯龍雪雅堂醫案惟以潛降鎮攝為治者始有捷效則病本內因且是風火而自古迄今恆以外風外寒論者寧非大謬古人治案尚稱投以續命而獲效者更是何説頤未當久居西北領略彼方風上雖不敢謂伊涼燕趙之域必無此大寒大風為患而以二十餘年所見之症參之則固無一非內因病也已專輯中風斠詮一編備論源委而如是方之下所述諸症潰亂不省半身不遂筋急拘孿喎斜謇又澀無一非氣血沖腦擾犯神經失其知覺運動之病而謂疏表溫中可以得效其何敢信且藥則麻防附桂而曰可治痰火併多更不知為此説者持何理由豈以方中自有芩芍遂可不問桂附所以景嶽已謂水火冰炭道本不同縱有神功必不心服尚覺稍分涇湄至古今各家皆謂此方通治六經中風雲云則自金匱有在經在絡入腑入臟之區別而後之説者莫不以中經絡中腑中臟分為三綱見續命方中有麻桂芍芩有似於傷寒之太陽陽明條理遂謂是方可治在經之風而潔古老人且有六經加減一似聖經賢傳確不可易究之昏亂不省不遂不仁口眼喎斜言語譽澀諸症柯者有合於六經之一而續命湯中諸藥又何者可治不省不遂謇澀喎斜之病一為説破當必瞪目而莫明所以抑且三因百病固不能跳出六經範圍而惟此則病在腦經卻不可拘於六經恆例易老逐經加減冀求弋獲實是無此病情添足畫蛇未免辜負他一番苦心孤詣而彼此夢夢依樣葫蘆譬猶群冒談天手舞足蹈那不令人笑倒至若剛柔二痙亦皆腦經震動為病必不能強以太陽之經妄為比附古人麻桂葛根之法萬萬不能適用在産後得之則陰虛陽越又節素問之所調上實下虛為厥巔痰者亦豈麻附防風之所堪妄試者耶獨活湯丹溪治風虛瘛瘲昏憒不覺或為寒熱獨活羌活防風細辛桂心白薇當歸川芎半夏人參茯神遠志菖蒲各五錢甘草二錢半炙每服一兩加薑棗煎箋疏此亦古人誤會之成方苟非真有寒風此法皆不可妄試然方下卻謂風虛云云則又似因虛而風動者是即陰虛於下而陽越生風似此溫燥半升何一非虛家鴆毒愈風散華他治産後中風口噤角弓反張亦治血暈不省人事四肢強直見産後角弓類名如聖散箋疏荊芥治風固亦為外風言之然既炒成炭復有何用古人雖皆曰神奇而按之藥理病情斷不能特則又何敢輕信化痰二陳湯局方治一切痰飲為病咳嗽脹滿嘔吐惡阻頭弦心悸半夏薑製二錢陳皮去白茯芩一錢甘草五分加薑煎半夏陳皮貴其陳久則無燥散之患故名二陳箋疏此為治痰通用之成方二陳化痰人盡知之茯芩本為疏滌痰飲之主藥唯市肆中物皆是培植而生故鮮實效加生薑者亦滌飲也惟甘草甜膩正是相反此當去之半夏茯芩湯干金治妊娠惡阻煩悶吐逆惡食頭弦體重惡寒汗出等症半夏生薑各三十銖乾地黃赤茯芩各十八銑橘皮旋覆花細辛人參芍藥芎窮桔梗甘草各十二銖車氏祗用八味去細辛川芎桔梗之升提芍藥之酸斂尤為盡善右十二味㕮咀以水一斗煎取三升分三服若病阻積月日不得治及服藥冷熱失候病變客熱煩渴口生瘡者去橘皮細辛加前胡知母各十二銖若變冷下利者去地黃入桂心十二銖若食少胃中虛生熱大便閉塞小便赤少者宜加大黃十八銖去地黃加黃芩六銖餘依方服一劑得下後消息看氣力冷熱增損方更服一劑湯便急使茯芩丸令能食便強健也忌生冷醋滑油膩方論見惡阻門箋疏惡阻皆氣逆挾痰甘地膩滯必不可投細辛升陽惟胃寒者宜之痰熱不用茯芩圓千金茯芩人參桂心熬乾薑半夏橘皮各一兩白朮葛根甘草枳實各二兩右十味蜜丸梧子大飲服二十丸漸加三十丸日三次肘後不用幹薑半夏橘皮各一兩白朮葛根止用五物又云妊娠忌桂故熬箋疏古人多寒症故方中有薑桂非今人所宜葛根升舉胃氣亦與嘔家相反善學古者必不可渾侖吞棗又方此在景嶽全書名竹茹湯治孕婦嘔吐不止噁心少食服此止嘔清痰青竹茹橘皮各十八銖茯芩生薑各一兩半夏三十銖右五味水六升煮取二升半分三服箋疏此乃熱痰互阻泛溢啞嘔之專劑橘皮湯千金治妊娠嘔呸不下食竹茹橘皮人參白朮各十八銖生薑一兩厚朴十二銖制右六味水七升煮取二升半分三服附參金匱軍用橘皮湯又橘皮三升竹茹二升人參一兩寸草五兩炙生薑半斤大棗三十枚名橘皮竹茹湯均治噦述後人又因金匱加半夏赤芩枇杷葉亦名橘皮竹茹湯治虛人嘔逆箋疏此即上方之所自出胃虛有熱而上逆者宜之六神湯治産後痰迷神昏膽語惡露不斷者甚或半身不遂口眼歪斜方論見前産後案中杜刮橘紅石菖蒲半夏粬半夏亦可膽星茯神旋覆花各一錢水煎清服箋疏此方專於化痰降逆而能治産後神昏譫語甚至不遂喎斜者竟能捷於影響豈非降其逆上之氣火而神經自安觀此前之録小續命者益可知是古人舊注必不適用理氣紫蘇飲嚴氏治胎氣不和湊上心胸腹滿痛悶名為子懸懷胎至四五月君相二火養胎熱氣逆上之故紫蘇一兩腹皮人參川芎橘皮白芍當歸三分甘草一分銼分三服水一蓋生薑四片蔥白煎去渣服一方無川芎名七寶散汪認庵醫方集解載此蘇葉止一錢當歸七分甘草二分餘皆五分箋疏此古今治子懸之主方論已見前天仙藤散陳景初制本名香附散治子氣腫脹天仙藤即青木香藤洗略焙香附炒陳皮甘草烏藥木香等分銼末每服五錢加生薑三片紫蘇五葉水煎日三服腫消止藥汪本無木香有木瓜三片箋疏此治氣脹而無水者然腫脹必挾積水以絡中無水亦不大脹則必以開肺氣通小水為主專用氣藥究竟鮮效木香散王師復治妊娠四五月後胸腹間氣刺滿痛或腸嗚嘔逆減食此由忿怒憂思飲食失節所致莪朮木香丁香甘草鹽陽下箋疏此治中氣虛寒之法故有丁香非脹痛者必以此為主藥抑氣散丹溪治婦人經將行而痛氣之滯也四物加胡索牡丹皮條芩箋疏痛在經前必不可膩補此方非良法又柳氣散嚴氏治婦人氣盛於血變生諸證頭暈脘滿香附四兩陳皮一兩茯神甘草研為末每服二錢箋疏所謂氣盛氣之滯也故用藥如是抑青丸大瀉肝火治左脅作痛婦人怒氣傷肝胎氣上逆致嘔逆水飲不能入黃連一味吳萸湯浸一宿為丸箋疏此惟肝膽火熾者宜之方名抑青所主在是然非有宣導氣分者佐之亦嫌遏郁不能靈遍代赭旋覆湯仲景治傷寒發汗若吐若下解後心下痞鞭噫氣不除慮邪雖解胃弱不和虛氣上逆故也又周楊後曰余每備以治反胃噎食氣逆不降者神效活入云有代赭旋覆證氣虛者先服四逆湯胃寒者先服理中湯後服此方為良旋覆花三兩代赭石一兩人參二兩甘草三兩半夏半升生薑五兩大棗十二枚箋疏此斡旋中州氣滯而鎮攝其上壅之逆最能桴應仲景本治汗吐下後之噫氣故有參甘大棗若在虛人雜病中參固宜也惟有痰窒則須去甘棗耳旋覆花湯金匱旋覆花蔥新絳箋疏此疏達肝家結滯通絡和血之方尤在涇謂旋覆花治結氣去五藏間寒熱通血脈蔥主寒熱除肝邪絳帛入肝理血者也逍遙散局方治血虛肝燥骨蒸潮熱口乾便澀月經不調柴胡當歸酒拌白芍酒炒白朮土炒茯苓各一錢甘草炙五分加煨薑薄荷煎本方加丹皮梔子名加味逍遙散箋疏此為肝絡鬱結窒塞不宣變生諸症故以柴胡疏泄鬱氣經所謂木鬱達之者故名逍遙肝木既滯窒而不通則必鬱而化火故加味丹皮梔子若肝膽氣火橫逆勢已猖狂而復用此則教猱升木為害尤烈小柴胡湯仲景治傷寒中風少陽證往來寒熱胸脅痞滿默默不欲食心煩喜嘔或腹中痛或脅下痛或渴或咳或利或悸小便不利口苦耳聾脈弦或汗後餘熱不解及春時嗽發瘧寒熱婦人傷寒熱入血室小紫胡在經主氣在藏主血故更能入血室柴胡八兩半夏半升人參甘草黃芩生薑三兩大棗十二枚箋疏仲景以此為傷寒少陽經之主方本為寒邪外柬少陽之氣鬱遏不宣故為寒熱往來其寒之不已者正其表邪未解之明徵則雖已傳少陽而仍當升散解表柴胡稟少陽春升之氣宣達木鬱見其專職其症則口苦耳聾目眩胸脅痞滿默默不欲食心煩喜嘔或脅下硬滿而痛或腹痛無一非肝膽之氣為寒邪所郁故以此升而達之斯少陽之氣得宣而諸證可解若至溫病熱病則本非寒邪而為此諸症又皆少陽相火有餘橫決肆虐此則清紲宣通猶虞不及而謂可以柴胡升散助其發揚吾知仲景處此必不若是此古今病情之絶不相同者雖見症亦復無異而病理適得其反奈何宋金以逮元明恆以柴葛等方通治溫熱之少陽經病則功不補患為禍且有不可勝言者讀近人治案為利為弊鑿鑿可據是亦讀古書之必不可不變通者況乎今之胸脅滿痛默默欲嘔者更無一非痰熱交肆其虐而復以柴胡升之參甘大棗膩之其害更捷於眉睫而篤信好古者不悟也不亦怪哉又按瘧之為病挾痰挾積者十而八九惟開泄化痰最為捷效然嗜古者亦必曰小柴胡乃治瘧聖法弊又不可勝言惟虛人發瘧其發日晏而汗多無痰舌苔清楚者則為陽陷入陰非柴胡升舉之不可此則東垣補中益氣成方重加首烏投之即應而舌膩胸滿者又是相反此豈可一例論者而近今作家或如徐靈胎輩則曰非柴胡不可治瘧而宗葉天士者又謂必不當用柴胡是兩失之矣婦人傷寒熱入血室其可用小柴胡者尤其百不得一然徐洄溪猶未知此理更何論乎自槍以下堯封是書前録數案皆以小柴胡而變劇者豈非殷鑑而於此尚復糊糊塗塗直抄仲景元文是何可食而不知其味者後有好古之土尚其慎思而明辨之理血小薊飲子治男婦下焦熱結尿血淋漓溺痛者為血淋不痛者為溺血論見妊娠經來類小薊蒲黃炒藕節滑石木通生地梔子炒淡葉當歸甘草各五分箋疏此血淋溺血通治之方清血熱通水道雖無甚深意以治濕熱蘊結頗有捷效導赤散錢氏治小腸有火便赤淋痛論見帶下類生地黃木通甘草淡竹葉等分煎箋疏小水熱赤本是膀胱蘊熱與小陽無異此方木通竹葉只以清導膀胱之熱而方名導赤者制方者意中非以導去小便之黃赤蓋謂小腸屬火而清導之古人無不誤認小便從小腸而來故方下徑曰治小腸有火實是大誤不可不正血極膏羅謙甫治婦人汙血凝滯胞門致成經閉論見經閉類大黃一味為末酷熬成膏服之利一二行經血自下箋疏大黃本是逐淤破血之猛將一味獨用其力尤足將軍固專間材也蕩胞湯千金治二三十年不産育胞中必有積血論見求子門林硝丹皮當歸大黃桃仁生用各三銖厚朴桔梗人參赤芍茯芩桂心甘草牛膝橘皮各二銖附子六銖虻蟲水蛭各十枚右十七味㕮咀以清酒五升水五升臺煮取三升分四服日三夜一每服相去三時覆被取微汗天寒汗不出著火籠之必下膿血務須斟酌下盡二三服即止如大悶不堪可食酢飯冷漿一口即止然恐去惡不盡忍之猶妙箋疏千金求嗣門調經諸方治婦入多年不育每用攻血破淤之品以為不孕之故必有積淤停滯胞門若有非去其垢不可者然在豐年壯實之體固有停痰積淤一症對病用藥本無不可若在柔脆瘦弱之人本以坤道不厚不能載物亦胡可一概而論是在臨證時消息求之雖不能孟浪從事要亦不必因噎廢食也奪命散治産後惡露不行眩暈昏冒論見産後眩暈門及惡露不來沒藥去油二錢血竭一錢共研末分兩服糖調酒下箋疏産後惡淤窒而不行以致地道不通氣火上冒而為眩暈昏憒自宜攻破下行庶可奠定其上升之逆方用沒藥血竭二味尚是和平中正之藥惟引用砂糖雖能活血導淤尚嫌膩滯所當審慎如在炎天更為禁品王盂英當再三言之亦産母房中不可不知之訣而酒能上升更非所宜制方之人僅欲其通經迅速而不悟眩暈氣升者得之為害將不可設想按産後淤血名為惡露由來舊矣初不知何以而得此命名蓋露乃取發見於外之義此是淤垢可去而不可留則不宜藏而宜於露故新産用藥必參用攻破導淤之品其所去無多而本無澀滯者終是少數此等方即非昏眩亦尚可投惟亦有去血已多而陰虛陽越之昏冒則必以潛陽鎮攝為治大虛者且非補不可亦非此二味之可以無往不宜者也奪命丹良方治淤血入胞脹滿難下急服此節消胞衣自下徐藹輝曰似與前論惡閉致喘證未對姑列此以俟再考附子炮半兩乾漆碎之炒煙盡牡丹皮各一兩右為細末另用大黃末一兩以好酷一斗同熬成膏和前藥丸桐子大溫酒吞五七丸一方有當歸一兩箋疏是方惟以逐淤為主然乾漆終嫌有毒以治胞衣不下非穩妥之法徐謂奧前論淤阻作喘一證不對確是兩不相符但破淤之意亦尚不通花蕊石散治血入胞衣脹大不能下或惡露上攻或寒凝惡露不行花蕊石四兩硫黃一兩研細泥對煆赤服一錢童便下又葛可久花蕊石散治略同上花蕊石煆存性研如粉以童便一盞男人入酒少許女人入醋少許煎溫食後調服三錢甚者五錢能使淤血化為黃水後用獨參湯補之非寒凝者不宜此箋疏花蕊石專於破淤和劑局方已有成例乃溫遍之峻劑也無極丸治惡露不行發狂譫語血淤之重者錦紋大黃一斤分作四份一份用童便兩碗食鹽二錢浸一日切曬一份用醇酒一碗浸一日切曬再以巴豆仁三十五粒同炒豆黃去豆不用一份以杜紅花四兩泡水一碗浸一日切曬一份用當歸四兩人淡醋一腕同浸一日去歸切曬為末錬蜜丸梧子大每服五十丸空心溫酒下取下惡物為驗未下再服箋疏是方出李瀕湖本草綱目引醫林集要云此武當高士孫碧雲方也治婦人經血不通赤白帶下崩漏不止腸風下血五淋産後積血症瘕腹痛男子五勞七傷小兒骨蒸潮熱等症云云本是專為通經逐瘀而設其帶下崩漏腸風下血等症亦必有惡瘀積滯者始可用之非以概治盧不能攝之帶下崩漏便血可知若五勞七傷骨蒸潮熱則雖是虛勞而經絡之血已為熱勢灼爍盡成淤滯古人多用宣通破瘀之法正以瘀不去則新不生除舊乃所以布新固非畏虛養癰者所可同日而語然亦必其人正氣未泯足以勝任方可背城一戰若不量體質而貿然投之則適以速其絶矣堯封以治産後淤滯發狂正以淤結甚熾氣火極盛非此猛將急投不能去病或有陰虛陽越並血困淤阻者亦當審之失笑散局方治惡露不行心包絡痛或死血腹痛不省人事蒲黃五靈脂淨者等分炒為末煎膏醋調服或用二三錢酒煎熱服箋疏此方治瘀血心腹痛甚有捷效而産後作痛尤為合宜如神湯治瘀血腰痛下注兩股如錐刺延胡當歸肉桂等分水煎服箋疏此溫通行瘀之法與無極丸血極膏之苦寒治證各別惟在善用者臨證擇之二味參蘇飲人參蘇木此亦新産行瘀之一法正氣已衰而瘀滯未去者宜之清魂散嚴氏治産後惡露已盡忽昏暈不知人産後氣虛血弱又惑風邪也澤蘭葉人參各二錢半荊芥一兩川芎五錢甘草二錢右為末用溫酒熱湯各半蓋調灌一二錢能下咽即眼開更宜燒漆氣淬醋炭於床前使聞其氣箋疏惡露已盡而忽昏冒此真陰大耗而孤陽上越沖激腦經也故方用人參然此是陰虛之內風陡動非可誤作外風荊已非所宜而乃妄用辛升之川芎酒以助其浮越最是古人誤認內風為邪風之通病於嚴用和何尤然在今日腦神經病之原由昭然共曉則古方中似此之類不可不一律劃除淨盡伏龍肝散治大小産血去過多不止伏能肝箋疏産後血去過多不止此非大補真陰而大封大固不可救急者此方一味雖亦可以溫中固澀然力量甚薄安得有恃無恐病重藥輕而令病人不起亦何嘗非醫者殺之能肩大任之人當不以此言為河漢黑龍丹亦名琥珀黑龍丹治産難及胞衣不下血迷血暈不省人事一切卮急惡候垂死者但灌藥得下無不全活亦治産後疑難雜證案見奇證中當歸五靈脂淨者川芎良薑熟地各二兩銼碎人砂鍋內紙筋鹽泥固濟火煆過百草霜一兩硫黃乳香生二錢琥珀花蕊石各一錢為細末酷糊丸如彈子大每用一二丸炭火煆紅投入生薑自然汁中浸碎以童便合酒調灌下箋疏此又溫通逐瘀之一法瘀積而不宜苦寒者用之外科托裡散治一切惡瘡發背疔疽便毒始發脈弦洪實數腫甚欲作膿者亦治産後瘀血將成膿論見前金銀花當歸二兩大黃朴硝花粉連翹牡蠣皂角刺三稜黃芩赤芍二錢每五錢半酒半水煎箋疏此方在瘍科書中每以為消毒退腫適用之方其實瘍患之屬寒屬熱萬有不齊安有預定一方可以通治百病之理且人體虛實又復各別是方清熱為主可以治實熱之重疲然用酒煎又為熱瘍之大害惟方下所謂治疔毒而脈弦洪實數欲作膿者數言庶可近似乃又雜之以發背一症則須知始發一粒如黍粒而漸以堅腫屑背板滯者方是背疽萬無可用涼藥之理方中諸味直同鳩毒而又雜之以亦治産後瘀血將成膿一句則産虛敗瘀入絡誠有堅腫為瘍之一候治之之法只有通經行瘀而參之以溫和燠煦則可消散誤授清涼適以助其凝結況乎硝黃翹芩一派大苦大寒而可以妄試乎且産後瘀血成癰亦不應有弦洪實數之脈如有之則為壞症堯封於瘍科初無經驗故有此枘鑿不入之門外語然豈不知産後之脈靜者為吉躁者為凶耶是何可以不正蠟礬丸治一切瘡癰惡毒先服此丸護膜托裡使毒木攻心或為毒蟲蛇犬所傷並宜服之黃獵兩白礬一兩先將蠟熔化候少冷入礬和勻為丸酒下每服十丸二十丸漸加至百丸則有力瘡愈後服之亦佳箋疏此丸亦向來瘍科所謂護膜解毒之良方謂毒邪甚盛恐其內陷攻心及膿成皮裡膜外恐其潰深穿膜者此丸皆可以保之礬取其澀蠟取其滯看似未嘗無理實則蠟最礙化礬燥且澀大傷胃氣而毒果甚者反以助其堅凝又安有清解之可説且膿成膜外藥走胃腸又何緣而能護膜乃謂可服至百丸之多其謬已極而瘍科書中皆盛稱三似必不可無之耍藥則多是理想之謬要之蠟礬黏澀非能如縫者之補綴垮者之畫像可以直黏心膜而保護之斯真耳食之見矣太乙膏丹溪治癧子瘡神效腦子一錢研輕粉乳香各二錢研麝查三錢研沒藥四錢研黃丹五兩右用清油一斤先下黃丹熬用柳枝欖又用憨兒蔥七枝先下一枝熬焦再下一枝蔥盡為度下火不住不攬覷冷熟得所入腦子等藥攬勻磁器盛之用時旋攤箋疏此即今治瘍家通用之薄貼潰也未者可另加退消藥物為消毒用已潰則另加藥物為提毒去腐用至毒盡新生膿水已淨時則即不另加藥亦可生肌收口蓋丹粉乳沒俱有點級之力本能生新惟腦麝太多亦甚無謂而不能貧富共之即減去十之七八亦無不可但此是治外之法而古書中竟有用作丸服以治腸胃生癰者能泄導膿淤極有奇效則黏膩之質適與攻淤相反且非腸胃本性之相習必不可信瘍醫家言常常有此怪不可識之議論多與病理自相矛盾者此頤所以恆謂通行之瘍科各書無一善本也潤下麻仁丸仲景治便難脾約大黃四兩蒸厚朴枳實即大承氣無芒硝也麻仁一兩一錢杏二兩二錢去皮麩妙芍藥蜜丸梧子大每服三五十丸溫水下丹溪書名仁脾約丸麻仁丸丹溪治同上兼治風祕郁李仁麻子仁各六兩另研大黃一兩半以一半炒山藥防風松殼七錢半炒檳榔羌活木香各五錢半蜜丸格子大服七十丸白湯下箋疏兩方潤燥滑腸功力相近至邇時則多用前明吳興陸氏之所謂潤字丸其藥味效用亦約略相似方見陸氏三世醫驗近紹興新出之廣溫熱論亦有之但醫驗所載之治案文字淺陋於病理亦時時矛盾且最多剿襲雷同之弊本非佳作則其方亦不甚可信故廣筆記已言傳之不真或陸氏當時自制此方而祕不肯傳亦可見富時醫界所見之小矣平胃散局方治脾有停濕痰飲痞膈宿食不消滿悶溏瀉加朴硝善腐死胎論見産類蒼朮泔浸五斤厚朴薑製炒陳皮去白各三斤甘草三十兩炒右之末每服五錢加薑三片棗一個煎入鹽一捻沸湯點服亦得見丹溪書疏箋此本燥濕之佳方以胃有濕痰則運化疲而不思納蒼朮厚朴善於除濕而醒胃氣名曰平胃所以振動其消化之作用也乃女科家每謂以是方加朴硝能使死胎腐化而下則服藥以蕩滌腸胃豈能腐到腸胃以外之胎其説己不近情用胎之所以死者具有種種原因豈一味朴硝所可概治前卷引聖濟論子死腹中一條已明言其故矣胎産安胎方黃耆蜜炙杜仲薑汁炒茯芩各一錢黃芩一錢五分白朮生用五分阿膠珠一錢甘草三分續斷八分胸中脹滿加紫蘇陳皮各八分下紅加艾葉地榆各二錢並加多阿膠引用糯米百粒酒二杯煎服腹痛用急火煎箋疏胎動不安多由於內熱擾之而土德不健失其坤厚載物之職亦其一因故丹溪有言黃芩白朮安胎聖藥是方即本此意而以黃耆阿膠養血而舉其氣杜仲續斷黏韌以固其基制方之義簡而能賅確是安胎之善法但臨用時亦當相其人體質之寒熱虛實而增損之尚非可以一概而施方後謂胸中脹滿加紫蘇陳皮即治子懸之法則方中之耆必非所宜下紅加艾葉地榆甚是惟引用糯米嫌其膩滯且失之柔又用酒煎則更非穩妥之道矣保胎神佑丸此方屢驗一有孕節合起每日服之凡易滑胎者自無事且易産白茯芩二兩於朮一兩米泔浸一日黃土炒香條芩一兩酒拌炒香附一兩童便浸炒延胡一兩米醋炒紅花一兩隔紙烘乾益母草淨葉去梗一兩真沒藥三錢瓦上烙干去油右為末蜜丸桐子大每服七丸白滾水下若胎動一日可服三五次切不可參服一丸至囑徐藹輝曰胎滑自是血熱動胎之故方中紅花行血延胡走而不守恐非保胎所宜況已有香附行氣氣行血自不滯何取動血之品宜去之為穩王盂英曰每服七丸故有奇效而無小損也毋庸裁減又曰神佑丸兼能調經種子大有殊功箋疏方用芩術仍是丹溪成法內熱者宜之而肥白氣虛者亦不必泥延胡雖曰能走然運動血中之氣亦與香附相近世皆以為破血行血猛藥殊覺言過其實尚可無慮惟紅花未免無謂蓋富貴之家一覺成孕即萬分謹慎毫不動作而懷胎十月妊婦惟有安坐高臥一身氣血遲滯何如故其中香附不已又是延胡紅花蓋即為若輩不運動者設法要素之家井白親操者固亦無須於此服法亦奇僅僅七丸其力不失之峻固無妨於常服若盂英所謂奇效恐未必然又謂能調經種於則即其通調氣血之功用耳保胎磐石丸懷山藥四兩微炒杜仲去粗皮淨三兩鹽水炒斷絲川斷續二雨酒炒共為末糯米糊為丸如緑豆大每三錢米湯送下方雖平常屢用屢驗乃異人所授也凡胎欲墮者一服即保住慣小産者宜常服之或每月服數次至慣半産之月即服之無不保全箋疏杜仲續斷皆有補傷絶續之功是保胎之無上妙品而君之以薯蕷培土為主又是坤厚載物之微旨立方純正最穩而驗尚在前二方之上但糯米糊丸似嫌太膩不如水法丸之靈動此可多服必無流弊銀薴酒治妊娠胎動欲墮腹痛不可忍及胎漏下血薴酒二兩紋銀五兩酒一碗如無薴之處用茅草根五兩加水煎之箋疏本草言薴麻性滑而根又下行且銀能重墜按之物理頗與胎元有礙然世多用之而未言其害此藥理之不可知者且用酒煎尤嫌其動而不守豈以酒能上行耶升舉之義耶惟茅根代薴則清涼滑潤又是下行妊家皆以為禁品而此方用之則不矛信耳紫酒治妊娠腰痛如折黑料豆二合炒熟焦白酒一大碗煎至七分空心服箋疏腰痛本是腎虛黑豆補腎酒能引之是可法也回急保生丹仙傳此方得之神感效驗異常大紅鳳仙子九十粒白鳳仙子四十九粒自死龜板一兩麻油塗炙通梢懷牛膝三錢桃仁一錢五分川芎五錢白歸身五錢鳳仙子研末包好臨産時將餘藥稱明分兩為末配入臨盆時米飲調服二錢遲則再服一錢交骨不開者即開難産者不過三服臨盆一月內本方去鳳子人益母膏二兩每日早米飲調服二錢則臨盆迅速胎元不足者勿服産後瘀血不淨變生病者或兒枕痛於本方內加炒紅曲三錢酒炒馬料豆二合共為末用童便半杯陳酒半杯訓服二三錢即愈惟鳳仙子臨盆時用箋疏此為催生之法鳳仙子本名急件下行極速惟見抵産門而離産時間或可用治交骨不開者亦佳若謂彌月之時已可預服則龜板牛膝桃仁皆嫌太早欲速不達胡可妄試所謂天下本無難事而庸人自擾之為害必有不可言言者若在産後則芎歸殊雖通用吳鞠通已備言之矣近傳催生方以保生無憂仿為佳貌視之方極雜亂而程氏醫學心悟解之極妙用之者亦恆應驗但非臨盆時必不可早投而達生編中竟以為安胎之用適得其反誤用之無不墮者頤見之屢矣然達生一編無家不有害人真是不小無憂散在達生編中名保胎神效方真是大謬通津救命玉靈丹仙傳治裂胞生及難産數日血水己乾産戶枯澀命在垂危者龍眼肉去核六兩生牛膝梢一兩黃酒浸搗爛將龍眼肉煎濃汁衝入牛膝酒內服之停半日即産親救數人無不奇驗孟奐曰龍眼甘溫極能袖血大益胎産力勝參耆宜先期剝去淨肉貯磁碗內每肉一兩加入白沙糖一錢素體多火者並加西洋參片如糖之數冪以絲綿一層日日放飯鍋內蒸之蒸至百次者良謂之代參膏較生煎者功百倍矣娩時開水淪之其汁盡出如過難産即並牛膝酒共淪更覺簡便凡氣血不足別無痰滯便滑之病者不論男婦皆可蒸服殊騰他劑也箋疏裂胞生者吾鄉相傳作瀝胞謂胞光破而連日不生胞水瀝枯門産乾澀致於難産此非峻補真陰養其津液情殊可慮龍眼肉甘溫多液洵為補血上品名為通津救液允無愧色合以牛膝長稍直達下焦制方之意大有作用且是萬無流弊之良法然何以託名仙傳反蹈小家伎倆孟英以糖霜洋參蒸制可務急用亦是妙諦今吾鄉常用此法預先蒸透以待臨時應用即非難産亦可服之以助津液但鄉間俗傳謂不可早服反致補住氣血不易達生必俟兒到産門方可飲之又謂産後亦不宜服頤愚則謂新産真液太傷正宜倍養苟有外感及痰食實邪亦何不可補之有此等俗説必不可信為洋參則價重而無甚功力今多用別直參同蒸頤謂可用遼參鬚取其下行為順催生乃産後亦是無往不宜
