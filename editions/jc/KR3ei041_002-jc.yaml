body:
  text: 沈氏女科輯要箋硫卷中子淋轉胞徐藹輝曰此淋字與俗所云赤淋淋字不同彼指赤帶言系女精此係指小水言也箋疏小便頻數短檣熱痛乃謂之淋妊婦得此是陰虛熱熾津液耗傷者為多不比尋常淋痛皆由膀胱濕熱鬱結也故前人治此多於毓陰之中參以清池非一味苦寒勝濕淡滲利水之比轉胞之症亦是小溲頻數不能暢達但不必熱不必痛則胎長而壓塞膀胱之旁附氣不得自如故宜歸芎之升羅竊謂此症與子懸正是兩兩對峙彼為胎元之太升此是胎元之太降則子淋與轉胞似不可認作同顯但就病狀言之約略相似耳徐謂赤淋赤帶則確與子淋不同彼出精竅即不小溲而亦時時自下此則惟小溲時作痛不溲亦必不痛妊婦淋曰子淋小便不出曰轉胞子淋小便頻數點滴而痛轉胞頻數比少不痛淋屬肝經陰虧火熾轉胞因膀胱被胎壓住膀胱止有一口未溺時其口向上口端橫一管上半營即名下焦下半管即溺孔未溺時膀胱之底下垂如瓶狀其口在上與下焦直對溺從下焦滲入效曰下焦者別迴腸而滲入膀胱焉欲溺時大氣舉膀胱之底如傾瓶狀其口向下從溺孔注比故曰氣化則能出矣轉胞一證因胞大壓住膀胱或因氣虛不能舉膀胱之底氣虛者補氣胎壓者托胎若浪投通利無益於病反傷正氣徐藹汪認庵又謂胞系轉戾臍下急痛為轉胞溲或數或閉二說小異箋疏淋則痛轉胞則不痛辨症甚是胎大壓住膀胱氣虛不舉亦是確論浪投通利無益於病至理名言有如皎日若謂膀膠止有一口不溺則其口在上云云以轉胞二字造出許多怪語那不令人笑死須知近人繹泰西生理家言膀胱明有上源豈有頻預倒轉之理此即古人轉胞之名有以誤之此等臆說扣槃捫燭實是中醫之絕大汙點何可不正汪認庵胞系轉戾四字亦是盲人談天最為得意之筆子淋方生地阿膠黃芩黑山梔木通甘草水煎服丹溪治一妊婦小便人通令一婦用香油塗手自產門入托起其胎溺出如注即用人參黃耆升麻大劑煮服又治一婦轉胞用參歸煎服探吐得愈沈堯封曰良庵載其方名參朮飲蓋當歸熟地黃穹窮芍藥人參白朮留白陳皮半夏炙甘草加姜煎空心服丹溪論曰窘胞之病婦之稟受弱者憂悶多者性躁急者食味厚者多有之古方用滑藥鮮效因思胞不自轉為胎被壓胎若舉胞必自疏水道自通矣近吳宅寵人患此脈似澀重則弦予曰此得之憂患澀為血少氣多弦為有飲血少則胎弱不能舉氣多有飲中焦不清而溢則胎避而就下乃以上藥與飲隨以指探喉中吐出藥汁候氣定叉與之而安此恐偶中後治數人皆效箋疏清陽之氣不舉以致胎壓膀胱小溲不暢其理可信故宜川芎黃耆升麻等藥丹溪書中竟謂令人手入產門托起其胎豈不知產婦不到臨盆交骨不開安有可以伸入人手之理此荒謬極端之妄想全不知從實際上稍稍體會可駭亦最可殺而乃出出堂堂正正丹溪之書則人皆信以為真竟不為之思索一番一盲君盲大為可怪堯封胞不自轉一句說得尚是模糊蓋古人命名用一轉字本是大誤須知膀胱之府位在腹中決非能自翻覆之物惟被壓於胎一層斷為至當不易之理堯封所謂胎若舉則胞必自疏水道自利之說最是明白曉暢撥重霧而見青天矣吳宅寵人案中澀為血少氣多一句亦踵古人之誤要知氣為血帥血隨氣行兩者並轡而馳本無須臾可離之理乃古者竟能創為滑脈血多氣少澀脈血少氣多兩言必以氣血二字判分畛域寧非琢句之失檢而讀者偏能不假思索奉若南針抑亦過矣丹溪又謂中氣不清而溢措詞亦未妥仲景云婦人本胎盛今反羸瘦胞系了戾但利小便則愈宜服腎氣丸以中有茯芩故也地黃為君功在補胞又法將孕婦倒豎胞轉而小便自通矣箋疏金匱轉胞不得溺一條謂為胞系了戾主以腎氣丸病情藥理不甚明白止可存而木論尤氏心典以繚亂乖戾為了戾二字註解訓話可謂積切然細審病情胞即膀胱假令其系果致繚亂豈腎氣丸之功用可以整齊之且所亂者在系而不在胞何故遂致小便不利此中真相殊不可知況金匱婦人篇本條原屬不甚可解而沈引此條本于丹溪又典金匱不符者耶又謂將妊婦倒豎使胞轉而小便自通雖似言之有理實亦事不可行竊謂似此談醫皆是魔道不必存也沈堯封曰注昂採本事安榮散治子淋心煩悶亂雲子淋膀胱小腸虛熱也虛則不能制水熱則不能通利故淋心與小腸相表裡故煩悶方用人參甘帥之甘以補虛木通燈草之滲滑石之滑以通淋悶肺燥則天氣不降而麥冬能清之腎燥則地氣不升而細辛能潤之血燥則溝瀆不濡而當歸能滋之也亦有因房勞內傷胞門衝任虛者宜八珍湯或腎氣丸箋蔬小溲淋閉而兼心煩悶亂是熱盛於上水源枯涸非僅胞中之病方用參麥滋潤肺金探河源於星宿之海其旨可見治認庵只知心與小腸相為表裡所見甚淺實是模糊之語須知小便之變自有肺燥失其清肅之職右降不及一層斷非從小腸而來喻西昌羽族之證所謂無肺者無溺有肺者有溺最為精切此非汪氏所知又按安榮散方出自準繩非許白沙本事方中所有汪氏醫方集解不知何所據而云然此知認庵之言殊不可信房勞內傷宜用八珍或腎氣丸云云亦是汪氏舊說頤謂真液耗傷之病藥用八珍雖曰滋補尚嫌呆笨不靈且津液枯矣自常滋養腎氣中之桂附亦非必需之藥而芩澤丹皮淡滲利水夫豈所宜此皆浮泛之語貌似相合實則多所膈膜毫釐千里之謬極是籟預狼用古人成方必宥貌合神離之弊初學最宜猛省一涉此境終身必無清醒之日頤竊謂認庵之書恆蹈此弊學者胡可渾侖吞棗本草綱目妊娠下利用雞卵一個烏骨者尤妙開孔去白留黃入漂鉛丹五錢攪勻泥里煨透研末每服二錢米飲下一服效是男兩服效是女沈曰會試過有效有不效然利即不止而腹痛必緩箋疏此下利是滯下非泄瀉沈舉腹痛一症可知綱目此條乃單方凡滯下總是腸中淤積所以下不爽而痛頻扔雞子黃燒灰可以盪滌穢垢故能去滯止痛又是血肉之品不嫌峻利則無害於妊身然又謂一服效是男兩服效是女則其理安在恐不足徵沈謂腹痛必緩此灰能滌滯之明徵也薛立齋云一妊婦久利用消導帶理氣之劑腹內重墜胎氣不安又用阿膠艾葉之顯不應用補中益氣湯而安繼用六君子全愈箋疏此條明言久利過用消導理氣以致胎氣重墜不安則積滯已輕而氣墜為急故東垣補中升清之法可效非謂凡是妊身滯下不問有滯無滯皆投是藥也又云妊身利下黃水是脾土虧損其氣下陷也宜補中湯王孟英曰此下利乃泄瀉自利之證若滯下赤白之痢證仍當別治箋疏利下黃水則無黏滯穢垢矣故曰脾虧然仍當憑脈症治之王謂此是泄瀉自利誠然又謂滯下赤白仍當別治則以滯下終是濕熱淤積不可誤補養癰貽害即在休息久痢正氣已傷者亦必餘垢未淨雖曰宜補尚須參用疏通導滯以消息之益氣補中均非正治不以妊身而獨異也妊身腹痛金匱曰婦人懷妊腹中癘痛者富歸巧藥敬主之當歸三兩芍藥一斤茯芩四兩白朮四兩澤瀉半斤芎窮三兩右六味為散取方寸七酒和日三服又曰妊脈腹中痛為胞阻膠艾湯主之芎窮阿膠甘草各二量艾葉當歸各三兩芍藥四兩乾地黃六兩右七味水五升清酒三升合煮取三升去渣內膠令消盡溫服一升日三次徐藹輝曰嚴氏用治胎動漏下經漏腰痛腹滿搶心短氣加黃耆認庵亦謂妊娠下血腹痛為胞陰主此湯又曰又方阿膠一斤蛤粉炒艾葉數莖亦名膠艾湯治胎動不安腰腹疼痛或胎上搶心去血腹痛箋疏金匱膠艾湯為真陽不足虛寒氣滯之神丹補陰和血行氣溫經選藥精當不僅專治妊娠之腹痛凡氣血不足滯而作痛者無往不宜尤在涇金匱心典謂婦人經水淋瀝及胎產前後下血不止者皆衝任脈虛而陰不能守也是惟膠艾湯為能補而固之有芎歸能於血中行氣艾葉利陰氣止痛安胎故亦治妊娠胞阻胞阻者胞脈阻滯血少其氣不行也頤按血液虛寒而氣行不利故有淋瀝腹痛等病是方溫和流動補而不滯蓋人所知而腹之所以痛者亦由陰氣耗散所致在涇陰不能守四字大有可味芍藥純陰能收攝潰散耗亂之陰氣故治淋瀝下血非僅為血虛家定痛之良劑宋人周方四物湯世咸知為女科通用要藥豈非即從此方脫化而來頤則謂芎窮升發之性甚烈古用阿膠恐其太滯故以芎之靈通疏散者相輔而行頗有妙用若四物湯既去阿膠則芎性太走最宜斟酌而世俗不知裁度甚至芎歸地芍呆用等分則徒讀父書弊多利少真是笨伯徐氏所引後人之膠艾湯獨用阿膠艾葉亦是太笨不足法也又曰懷妊六七月脈弦發熱其胎愈脹腹痛惡寒者少腹如扇所以然者子藏開放也當以附子湯溫其藏附子人參白朮巧藥荻苓箋疏此妊身內藏受寒腹痛之症治然附子墮胎為百藥長必不可輕試即當溫養中下亦自有善治之法此古書之不可拘泥者今本金匱本未出方說者調即傷寒論少陰篇之附子湯堯封所錄即傷寒論方本條病情尤氏心典註文極為明白並錄之脈弦發熱有似表邪而乃身不痛而腹反痛背不惡寒而腹反惡寒甚至少腹陣陣作冷若或扇之者然所以然者子藏開不能合而風冷之氣乘之也夫藏開風入其陰內勝則其脈弦為為氣而發熱且為格陽矣胎脹者胎熱則消寒則脹也附子湯方未見然溫里大全云妊娠四五月後每常胸腹間氣刺滿痛或腸嗚以致嘔逆減食此由忿怒憂思過度飲食失節所致蔡元度寵人有子夫人怒欲逐之遂成此病醫官王師復處以木香散莪朮木香甘草丁香鹽湯下三服而愈箋疏此憂鬱氣滯肝絡郁窒而為腹痛之症治方是行氣溫中之法其嘔逆必於中寒故用丁香若肝鬱有火炎上作嘔者不可妄用沈堯封曰夏墓蕩一婦豐前喬章氏女也已卯夏章氏來請云懷孕七個月患三瘧利疾及診病者止云小便不通腹痛欲死小腹時有物壟起至若利疾晝夜數十起所下無多仍是糞水瘧亦寒熱甚微予思俱是肝病蓋肝脈環陰器抵小腹肝氣作脹故小腹痛溺不利脹甚則數欲大便肝病似瘧故寒熱予議泄肝法許其先止腹痛後利小便彼云但得服此即沼不必顧胎予用川楝子橘核白通草白芍茯芩甘草煎服一劑腹痛止小便利四劑瘧利盡除胎亦不墮以後竟不服藥彌月而產箋疏此亦肝家鬱滯之腹痛症然屬陰虛內熱故宜清肝與上二條症絕不相同堯封選藥醇正可法善學古人者參此數則舉一反三無難治之病矣王孟英曰徐悔堂云秣陵馮學園之內久患痞痛每發自臍閒策策動未幾遍行腹中疼不可忍頻年醫給不一其入而持論各異外貼膏藥內服湯丸攻補溫涼備當不效病已瀕危謝絕醫藥迨半月後病勢稍減兩月後飲食加常而向之策策動者日覺其長馴至滿腹又疑其豉也復為醫治亦不能愈如是者又三年忽一日腹痛幾死旋產一男母子無恙而腹痞消計自初病至產蓋已九年餘矣此等異證雖不恆見然為醫者不可不知也箋疏此人當初痞痛腹中遍動之時原是病不是胎頻年醫治必是不得其法故百不一效迨至謝絕醫藥病漸減飲食如常之後策策動者日覺其長頤調此時方是有身惟終以抱病有年氣營未足所以胎元不旺不能加期長成竟至三年乃產若謂乍病腹動即是懷胎積至九年之久而始達生殆不其然妊娠腰痛大全云婦人腎以系胞腰痛甚則胎墮故最為緊耍若閃挫氣不行者通氣散腎虛者青娥不老丸總以固胎為主通氣散方破故紙瓦上炒香為末先嚼胡桃一個爛後以溫酒調服故紙末三錢空心服治妊婦腰痛不可忍此藥最神王盂英曰故紙性熱妨胎惟閃挫可以暫用或但服胡桃較妥箋疏腰痛多腎虛症故最易墮胎凡肝腎陰分素虧及房室不慎者頗多此症胎最難保善養身者宜知此理非醫藥之所能治若閃挫傷氣之痛尚是輕症凡妊娠腹痛漏紅胎元墜滯勢將半產者腰不痠痛胎尚可安一有腰痛腰痠則未有不墜者矣薛立齋云腰痛因肝火動者小柴胡湯加白朮枳亮山梔沈堯封曰腰之近脊處屬腎兩旁近季脅者屬肝箋疏肝火既動理宜柔肝清火而以小柴胡升提之豈非肋桀為虐立齋慣伎最是欺人濫用古方誤盡後世學者依樣葫蘆不效而反以增劇則且歸咎於古方相戒不敢復用井可使古人制方精義淹沒失傳那不可嘆妊娠腹內鐘鳴大全用鼠窟前後上為細末研麝香酒調下立愈箋疏一是症是方據準繩系出產寶方云治小兒在腹中哭及孕婦腹內鐘鳴用空房鼠穴中土令孕婦噙之即止或為末麝香少許酒調二錢李瀕湖綱目土部鼢鼠壤土條中亦有此症治則據陳藏器說謂是田中尖嘴小鼠陰穿地中之鼠穴則較空房之鼠穴為潔然妊婦腹中何故鐘鳴其鳴聲究竟何若及是土之何能治驗實是百思而不得其理但據產寶與小兒在腹中哭併為一條則仍是腹內之兒鳴或鳴聲之較大者耳病情藥性俱不足徵存而不論可也腹內兒哭產寶云腹中臍帶上疙瘩兒含口中因妊婦登高舉臂脫出兒口以此作聲令妊婦曲腰就地如拾物狀仍入兒口即止又云用空房中鼠穴土同川黃連煎汁飲亦效沈堯封曰相傳復內鍾嗚即是兒哭今人治此撒豆一把在地令妊婦細細拾完即愈此是妙法王盂英曰此誓言也王清任曰初結胎無口時又以何物吮血養生既不明白何不歸而謀諸婦訪問的確再下筆庶不貽笑後人此說甚精余嘗謂身中之事而身外揣測雖聖人亦不免有未必盡然之處故拙案論證但以氣血寒熱言之固屬陋實不敢以已所未信者欺人也今春與楊素園大令言及從來藏府之論殊多可疑楊侯嘆曰君可謂讀書得閒不受古人之欺者矣因出玉田王清任醫林改錯見贈披閱之下竟將軒岐以來四千餘年之案一旦全反毋乃馴聞然此公徵諸目擊非托空言且楊侯遍驗諸獸無不吻合然則昔之鑿鑿言藏府之形者豈不皆成笑柄哉然泰西人身圖說一書流入中國已二百餘年所載藏府與王說略同而前理初未見改錯過信古書於癸已類稿內沿襲舊偽謂中外藏府迥殊且云外洋人睪丸有四枚尤屬杜撰欺人箋疏兒在母腹雖已成形然在未離胎盤之時當無自能發聲之理孟英所謂衛言洵然惟妊婦腹有啼聲確是時或遇之撒豆於地令妊者俯身拾取其聲可止頤雖未親見然亦嘗聞之鑿鑿則在王清任又何以解此頗似產寶兒含疙瘩一說庶幾近似孟英謂身中之事不能身外揣測洵是至理名名言惟王清任之改錯欲鋸暴露屍骸之獸食殘餘及刑場劊子抓在手中之剖出藏府以論生前之若何部位若何運化則仍是揣測而已陸九芝謂教人於義塚地上及殺入場上學醫其言已極堪發唬若古書中所言之形態誠不免以訛傳訛然終是展轉傳抄魯為魚而帝為虎決非上古之不是清任之說不過拾得西人緒餘而諱言所自借異說以欺人盂英反謂西學與王說略同是已墮清任術中而不悟頤竊謂能鋸解剖之真以正從古相承之謬則可欲據清任之言廢道傳之舊必大不可昔人有詠鸚鵡句曰齒牙餘慧才偷得便倚聰明學罵人清任之學是其類耳養胎徐藹輝曰金匱云懷身七月大陰當養以此見十月養胎之說其來久矣徐之才曰妊娠一月名始胚足厥陰肝脈養之二月名始膏足少陽膽脈養之三月名始胞手少陰心主胞絡脈養之四月始受水精以成血脈手少陽三焦脈養之五月始受火精以成氣足大陰脾脈養之六月始受金精之氣以成筋足陽明胃脈養之七月始受木精之氣以成骨手大陰肺脈養之八月始受土精之氣以成膚革手陽明大腸脈養之九月始受石精之氣以成毛髮足小陰腎脈養之十月五藏六府皆具侯時而生徐藹輝曰人鏡經惟手太陽小腸典手少陰心脈二經不養者以其上為乳汁下主月水也王盂英曰此亦道其常耳有每妊不足月而產者有必逾期而產者有先後不等者亦不為病也惟產不足月而形有未備或產雖足月而兒極委小者皆母氣不足為病再有身時須豫為調補自然充備余鄰家畜一母雞連下數卵殼皆軟鄰以為不祥欲殺之餘謂此下卵過多母氣虛也令以糯米蛇床子飼之數日後下卵如常推之於人理無二致箋疏徐之才逐月養胎之說千金方婦人門載之甚詳巢氏病源尤為繁瑣蓋六朝時相承之舊未必果為徐氏所發明試尋繹四五六七八等月受五村之精以成血脈筋骨等說均是架空立言想當然之事於實在生理無從證實而九月始受石精之氣以成毛髮巢源作成皮毛獨於五行之外添設一個石字尤非醫理之常益可證為憑空結撰必不足徵則所詔某月某經脈養胎云云者不過隨意分配佛氏所謂一切幻境皆由心造庶幾近之而隋唐以後視若聖經賢傳無不依樣葫蘆借撐門面靜言恩之殊堪發噱頤明知此等舊說相沿悠久習醫者方且資為談助以詡博聞一旦陡燃駁斥嗜古者必嗤為師心自用蔑視前人究竟問其如何分經而養之理則據病源謂肝主血一月之時血流澀始不出故足厥陰養之尚似言之成理然血發於心而附會肝經已是牽強又謂二月之時兒精成於胞里故足少陽養之則不知胎孕於子宮之中何以與足少陽膽發生關係抑且兒精成於胞里一句似是實非胎結子宮豈可與旁光之胞並作一物中醫本無子官之名實是生理學中一大缺典至三月則謂手心主者脈中精神內屬於心能混神放手心主養之云云直是不成文理尤其可笑四月則謂手少陽三焦之脈內屬於府四月之時兒六府順成故手少陽養之五月則謂足太陰脾之脈主四季五月之時兒原支皆成故足太陰養之六月則謂足陽明胃之脈主其口目六月之時兒口目皆成效足陽明養之七月則謂手大陰肺脈主皮毛七月之時兒皮毛已成故手太陰養之八月則謂手陽明大腸脈主九竅八月之時兒九竅皆成故手陽明養之九月則謂足少陰腎脈主續縷九月之峙兒脈續縷皆成故足少陰養之云云可笑者不一而足明是淺入附會假託之才以售其妄竊謂徐氏累世名醫斷不荒謬至於此極徐藹輝所引人經之說亦為古書所蒙殊不可信王孟英略而不道固亦有見於此盂英所論母氣不足一節至理名言洞見癥結巢元方曰妊娠受胎七日一變墮胎在三五七月者多在二四六月者少三月屬心五月屬脾七月屬肺皆屬臟臟為陰陰常不足故多墮耳如在三月墮者後孕至三月仍墮以心脈受傷也先須調心五月七月墮者亦然惟一月墮者人不知也一月屬肝怒則多墮洗下體竅開亦墮一次既墮肝脈受傷下次仍墮今之無子者大半是一月墮者非盡不受胎也故凡初交後最宜將息勿復交接以擾子宮勿令勞怒勿舉重勿洗浴又多服養肝平氣藥則胎固矣箋硫巢氏此說不見於今本病源並不見於千金外臺未詳堯封出於何本七日一變四字最不可解謂三五七月屬藏陰多不足故多墮尚是泛辭不能徵實惟墮胎者固多在三五七月之時實在何由殊不可推測其真相又謂如在三月五月墮胎則其後懷身仍有屆時復墮之下又確乎有之則子宮中之作用必有其真但謂三月屬心五月屬脾補心補脾必無桴應又謂一月墮者最多尤為至理名立蓋子宮初感凝結未固房事洗滌俱易震動而此時兒尚無形墮亦不覺觀合信氏全體新論兩精交會由子管而入子宮且在數日之內尚非頃刻間事則宜乎乍結之易於暗墮而本人且亳不能知矣此節最宜將息一層夫婦之愚皆當銘之肺腑而古人一月肝脈養胎之臆說亦可不辨自明頤恆謂吾國醫學發源於五帝以前而失傳已在周秦之際下逮魏晉六朝頗多憑空結撰決不能與上古之學一線師承觀於此類議論節可得其真諦而更以西學說之得於解剖者一一佐證其實在則孰是孰非明白曉暢固已撥雲霧而見青天彼泥古之儒尚欲據二千年內相承之偽以為篤信好古之護符亦只見其識力之未到耳丹溪曰陽施陰化胎孕成血氣虛損不足以榮養其胎則自墮譬如枝枯則果落藤萎則花墮或勞怒傷情內火便動亦能動胎正如風撼其樹人折其枝也火能消物造化自然病源乃謂風冷傷子臟而墮未得病情者也有孕婦至三四月必墮其脈左手大而無力重取則澀知血少也止補中氣使血自榮以白朮濃煎下黃芩末數十劑而安因思胎墮於內熱而虛者為多曰熱曰虛當分輕重蓋孕至三月上屬相火所以易墮不然黃芩熟艾阿膠何謂安胎妙藥耶箋疏六朝以前談醫之士極少江南人物論病多寒證正以中原之地高曠多寒不比大江以南多溫暖而少冷冽也巢源謂胎墮為風冷傷砰藏本是時固有之症丹溪南人未之思耳然人體不同各如其面黃芩亦未必是千人必用之藥丹溪亦自謂熟艾是安胎妙藥則艾豈寒涼可見丹溪亦恆用之矣方約之曰婦人有娠則礙脾運化遲而生濕濕生熱丹溪用黃芩白朮為安胎聖要藥盍白朮健脾燥濕黃芩清熱故也但妊娠賴血養胎方內四物去川芎佐之為尤備耳箋疏因濕生熱正為吾儕地土言之若至黃河以北此說必不可通張飛曰古人用條芩安胎惟形瘦血熱營行過疾胎常上逼者相宜若形盛氣衰胎常下墜者非人參舉之不安形實氣盛胎常不運者非香砂耗之不安血虛火旺腹常急痛者非歸芍養之不安體肥痰盛嘔逆眩暈者非二陳豁之不安此皆治母氣之偏勝也若有外邪仍宜表散伏邪時氣尤宜急下惟忌芒硝切不可犯箋疏相體裁衣本是醫家真諦亦豈僅為妊身而言祭何一孔之見意以黃芩白朮安胎聖藥八字作為自始至終一成不變之局亦只見其不知量耳伏邪時氣尤宜急下兩言含潭不清弊亦不小王盂英曰條芩但宜於血熱之體若血虛有火者余以竹茹柔葉絲瓜絡為君隨證而輔以他藥極有效蓋三物皆養血清熱而息內風也物之堅強莫如竹皮禮云如竹箭之有筠是也皮肉之緊貼亦莫如竹故竹雖篩而皮肉不相離實為諸血證之耍藥觀塞舟不漏可知矣柔葉蠶食之以成絲絲瓜絡質韌子堅具包羅維繫之形且皆色青人肝肝虛而胎系不牢者勝於四物阿膠多矣惜未有發明之者箋疏苓治血熱其理固顯而易知然王所謂血虛有火者貌視之似與血熱無甚區別然彼是實火自當苦寒此是虛火亦非黃芩白朮可以籠統療治孟英所謂養血清熱泛言之亦仍是血熱治法然此中情實同異若何苟非孟英恐未易有此批郄導竅明析之筆雖自謂未有發明然經此一番剖解其發明不已多耶王海藏曰安胎之法有二如母病以致動胎者但療母則胎自安若胎有觸動以致母病者安胎則母自愈箋疏治病必求其本固是至理名言丹溪云有婦經住或成形未具其胎必墮察性急多怒色黑氣實此相火太盛不能生氣化胎及食氣傷精故也箋疏此是火旺確宜黃芩然觖宜參王孟英竹茹一條治法方能恰合分寸又曰有婦經佳三月後尺脈或澀或微弱其婦卻無病知是子宮真氣不全故陽不施陰不化精血雖凝終不成形或產血塊或產血泡也惟脈洪盛者不墮箋疏此經雖阻而非妊之脈症為病為胎必以尺脈之流利不利有神無神辨之不在乎脈形之大小及有力無力間也胎動不安血虛火盛其婦必形瘦色黑其胎常上逼者宜倏芩阿膠徐藹輝曰前張飛疇說謂形瘦血熱宜條芩血虛火旺宜婦芍此似將上二條併為一治想須在胎上逼與腹急痛上分別未知是否存參王孟英曰審屬氣虛欲墮者補中益氣法甚妙箋疏肥白之人未有不形盛氣衰者斷不可與蒼黑偉碩之體同日而語胎常下墜即是大氣不能包舉之明徵色蒼體偉者必無是慮此證補之必有效若用升舉又恐惹流弊惟人參滋補而不濁膩自能固氣而無升之害堯封持論必不可易盂英謂可用補中益氣在清陽下陷者誠是相如以體偉氣弱致胎滯墜而非脾胃清氣下陷者浪投升柴亦有動胎上逼之慮形氣盛胎常不運者宜香砂箋疏此氣滯不能流利故宜行氣香附烏藥流動氣機而不失於燥亦是疏達之良劑痰氣陰滯體肥嘔逆眩暈者宜二陳箋疏肥人多痰二陳溫膽最是要藥半夏雖曰礙胎而今之市品俱已制過可不避忌但膽星宜輕左金丸亦佳稍加川椒烏梅止嘔尤捷怒氣傷肝加味逍遙散箋疏逍遙治肝為木不條達鬱滯窒塞者而言故以柴胡春升之氣助其條暢非能馴養肝氣之橫逆者既曰因怒傷肝則必以清養肝陰為上逍遙反以擾動其氣流弊不小此薛立齋之故智斷不可師毒藥動胎白扁豆二兩生去皮為末新汲水下見厥逆門須合參以辨其證箋疏此是單方白扁豆雖能安胃然生末水調服不如煎湯稍涼飲之為佳惟所謂毒藥者種種不同一味單方殊不足恃交接動胎其證多嘔產寶百問載綱目方飲竹瀝一升有驗人參尤妙箋疏此動胎之最厲者百脈弛張為害極巨豈一味單方所能補救此方見李氏本草綱目慈竹瀝下但曰困絕不言多嘔註明出產寶此條補出多嘔二字蓋陰泄於下而氣逆於上竹瀝下氣止嘔築磕著胎惡露已下疼痛不止口噤欲絕用神妙佛手散探之若不損則痛止子母俱安若損胎立便遂下即芎窮湯治傷胎多神效箋疏婦芎溫和流動而俱有升舉之力故胎元受傷震動欲墜者得其升舉而亦能安若已大損則活血行血脈絡疏通而已壞之胎自不能留效如仙佛手到成功此佛手之所以命名也胎動下血不絕欲死本草綱目用蜜蜂蠟如雞子大煎三五沸投美酒半升服立瘥馮云神效蠟淡而性澀入陽明故也王盂英曰懷妊臨月並無傷動驟然血下不止腹無痛苦者名海底漏亟投大劑參耆十不能救其一二此由元氣大虛沖脈不攝而營脫於下也箋疏蜂蠟雖澀然和以美酒即是行血有餘既已下血不絕似不可用此亦單方之神險者具有不可恩議之妙而藥理則在可知不可知之間若非親自經念未可輕信每有姑妄試之而適以速禍者頤亦屢聞之矣吾輩事醫藥當以病理藥性兩相符合始為正直蕩平之路眩異矜奇所不敢取王盂英所謂胎元不傷而驟然大下且腹無痛苦者則是脫症誠非獨用參耆能救此當以暴崩例之急投大補大固如參朮阿膠龍牡之類庶或有濟王叔和曰胎病不動欲知生死令人摸之如覆盆者男如肘頸參差起者女也冷者為死溫者為生箋疏此以腹之冷暖辨胎之生死太嫌呆相至謂腹如覆盆者為男胎如肘頸參差者為女胎以男胎向後女胎向前故也此是中醫舊說蓋見男兒胎在腹亦必仰面四言脈訣謂男腹如箕女腹如釜亦即此意然合信氏全體新論已言其不確彼中剖解極多所見必不妄知吾國理想舊說未必可恃聖濟總錄云胞衣不下急於胎之未生子死腹中危於胎之未下蓋胎兒未下子與母氣通其呼吸若子死腹中胞藏氣寒胎血凝冱氣不升降古方多以行血順氣藥及硝石水銀硇砂之類然胎巳死軀形已冷血凝氣聚復以至寒之藥下之不惟無益而害母命也多矣古人用藥深於用意子死之理有二端用藥寒溫各從其宜如娠婦胎漏血儘子死者有墜墮顛撲內傷子死者有久病胎萎子死者以附子湯進三服使胞藏溫暖凝血流動蓋以附子能破寒氣墜胎故也若困傷寒熱證溫瘧之類胎受熱毒而死留於胞中不下者古人慮其胎受熱毒勢必脹大難出故用朴硝水銀硇砂之類不惟使胎不脹且能使胎化爛副以行血順氣之藥使胎節下也箋疏朴硝玄明粉可下死胎諸書多載之而莫有言其理者惟此節借子下胎之理為之兩兩對勘一寒一溫適得其反而各有真諦益人智慧不少蓋無論何症必有塞熱虛實之不同自當先辨此四字而後用藥始有門徑固未有呆執一物而曰此是治某症必用之藥者然古今之方書能為之而一孔之醫生能用之醫藥真理那不掃地淨絕近世有最普遍之驗方新編一書窮鄉僻壤不風行但言其功不詳其理殺人尤不可勝數而有力好事之家樂為印送輒囂囂然自號於眾曰吾以此廣行方便積莫大之陰功也庸詎知為禍之烈乃至於此豈真豈動運為之耶硇砂水銀可下死胎古雖有此說然必不可試熱病胎死腹中新汲水濃煮紅花汁和童便熱飲立效本草經疏妊病去胎大麥芽一升蜜一升服之即下千金齊仲甫曰墜胎後血出不止一則因熱而行一則氣虛不能斂瀉血多者必煩悶而死或因風冷墮胎血結不出搶土攻心煩悶而死當溫經逐寒其血自行若血淋漓不止是衝任氣虛不能約制故也宜膠艾湯加伏龍肝散王孟英曰有無故墮胎而惡露全無者此血虛不能榮養如果之未熟而落血既素虧不可拘常例而再妄行其於也箋疏半產後之治汪本與正產後無異懷胎之後月事不行留此以為胎元涵養之資積之日多在子宮中半成於濁故初產之時即宜隨胎而去古人名以惡露者正以於濁積穢故宜露而不宜藏惟所失太多則不僅淤濁之穢惡而並經脈中固有之血不自收攝隨波逐流而去豈是細故齊氏所述血熱妄行及氣虛不固兩端已握其要熱者宜清而固之虛者非大封大固而助以大補之參耆必不濟事昔賢所謂產後宜大稱氣血為主者蓋為此症而設而近今世俗方且謂新產後必不可用人參正不知何所見而云然如其惡露全無則苟為瘀結不行必有脹痛可證自當宣化泄導如無淤滯脈症則盂英所說自有此理亦非可妄投攻破者而俗醫又以生化湯為必需之品則皆耳食之學知其一不知其二者亦何往而不僨事耶問何以知胎死曰面赤舌青母活子死麵青舌赤幹活母死麵舌俱青子母俱死死胎墜脹瘀痛亦與常產不同箋疏胎死舌青確乎有據然必胎壞日久而後現於舌蓋陰霾之氣上乘而苔為變色是宜溫通活血以下之者非朴硝玄明粉所可妄試也王盂英曰吳鞠通云死胎不下不可拘執成方而悉用通法催生亦然常求其不下之故參以臨時所現之脈證若何補偏救弊而胎自下也余謂諸病皆爾不特下死胎也又曰寓意草有用瀉白散加芩桔以下死胎之案可見人無一定之病病非一法可治藥無一定之川隨機應變貴乎用得其當以箋疏凡百症治皆無一定板法雖曰見症治症然症固同而其因萬有不同必求其故四字真是無等等咒然環顧古今能求其故者亦必不可多得矣盂英又曰許裕鄉診邵涵貞室娠十七月不產不敢執意憑脈問諸情況果孕非病但云孕五月以後不動心竅訝之為主丹參一味令日服七錢兩旬餘胎下已死而枯其胎之死料在五月不動時經年在腹不腐而枯如果實在樹敗者必腐亦有不腐者則枯胎之理可推也余謂此由結胎之後生氣不旺未能長養萎於胞中又名僵胎亦有不足月而自下者並有不能破胞而自落者余見過數人矣若胎已長成豈能死於腹中而不為大患至年餘而始下哉惜許君言之未詳也丹參長於行血專用能下死胎凡胎前皆宜慎用世人謂其功兼四物以之安胎因而反速其墮而人不知之餘見亦多矣箋疏枯胎一說雖似奇談而實有至理頤嘗見有孕已九月而腹不膨燃者為之調和氣血而胎即墮長僅二寸餘而不腐朽此婦白皙而癯瘠亦枯胎也孟英又曰凡大毒大熱及破血開竅重墜利水之藥皆為妊婦所忌便產須知歌曰蛔青即青娘子盤蝥水蛭與蟲蟲烏頭附子及天雄野葛水銀暨巴豆牛膝薏苡並蜈蚣三莪教述赭石芫花麝香大戟蛇蛻黃雌雄砒石火芒芽硝大黃牡丹桂槐花子同此藥涼血止血何以孕婦禁服蓋能子宮精濁也牽牛皂角同半夏制透者不忌南星膽制陳久者不忌兼通草瞿麥乾薑桃仁木通鋼砂乾漆蟹爪甲地膽茅根與庶蟲本草綱目續曰烏喙側子羊躑躅藜蘆茜根厚樸及薇銜樘根藺茹葵花子赤箭兩草刺蝟皮鬼箭紅花蘇方木麥蘖常山蒺藜蟬錫粉硇砂紅娘子即葛上亭長硫黃石蠶並蜘蛛螻蛄衣魚兼蜥蜴桑蠹飛生暨樗雞牛黃犬兔驢馬肉鯛鮮蝦蟆鱉共龜余又補之曰甘遂沒藥破故紙延胡商陸五靈脂薑黃葶藶穿山甲婦尾靈仙樟腦續隨王不留行龜鱉甲麻黃川椒神曲伏龍肝珍珠犀角車前子赤芍丹參母射於澤瀉澤蘭紫草郁金土瓜根滑石自犀角至此雖非傷胎之藥然系行血通竅之品皆能滑胎凡胎元不足及月分尚少者究宜審用余性謹慎故用藥如是設有故無殞不在此例及紫箴節凌霄花又外科全生集云娠婦患瘡瘍雖膏藥不宜擅貼恐內有毒藥能墮胎也夫外治尚宜避忌況內服乎故婦人善飲火酒者每無生育以酒性熱烈能消胎也附及之以為種玉者告箋疏妊娠藥忌自有至理習醫者固不可不知所避否則易滋口實然病當吃緊關頭不急急於對病發藥則母命必不可保遑論胎元豈有母先亡而胎元可保之理如陽明熱實則硝黃必不可缺容有大府通調而胎不礙者即使墮胎亦是兩害取輕當為達人所共許惟俗子不知此中緩急則必明告之而聽其從達而已若不明言於先而欲權術以冀得一當則必有竊議於其後者且亦有胎先墮而母命隨之者更必授讒慝者以口矣此守經行權各有其分尤行道者之所必不可忽者也附英醫合信氏全體新論諸說女子尻骨盤內前為膀胱中為子宮後為直腸膀胱溺管長約一寸其下為陰道即產門也產門肉理橫生可寬可窄其底銜接子宮上口陰水生焉子宮狀若番茄倒掛骨盆之內長二寸底闊一寸三分內空為三角房一角在口兩角在底分左右底角有小孔底之外有二箸帶懸之此帶無力即有子宮下墜之憂子宮於受胎之後積月漸大妊娠三月漸長四寸妊娠五月底圓如瓢妊身七月脹至臍上漸長六寸妊身九月直至胸下長尺有另重四十兩圓如西瓜娩後復縮小子宮之底左右各出子管一支與小孔通長二寸半垂於子核之側不即不離子核者在子宮左右離一寸向內有蒂與子宮相速向外有筋帶與子管相緊形如雀卵內有精珠十五粒至十八粒不等內貯清液是為陰精女子入月之年精珠始生至月信絕其珠化為烏有男精入子宮透子管子管罩子核子核感動精珠迸裂陰陽交會自子管而人在管內漸結薄衣為胚珠是為成孕由是子管漸大胚珠漸行數日之內行至於宮又生膠粒以塞子宮之口是謂受胎王盂英曰有子宮不受男精者事後必溢出終身不孕殆即核無精珠故耶子核之內裂一珠成一孕裂雙珠即孿生若子宮受病子核有恙子管閉塞核無精珠者皆不受孕受孕而胚珠生十二日生毛內涵清水有兩小物浮其中一圓一長長者人也積日彌大圓者養胚之物也積日彌小胎盤生此物即無矣二十日胚形如大蟻三十日如牛蠅長四分身骨可辨且有眼模三十五日臍帶生四十二日胚有口四十五日初見四肢六十日手足全骨點始生上有耳鼻下有肛門是為受形之始長一寸六十五日始生藏府九十日見全形男女可辨長二寸胎盤成至四月內外皆備長四寸五月胎動六月長六寸發甲生七月長八寸骨節粗成八月長尺一寸睪丸由腹落至腎囊九月目始開長十二寸十月胎足嬰兒在胎肺小肝大不須呼吸地氣故血之運行與出世不同妊胎二十日心已成模初見一管漸分兩房漸成四房土兩房有戶相通此出世後不通胎兒之血來自胎盤由臍帶入一半入肝肝運入心一半入迴血總管上達心右上房即過左上房此出世後不通而落左下房入血脈總管先上兩手頭腦之內由迴管返心右下房即自入肺管透血脈總管之棋此出民後不通然後落下身兩足兒必上大下小以上身先受赤血也於是復出臍帶而達胎盤飲換赤血輪流不息蓋以胎盤為肺用也出世後呱呱以啼肺即開張呼吸而心左右兩通之戶即閉若不閉紫血典赤血並兒即死而身青矣王盂英曰人身圖說云胎居子宮以臍帶吸取母血以卷之有如樹木以根吸取土濕胎盤俗名胞衣乃肧珠外之毛黏連子宮內膜而生其毛漸變為血管三月成盤形圓徑五寸厚一寸其體半為孕婦血管半為胎兒血管孕婦脈管甚大沖接胎兒血管滲泄精液以養之臍帶一頭連胎盤一頭連兒臍中空成管外有兩脈管繞之兒生之後母子血管截然分張或有胎盤未離血管半斷則血暴下乳者赤血所生乳頭有管淅入漸分如樹分枝行至乳核即與血脈管相接乳汁由是化成月水乃子宮所生之液以備胎孕之需非血也王曰所言非血者言非灌輸脈絡榮養百骸之常血故無孕之時可以按月而行然亦藉氣血以生化故氣血衰則月水少若月水過多則氣血亦耗也禽不雄而卵伏而不孵蛙蛤之屬當雌出卵雄出其精以護之身負而行精不入腹蚯蚓雌雄相交兩皆成孕草木以中心為雌花須為雄風吹須粉散落於花心膠液接之乃能含仁結子若去其須即不實王曰滕蛇聽而有孕白鷺視而有胎造化之理無窮總不外乎氣相感而成形也中外之人貌有不同而藏府氣血無不同者且說理最精並非虛揣空談爰錄如右以稽參考惟產育有不止十八胎者其精珠之數似數似未可泥箋疏西學以解剖為專職顯微有鏡所見最真而習之既久遂並其運行化育之途亦能漸漸明白其說固自不妄合信氏之書成於咸豐之初猶為彼學中之古本彼中之學重在知新不在溫故每注意於新發明而薄古書為無用然近今譯書漸多取而讀之名辭繁頤未嘗不粲然具備然只見其復沓重累而期期艾艾不甚可解有恆居其半蓋譯筆不能條達恐非彼中真本果皆如此而合信之舊頗覺直捷丁當明白如話知此君兼擅中文尤為可貴是篇所錄證以元本尚在裁節移綴者數處但於文義不致矛盾姑仍舊貫以存是書之真惟亦有刪節數字而辭旨彼此懸絕者則殊非合信氏之真旨爰照元本改正以復廬山之面目若此中生理則尚有不易詳析者此必不可以空言懸解自謂得之姑附闕疑以俟能者產脈變耳楊子建十產論一曰正產二曰傷產未滿月而痛如欲產非果產也名為試月遽爾用力是謂傷產三曰催產正產之際悉見而難產用藥催之是謂催產四曰凍產冬產血凝不生五曰熱產過熱血拂令人昏暈六曰橫產兒身半轉遽爾用力致先露手令穩婆徐推兒手使自攀耳七曰倒產兒身全未得轉即為用力致先露足令穩婆推足入腹八曰偏產兒未正而用力所致九曰礙產兒身已順不能生下或因臍帶絆肩令穩婆撥之十曰坐產急於高處緊一手巾令母攀之輕輕屈足坐身可產十一曰盤腸產臨產母腸先出然後兒生產後若腸不收用醋半盞新汲水七分和勻噀產母面每噀一縮三噀盡收箋疏是論原文頗長此其刪節者節之太簡頗有不甚明瞭者其坐產一條原謂兒將欲生其母疲倦久坐椅褥抵其生路急於高處擊一手巾令產母以手攀之輕輕屈足坐身令兒生下非坐在物上也云云蓋謂坐草已久產母力疲故以巾帶助其援力今以此節言不達意須從原本為佳濟陰綱目有全文頤按凡是難產多由心慌意亂急遽臨盆所致苟能忍痛靜臥耐之又耐瓜熟蒂落安有危險鄉曲穩婆不耐靜守言多龐雜催促臨盆最多誤事達生編一書所錄各方未必可恃而論忍耐之法至理名言無出其右甚且謂私生者無難產惟其畏而能忍也尤其勘透入微所謂六字訣者確是產婦房中第一箴言孕婦止腹痛未必產連腰痛者將產胞擊於腎故也腹痛試捏產母手中指中節或本節跳動方臨盆即產王孟英曰中指跳動亦有不節產者更有腰腹不甚痛但覺酸墜而即產者箋疏中指節末本有動脈但平人脈動甚微幾於不覺產婦臨盆此指尖脈形分明頃刻分娩確是多數孟英謂亦有未必即產者則偶然耳亦有腹竟不痛但覺腰痠異常而即產者此其達生之極易者最不可遇而亦嘗屢聞之皆孟英之所謂十個孩兒十樣生也兒未生時頭本在上欲生時轉身向下故腹痛難忍此時婦當正身寬帶仰臥待兒頭到了產戶方可用力催下若用力太早或束肚倚著兒不得轉身即有橫生逆生手足先出之患許叔微曰有產累曰不下服藥不驗此必坐草太早心懼而氣結不行也經云恐則氣下恐則精怯怯則上焦閉閉則氣逆逆則下焦脹氣乃不行得紫蘇飲一服便產方見子懸門箋疏學士亦以坐草太早為戒可見達生編六字訣之必不可少心懼而氣結不行亦是不能忍耐之咎恐則氣下脹而不行自有至理紫蘇飲只為疏達氣立法川芎能升似不相宜然果是恐則氣下則又不可少且分量甚輕可以無慮其臨盆累日胞漿瀝淨致令氣血枯澀者非大劑養血不救王孟英曰難產自古有之莊公寤生見於左傅故先生如達不圻不副詩人以為異徵但先生難而後生易理之常也晚嫁者尤可必焉然亦有雖晚嫁而初產不難者非晚嫁而初產雖易繼產反難者或頻產皆易閒有一次甚難祈有一生所產皆易有一生所產皆難者此或由稟賦之不齊或由人事之所召未可以一例論也諺云十個孩兒十樣生至哉言乎若得兒身順下縱稽時日不必驚惶安心靜俟可耳會稽施圃生茂才誕時其母產十三日而始下母子皆安世俗不知此理稍覺不易先自慌張近有凶惡穩婆故為恫吃妄施毒手要取重價臠而出之索謝去後產母隨以告殞者有之奈貿貿者尚誇其手假之高忍心害理慘莫慘於此矣設果胎不能下自有因證調治諸法即胎死腹中亦有可下之方自古方書未聞有臠割之刑加諸投生之嬰兒者附識於此冀世人之憬然悟而勿為凶人牟利之妖言所惑也但有一種騾形者交骨如環不能開圻名鎖子骨能受孕而不能產如懷娠必以娩難死此乃異稟萬中不得其一如交骨可開者斷無不能娩者也方書五種不孕之所謂螺者即騾字之偽也蓋驢馬交而生騾純牝無牡其交骨如環無端不交不孕稟乎純陰性極馴良而善走勝於驢馬然亦馬之屬也易曰坤為馬行地無疆利牝馬之貞皆取象於此之謂也人賦此形而不能安其貞則厄於娩矣催產神方治胎漿已出胎不得下或延至兩三日者一服即產屢有神效當歸四錢人參一錢牛膝二錢川芎一錢龜板三錢赭石三錢研肉桂一錢去皮益母二錢水煎服王盂英曰此方極宜慎用夏月尤忌必審其確係虛寒者始可服之通津玉靈湯最妙余用豬肉一味煎清湯服亦甚效箋疏胎漿已破遲久不產胞門有枯燥之虞非滋養津液何以救涸轍之鮒參歸補血活血牛膝龜板赭石引以下行立法亦不謬實即佛手散之加味芎雖能升然程鍾齡之所謂撐法亦自有理程解保生無憂散謂催生妙藥純是摟法解得極奇而亦極是蓋即疏通氣機流動血液耳說見醫學心悟保生無憂散方下且合以牛膝龜板赭石亦不慮其升舉方固可用惟肉桂實不可解豈其溫以行之耶若無寒症何可概施孟英之評必不可少通津一方果佳見下卷末頁今吾鄉恆以龍眼肉拌人參或別直參西洋參久久飯上蒸透作臨產必須之助即此方之意但吾鄉俗見謂非兒頭已見不可早服則大謬之說如果瀝漿不可不用胞槳先破而久不產者吾鄉謂之瀝漿生亦曰瀝胞生皆俗語也豬肉清湯吹去面上浮油確是妙品但宜淡服如胃氣不旺似不妨輕川清鹽此是孟英心得弗以平易而忽之如神散路上草鞋一雙名千里馬取鼻粱上繩洗淨燒灰童便和酒調下三錢神驗武叔鄉濟陰綱目云於理固難通於用實靈念按千里馬得人最下之氣佐以童便之趨下酒性之行血故用之良驗此藥不寒不熱最是穩劑王盂英曰催生藥不宜輕用必胎近產門而不能即下始可用之又須量其虛實或助補其氣血或展拓其機關寒者溫行熱者清降逆者鎮墜未可拘守成方而概施也箋疏前方單方也以理言之未必皆驗盂英謂不可拘守成方豈獨為催生一法言之耶婦人良方曰加味芎婦湯入龜板治交骨不開酷油調滑石塗入產門為滑胎之聖藥花蕊石散治血人胞衣脹大不能下或惡露上攻萆麻子治胎衣不下佛手散治血虛危證清魂散治血暈諸證失笑散治惡露腹痛不省人事平胃散加朴硝為腐死胎之藥徐藹輝曰佛手散亦下死胎胎死宜服此不傷氣血服此不下次用平胃樸硝可也箋疏良方諸條固皆熟在人口者但萆麻子治胎衣不下豈用以內服耶僅能滑腸且緩不濟急必不足恃下有頭髮塞口取惡即下一條極便極驗朴硝下死胎則上卷聖濟總錄一條已言之矣非恆法也凍產治驗劉復真治府判女產死將殮取紅花濃煎扶女於橙上以綿吊蘸湯貪之隨以澆帛上以器盛之叉緩叉淋久而甦醒遂產一男蓋遇嚴冬血凝不行得溫故便產也箋疏此妄語也人已死矣且至將暖其時間必相去稍久安有復生之理古人志乘傳記中所載醫家奇念甚有稱見棺中血出而知洋婦未死者齊諧志怪皆好事之人不明醫理者為之無一非癡人說夢耳逆產足先出用鹽塗兒足底橫產手先出塗兒手心徐藹輝曰鹽螫手足痛便縮入俗乃謂之討鹽生也箋疏此亦臨盆太早強力迫之使然若守達生編六字要訣必少此患胞衣不下急以物牢扎臍帶墜住使不上升然後將臍帶剪斷使血不入胞萎縮易下若未系先斷胞升湊心必死徐曰保生錄覺胎衣不下產婦用自己頭髮塞口中打一噁心即下切須放心不可驚恐不可聽穩婆妄用手取多致傷生又以草紙燒煙燻鼻即下芒硝三錢童便沖服立效俞邃良先生目觀松郡一老穩婆包醫是證自帶白末藥一包買牛膝二兩同煎去渣沖童便半杯服立下白末藥定是元明粉元明粉即制朴硝也箋疏芒硝太鹹寒必非通用之品童便牛膝可法產後喜笑不休一老嫗云產後被侍者挾落腰子使然用烏梅肉二個煎湯服立效嘉郡錢鄰哉目睹箋疏腰子是內腎豈有墜落而可救之理此陰脫於下而氣火沖激於上使然即西人所謂血沖腦經病也烏梅酸收則氣不上衝而神經之知覺復矣頤謂童便亟服亦可否則即用潛陽鎮逆之法當無不應惡露過多不止伏龍肝二兩煎湯澄清烊入阿膠一兩服如不應加入參箋疏新產惡露過多而鮮紅無瘀者是肝之疏泄無度腎之閉藏無權衝任不能約束關閘盡廢暴脫之變大是可虞伏龍肝溫而兼澀土能堤水真阿膠激濁揚清本是血崩無上聖藥重用濁用其力最專其功最捷尚在大劑獨參湯之上必無不應之理如果不應則更可危再加人參亦非重用不可而能牡救逆亦所必需惡露不來九竅出血裴補云九竅出血死證恆多惟產後瘀血妄行九竅出血有用逐瘀之藥而得生者不可遽斷其必死此是閱歷後之言不可忽略雖無方藥其法已具箋疏此是虛陽上冒氣逆血湧其勢最熾平人得此尚難急救況在產後然急急泄降鐵逆亦自有可生之理黑氣鼻衄郭稽中雲產後口鼻黑氣起及鼻衄者不治蓋陽明為經脈之海口鼻乃陽明所見之部黑氣鼻衄是營衛散亂營氣先絕故不治薛立齋云急用二味參蘇飲加附子亦有得生者箋疏此亦氣逆上冒之候口鼻黑則肺胃之氣已絕法固不治然急與開泄降逆亦或可治薛立齋謂用參蘇已覺不切籠統方藥何能救此危急萬狀之疲又用附子則鼻黑唇黑豈皆屬於陰寒者此公庸愚而偏喜著書立說巍然者一大部竟是各科咸備而實絕少心得昔人謂如折襪線如僧剃髮無有寸長頤於此公亦云而俗子無知奚辨良窳喜其筒而易記卑而易行可以造成無數庸俗市醫而殺人乃不可限量真一大劫哉眩暈昏冒喘沈堯封曰喘有閉脫二症下血過多者是脫症喉中氣促命在須臾方書雖有參蘇飲一方恐不及待惡露不快者是閉證投奪命丹可定如不應當作痰洽此皆急證更有一種緩者婁全善所云產後喘者多死有產二月洗浴即氣喘坐不得臥者五月惡風得暖稍緩用丹皮桃仁桂枝茯芩乾薑枳實厚朴桑皮紫蘇五味瓜蔞煎服即臥其疾如失作汙血感寒治也按此亦是痰證所以能持久痰滯陽經所以惡寒方中著力在瓜蔞厚朴枳實桂枝茯芩乾薑五味數味餘皆多贅箋疏喘疲木分二候實者是肺氣之壅塞痰飲蟠結則宜開宣肺氣泄化其上虛者乃腎氣之上奔真元無根則宜攝鎮專治其下亦惟黑錫丹尚能救急此非大劑不能及喻嘉言謂宜吞百丸者是也產後暴喘有虛無實參蘇和緩誠不及待發熱沈堯封曰產後發熱所因不同當與脈證參看感冒者鼻塞亦不可過汗經有奪血無汗之禁只宜苒婦湯停宜者噯腐飽悶宜平劑消食血虛發熱無別證者脈人而芤宜歸耆陰虛者煩渴脈細宜生地阿膠更有一種表熱裡寒下利清穀煩渴惡熱脈微細者此少陰危證宜四逆湯王盂英曰暴感發熱可以鼻塞驗之苟胎前伏邪娩後陡發者何嘗有頭疼鼻塞之形證乎雖脈亦有不即露者惟舌苔頗有可徵或厚白而膩或黃膩黃燥或有黑點或微苔舌赤或口苦或口渴或胸悶或溲熱此皆溫濕暑熱之邪內蘊世人不察再飲以糖酒生化湯之類則輕者重而重者危不遇明眼人亦但知其產亡而不知艾死於何病誤於何藥也我見實多每為太息其後條之乍寒乍熱亦當如是諦察庶免遺人天殃也箋疏新產發熱血虛而陽浮於外者居多亦有頭痛此是虛陽之升騰不可誤謂冒寒妄投發散以煽箕焰此惟潛陽攝納則氣火平而熱自已如其淤露未盡稍參宣通亦即泄降之意初不必過與參耆反增其壅感冒者必有表證可辨然亦不當妄事疏散諸亡血虛家不可發汗先賢儀型早已諄諄告誡則惟和其營衛慎其起居而感邪亦能自解蓋腠理空疏之時最易感冒實是微邪本非重恙自不可小題大做一誤再誤又有本非感冒新產一二日閒蒸釀乳汁亦發身熱則活血通乳亦極易治沈謂宜用膠地者則虛甚之外熱必舌光無苔其宜用四逆者則陰盛之格陽必唇舌淡白或顴赤之戴陽雖皆不常有之症而在血脫之後變幻最多固非心粗氣浮率爾操觚者所能措置裕如矣王謂胎前伏邪娩後陡發之症實是其人木有蘊熱痰濕分娩而正氣驟衰病狀乃著辨之於舌最是秘訣則惟治其濕熱痰滯抉去病根切弗效明人治熱只知表散產後誤事必較之平人尤其捷見盂英長於溫熱最惡生化一方為暑熱濕熱令中剴切動戒誠是至理名言砂糖酒尤其肇禍此因江浙間之惡習不可不改者若在寒天生化砂糖少用之亦不為大害惟酒則不可不戒耳乍寒乍熱武叔卿曰血閉於陽經榮衛行之不通則寒血閉於陰經榮衛動之不通則熱必瘀通而後寒熱自己仲景曰病磊淅惡寒而復發熱者陽脈不足陰往乘之陰脈不足陽往乘之沈堯封曰前條是瘀血後條是陰陽相乘甚則俱有戰僳者治瘀血宜奪命丹調補陰陽輕則歸耆建中重則桂附人昧箋疏乍寒乍熱亦當如上條發熱各症一例論洽不必另為一門反滋眩惑武氏血關於陰陽之經一說只是故為深丈實覺無謂至引仲景一條亦不過正氣之不充耳頭汗王海藏雲頭汗出至頸而還額上偏多蓋額為六陽之會由虛熱薰蒸而比也沈堯封曰汗出不止屬氣血兩虛黃耆五錢炒白芍三錢酒炒歸身二錢棗仁二錢炒甘草一錢炒小麥三錢炒南棗肉三錢煎服神效與眩暈內呂姓婦一按參證箋疏自汗已是虛陽之外浮但頭汗出尤為陽越之明證堯封固表涵陰立法誠是頤謂尚宜加潛斂則龍牡萸肉皆不可少人參亦佳滋陰即以涵陽勿調參是甘溫也泄瀉沈堯封曰乙亥初夏傅木作婦產時去血過多隨寒戰汗出便瀉不止余用大劑真武乾薑易生薑兩劑戰少定而汗瀉如故又服兩日寒戰復作余用補中湯無人參加附子兩劑病者云我肚裡大熱口渴喜飲然汗出下利寒戰仍不減正凝神思慮間其母曰彼大孔如洞不能收閉諒無活理余改用黃耆五錢炒北五味四錢搗白芍二錢炒歸身一錢五分炒甘草一錢五件炒茯芩二錢大棗三個一劑病減匹劑而愈王孟英曰觀此案則可見氣虛不能收攝者宜甘溫以補之酸澀以收之不可用辛熱走泄以助火而食氣也箋疏寒戰利下加以自汗重武湯元是針對乃反裡熱渴飲而汗利寒戰俱不應此中玄理未易尋思改授甘溫轉變靈通至不可少孟英辛熱走泄四字剖解入微參透三昧醫學中危微精一心傳豈易領悟此最上乘禪也學者皆當熔金祀之堯封又曰鄒氏婦產後便泄余用參附溫補藥未效新城吳敬一診云虛寒而兼下陷用補中益氣加熟地茯芩桂附應手取效以是知方論內言下虛不可升提不盡然也箋疏產後下虛不可升提以拔動腎根木是至理名言必不可易然泄瀉滑利明是氣虛下陷東垣成法正為是症而設言譏一端各有所當況升柴本是極輕藉以扶肋參耆振作元氣自當應手成功此非浪投柴葛者所可籍日也堯封又曰陸姓婦產後三日發疹細而成粒不稀不密用荊芥蟬蛻黏子等藥一劑頭而俱透越一日淅有回意忽大便溏泄數次覺神氣不蜜問其所苦曰熱曰渴語言皆如抖出脈虛細數有七至我師金大文診之曰此陽脫證也屬少陰用生附子三錢水洗咯浸切片熯如炒米色炮乾薑八分炒甘草一錢炒白芍一錢五分水煎衝入尿一調羹青魚膽汁四小茶匙服畢即睡覺來熱渴俱除續用黃耆建中湯加丹參蘇木二劑而安箋疏疹屬肺有風熱之邪法應半涼輕散荊芥牛蒡等本是正宗惟在產後正氣必虛牛蒡輕散皮毛雖非猛劑然最易滑泄大便以子能下行肺氣既疏而表裡相戾大陽亦為之不固故凡大便不堅實者本宜避之連得溏泄而語言振虛脫之狀固已昭著加以脈之虛細則熱也渴也俱非真象附於理中當為必用之劑此其外有凜寒及唇舌之色應有虛脫確證可察而乃用膽汁之法意者尚有格陽戴陽真寒假熱之證在否則附理中直捷爽快何必多此一層惟頤竊謂仲師內通加膽一法尚是古人思想之不靈活處蓋白通欲其通陽而以苦寒和之終是混冰炭於一爐之中豈不縛賁育之手病者之熱甚假膽汁之寒不是假於實用上必難祥應何如後人熱藥冷服之為的當乎堯封又曰產婦惡露不行餘血滲入大腸洞泄不禁或下青黑物的寄散極驗荊芥大者四五穗於蓋內然火燒成灰不得犯油火入麝香少許研勻拂湯一兩呷調下此藥雖微能愈大病慎弗忽視箋疏洞泄不禁不可謂是血證且惡露非腸中之瘀何以而滲入大腸以生理學言之殊難符合此蓋是古人理想之辭不無誤會荊芥炭本可治便血所謂大便青黑者實即是大腸之血病耳千金膠蠟湯治產後利黃蠟二藩子大阿膠二錢當歸二錢半黃連三錢黃檗一錢陳米半升煎湯煎藥服箋疏此是濕熱淤積之滯下非泄利之利故用黃連黃檗以在產後故月當歸阿膠黃蠟收澀防其虛陷然產後滯下為虛為實種種不同仍當辨症用藥必不可膠執成方反多流弊便秘頭痛沈堯封曰陰虛於下則陽易升上致頭痛者童便最妙褚侍中雲童便降火甚速降血甚神故為療厥逆頭疼之聖藥若血虛受風宜一奇散即芎歸湯也不可不辨箋疏陰虛而氣火升浮法宜潛陽涵陰為主童便本是新產神丹不僅可已頭痛且無誤用之弊果有風寒外侵歸芎未嘗不了然一降一升正相對照辨症胡可不慎薛立齋案一產婦頭痛曰用補中益氣已三年稍勞則惡寒內熱擬作陽虛治加附子一錢於前湯中數刻不發箋疏頭痛安有可日用益氣至三年之理更何論乎產後縱使果是清陽下陷之病亦必升之又升迸出泥丸宮去惡寒雖可謂是陽虛然內熱獨非虛乎明是偽造之案而敢欺人如是夫已氏之荒謬已臻極步且以誤盡初學實屬罪不容銖堯封採此受其愚矣胃脘痛腹痛少腹痛沈堯對曰有血淤血虛停食感寒肝氣之異手按痛減者血虛也接之痛增者非停食即瘀血停食則右關脈獨實且有噯哺氣瘀血則所下惡露必少得熱即減者感寒也至若厥陰肝脈抵小腹挾胃又為藤血之臟血去肝虛其氣易動一關氣惱陡然脘腹大痛治法血虛宜歸耆建中消食惟查肉最妙兼和血也消瘀宜奪命散感寒者輕則炮姜艾葉重則桂附茱萸肝氣作痛養血藥中加川楝橘核苦以泄之重則為梅辛散酸收苦池並用箋疏產後胃脘痛古有敗血搶心一說然子宮中之淤垢何以直攻到心此是理想之談誤人不小縱使惡淤不多而為胃痛不過降少升多肝膽氣滯耳用破瘀之法而病亦相應者正以泄降則氣自不升其理亦淺而易見非徑以破上焦之血然終宜和肝行氣為允破瘀必非呆板之法腹痛少腹痛初產之時甚少俗謂之兒枕痛此多淤虛猶存或臨蓐時未免稍受寒涼苟非盛夏炎天生化湯最宜正治炮姜桃仁本是無瘀不能為害又如澤蘭艾葉茺蔚皆所必需但川芎主升不可妄用查肉極妙非僅消食亦能和血砂糖未始不可服但不必大多而最不宜於炎天耳盂英書中深惡於生化砂糖蓋有為而言然亦不必因噎廢食如在既產數日之後則苟非痰食多屬血虛而氣為之滯堯封養血二字最佳川棟烏梅橘核無一非柔肝必需之品俟藹輝曰一婦產後腹痛令其夫以手接之小腹痛尤甚下惡露而痛仍不減知其非瘀乃燥糞也予藥一劑大便潤下而愈姜用川治驗炮姜五分丹皮二錢歸身三錢川芎一錢五分山查二錢炒枳殼一錢五分炒麻仁二錢杵爛桃仁泥二錢生地二錢炙甘草四分加研爛松子仁五粒箋疏大便不通固亦腹痛中之一症產後津傷尤多便秘此必問而知之而辨症辨脈尚在其次蕭賡六曰下血過多肝經血少腹痛其脈弦者以熟地萸肉為君加白芍木瓜蒺藜一劑可止有難產久坐風入胞門致腹痛欲絕其脈浮而弦續斷一兩防風五錢服之立愈箋疏血虛而用熟地萸肉是也其風入胞門一說殊不可信產後中氣必處脈浮固所當有何得認作風之確證且腹痛病是在裡脈又必不應浮防風大劑豈新產時所可妄試腹中虛痛胸項結核薛立齊案一產婦腹中有物作痛投破氣行血藥尤甚肢節胸項各結小核隱於肉裡此肝血虛也蓋肝為藏血之臟而主筋血虛則筋急而孿見於枝節胸項者以諸筋皆屬於節而胸項又肝之部分也用八珍逍遙歸脾加減治驗箋疏血虛筋急關節間結成小粒不癢不疼是宜養血以舒筋者薛主逍遙蓋謂疏肝即所以舒筋然新產陰傷浪投柴胡必有流弊八珍歸脾俱是呆板立翁慣伎終少靈通無甚可取小腹痛淤血成膿薛立齋案一產後小腹作痛行氣破血不應脈洪數此瘀血成膿也用瓜子仁湯二劑痛止更以太乙膏下膿而愈產後多有此證雖非癰用之神效脈洪數已有膿脈但數微有膿脈遲緊但有瘀血尚未成膿下血即愈若腹脹大轉側作水聲或膿從臍比或從大便出宜用蠟礬丸太乙膏及托裡散凡瘀血宜急治緩則化為膿難治若流注關節則患骨疽失治多為壞證箋疏此陽癰也必有形塊痛不可按產後瘀滯不行留於經隧固有此症然治法止有行氣導淤未成可消已成可下如在皮裡膜外則成膿亦必外潰不能皆從大腸而下其內服之藥除行氣行淤外尚復有何妙用凡腸癰少腹癰之治法皆是如此況在產於淤血尤其顯著乃薛調行氣破血不應必用瓜子仁湯而痛止太乙膏而膿下抑知瓜子仁湯方惟萎仁桃仁薏仁丹皮四味薛氏之外科發揮有此方功力尚不能行氣行瘀乃謂可使痛止已是欺人之談金匱大黃牡丹皮湯謂治腸癰當下膿血力在硝黃乃去此二味而加薏苡豈有膿成而可止痛之理此誤會古書而大失其神隨著太乙膏本為外科薄貼之通用古人雖亦有作丸內服之說則是宋金以降內外分科治內科者全不知外科理法謬謂既可外貼即可內治不知黏膩之極既作丸子則堅凝不化直入胃腸仍從大便囫圇解比何能有效且謂雖非癰亦可用此則太乙膏豈可為產後腹痛之通用品既不能知腸癰之實在治法而又不能治腹痛拾古人無謂之唾餘以售其欺妄可鄙孰甚又調膿從臍出則惟小腸癰之成膿者有之俗謂是盤臍腸癰最為難治十不全一然產後縱有血瘀僅在下部當不至此蠟礬丸本非有用之方黃蠟之黏白礬之澀能令血失流行之常有害無益而謬謂可以護心護膜使瘍毒不致內攻實是制方者之臆造而瘍科書中無不依樣葫蘆照抄一遍吾國瘍醫之陋久已不可復問薛又謂宜用托裡散則膿已出矣而尚可托豈嫌其成膿不多而欲令泄盡血肉此皆瘍醫家之亂道語而掇拾寫來自矜妙用無一非薛氏之不學無術不值一哂而堯封採之蓋堯封亦苦不知治瘍不能識破其剿說之完全無用此實內外分部之一大弊也王盂英曰古今醫按載一婦產後惱怒左少腹結一塊每發時小腹脹痛從下攻上膈間乳上皆痛飲食人胃即吐遍治不效葉香岩用炒黑小茴一錢桂酒炒當歸二錢自制鹿角霜菟絲子各一錢五分生查肉三錢川芎八分水煎送阿魏丸七分八劑而愈次用烏雞煎丸原方半料永不復發又云消積之方如桃仁煎用大黃蟲芒硝東垣五積丸俱用川烏巴霜局方聖散子三稜煎丸俱用硇砂乾漆此皆峻厲之劑用而中病固有神效若妄試輕嚐鮮不敗事試閱葉案積聚門並無古方狠如千金硝石丸人參硝黃並用丹溪猶以為猛劑學者但將丹溪治積聚諾案細繹自有悟處而黑神丸生熟漆並用尤勿輕試每見服之誤事因思漆身為癩之言則飛補之說其可惑乎箋疏葉氏是案確已將為腸癰然因惱怒而起仍是肝絡鬱結為患但必有寒症故可用桂酒及小茴至一錢之多非兒是小腹結塊脹痛皆當投以此方讀者必不可誤認前謂峻劑不可妄投確是見道之言平人皆應謹慎亦不僅為產後言之生漆最毒聞其氣者尚能發腫甚且皮膚腐爛豈可以入胃腸不解本草經乾漆何以列入上品且謂生者久服輕身耐老云云殊覺可駭豈古之漆非今之漆耶讀古書者胡可為趙奢之子腰痛大全云產後惡露方行忽然斷絕腰中重痛下注兩股痛如錐刺入骨此由血滯經絡不即通之必作癰疽宜桃仁湯五香連翹湯沈堯封曰前方不穩不若用桃仁紅花地龍肉桂沒藥當歸為妥如神湯治瘀血腰痛延胡當歸肉桂等分水煎服沈堯封曰腰痛不見前證者多屬肝腎虛宜當歸杜仲補骨脂之類箋疏產後腰痛虛症最多宜滋肝腎真陰前人多以瘀血立論專就一面著想耳即大全所謂兩股痛如錐刺者亦未必無虛證臨症時皆當合四診參之自有確據不可徒於故紙堆中搜尋方法遍身疼痛薛云以手接之痛甚者血滯也按之痛緩者血虛也箋疏遍身疼痛痛在絡脈皆無一定處所病人自己且無從摸索如何可以尋按薛立齋乃如此說法真是按圖索驥此公庸愚說來無不發噱此證多血虛宜滋養或有風寒濕三氣雜至之痹則養血為主稍參宣絡不可峻投風藥浮腫沈堯封曰產後浮腫先要分水病氣病水病皮薄色白而亮如里水之狀氣病皮厚色不變經云腎者胃之關也關門不利聚水生病蓋產後腎氣必損胃底陽微不能蒸布津液通調水道此聚水之由也宜腎氣湯丸是證皮簿色白可證人身營衛之氣通則平滯則脹頑痰瘀血皆能阻滯氣道作腫是證皮厚色不變以脈弦者為痰脈細而或芤者為血分證分別論治用藥更有一種血虛而致氣滯者其腫不甚色帶淡黃宜歸身為主佐以白朮陳皮茯芩之類箋疏凡腫均宜如是辨證亦不僅為產後而言有肺氣不肅面目浮腫者則宜輕疏開肺一二劑即效咳嗽沈堯對曰一婦妊七八個月痰嗽不止有時嘔厚痰數碗投二陳旋覆不應用清肺滋陰愈甚遂不服藥彌月而產痰嗽如故日夜不寐三朝後二陳加膽星竹瀝吐出厚痰數碗嗽仍不止更用二陳加旋覆當歸少減稍可吃飯因嗽不減痰漸變薄加入生地四錢食頓減嗽轉甚通身汗出脈象微弦用歸身三錢茯芩二錢炒甘草一錢紫石英三錢因汗欲用黃耆因嗽又止推敲半響仍用炒黃耆三錢一服汗止而嗽亦大減十劑而安箋疏咳嗽是雜病中之一大門產後胎前本亦無甚大別皆隨症治之明辨其寒熱虛實四字而已惟有痰而舌膩者終不可輕用清肺滋陰之藥徐靈胎批指南早已言之諄諄堯封此條兩度轉甚可為殷鑑惟間亦有腎虛水泛而為痰浮陽沖激而作嗽者則屬下虛法宜攝納滋填涵斂其上浮之沖氣嗽自減痰自少產後陰傷更多是症蓐勞怯損即此根萌但知清肺化痰皆是製造虛勞之無上秘訣口眼喎斜丹溪云必須大補氣血然後治痰當以左右手脈分氣血多少治之切不可作中風治用小續命湯治風之藥箋疏但有口眼喎斜尚是類中風之輕症如在初產則深閨閉藏之時試問何致外風猝襲小續命湯古法本當為殺人之利器頤終不悟古人何以有此奇病奇治今則氣血沖腦四字久己熟在人口則陰虛於下陽越於上氣升火升激動腦之神經失其功用實是淺而易知顯而共見產後有此亦固其所丹溪大補氣血一語蓋亦見於陰虛陽越之至理然必以左右分別氣血兩門頤終嫌其說得太呆幾以此身氣血兩者劃分界限一如從前官僚站班文束武西必不可越雷池一步者人身中那得有此寄局丹溪何至不通如此然即使大補氣血參以治痰亦尚是統籠說法未必有效如能潛鎮浮陽以泄降上升之虛火是症甚輕呈效必捷此古人之疏遠不逮近人之密而局外人猶謂中醫之學千百年毫無進步真是夢話腰背反張薛立齋云產後腰背反張肢體袖搐因亡血過多筋無所養使煞大補氣血多保無虞若發表驅風百不全一武叔卿雲寒主收引背項強直寒在太陽經也諸家皆主續命湯此古法也郭氏不問產後虛實邪之有無概用續命似覺偏一至薛氏專主亡血過多非十全大補不可是或一見乃夷堅志按以大豆紫湯獨活湯而愈亦主於風矣是續命固不為妄也但本方有麻黃附子氣血兩虛人不可輕用而郭氏論又囑人速灌取汗而解偏不以麻黃為忌何也二說俱不可廢臨診時詳之沈堯封曰仲景論腰背反張為痙無汗者為剛痙主以葛根湯有汗者名柔痙主以桂枝加葛根湯桂枝湯乃治中主方故有汗之痙屬風葛根湯中用麻黃麻黃乃散寒主藥故無汗之痙屬寒仲景治少陰傷寒未見吐利之裡證者用麻黃附子細辛湯麻黃附子甘草湯微發汗蓋寒邪乘少陰之虛而欲入急以附子保坎中之陽而以麻黃散外感之寒真神方也小績命湯雖非仲景之制方中用此二味正見攻守相須之妙而叔卿反云麻附二味氣血兩虛者不可輕用假使除卻麻黃何以散客寒除卻附子何以保真陽特不可用於有汗之柔痙耳有汗柔痙更有兩種一則因虛而受外來之風一則血虛則筋急並無外感之風有風者雖汗出必然惡風主以華元化愈風散祗血虛而無風者必不惡風純宜補血又曰人身氣血之外更有真陽真陰藏在坎中亦立命之根基胎繫於腎腎司二陰產兒之時下焦洞闢坎中陰陽有不大損者乎況背後夾脊兩行俱太陽經脈太陽之裡即是少陰脊裡一條是督脈亦款少陰此脈急縮與少陰大有關會此用麻兼用附之深意也使置此不講徒執氣虛血虛以治產後百病業醫亦覺太易矣箋疏痙直強急甚則腰背反張其形如弓俗書遂謂之角弓反張小兒急驚風病多有之而產後亦間有之類中風症及時病熱甚傷陰者亦時有痙直強硬腰餚不可動之症但不致如幼孩產婦彎曲之甚竟如弓狀是證在仲景書中傷寒論金匱要略皆有痙之專篇大同小異但金匱有方藥而本論無之專以太陽病立論固謂太陽行身之背其經脈兩行直下寒入太陽則經縮而短急因為反張說理亦甚精當所以主治之藥金匱則括蔞桂枝湯葛根湯而六朝以降則皆主績命即在產後亦復如是或則大豆紫湯獨活湯豆淋酒或則荊芥一味之愈風散無一不從表散寒風立法頤不敢謂古時必無此對藥之病惟以所見之症言之則多是陰虛陽越氣火上升之腦神病如小兒之急驚風純屬內熱盡人能知而時病中之抽搐痙直又皆在熱久傷陰津液耗竭之時所以肝風陡動變生諸幻產後陰脫於下陽焰上浮氣火上升攻激犯腦亦固其所竊恐古人續命紫湯等法對此病情未免南轅北轍且痙直者必更有手足牽制諸症更迭而來謂背屬太陽猶之可也然手足並非太陽則一例掣動者又將何以說之古來治小兒急驚未聞有主綴命義散者何以產後之痙悉屬寒風而熱病中之痙直瘛瘲者又將何治之薛立齋專主大補蓋亦有見於此惟十全一湯呆笨有餘鎮攝不足且歸芎耆桂亦溫亦升治此氣血上衝仍是有害無益則立齋用藥因慣於渾侖吞吐不辨滋味者亦當存而不論堯封前於發狂譫語一條能知是熱痰上冒而不知此之痙直仍是氣血上奔止以腦神經之說古所未聞遂不能觸類旁通悟此原理而徒以太陽少陰高譚玄妙見解雖高終非此症真諦小續命湯治產後中風身體緩急或頑痹不仁或口眼喎斜牙關緊急角弓反張防風一錢麻黃去節黃芩白芍人參川芎防已肉桂各七分附子咆杏仁各五分甘草四分炙加生薑水煎服箋疏中風之身體緩急口眼喎斜牙關緊急角弓反張皆是內動風陽氣血沖腦擾亂神經之症即素問調經論之所謂血之與氣井走於上則為大厥厥則暴死氣復反則生不反則死生氣通天論之所謂血菀於上使人薄厥金元以降已明知其為火為氣為痰病本內因故謂之為類中風所以別於漢唐人專用辛溫升散之真中風然猶無一人不教人用小續命湯實是大惑不解而產後血虛仍可用此防風麻黃豈不知仲景有亡血虛家不可發汗之禁耶惟此誤已久遍國醫書靡不依樣葫蘆描摹一過非數十百言所能說明者頤別有中風詮一書專論之茲姑從略惟堯封於上文產後之發狂譫語及下文金姓之口眼歪斜手足不舉能知是痰阻經絡而獨於此條仍踵古人之誤認作外風豈不自矛自盾華跎愈風散治產後中風口噤牙關緊閉手足瘛瘲如角弓狀亦治產後血暈不省人事四肢強直心眼倒築吐瀉欲死此藥清神氣通血脈如神荊芥略炒為末每服三錢黑豆淬酒調服童便亦可口噤擀開灌之或吹鼻中李瀕湖曰此方諸書盛稱其妙姚僧垣治驗方以酒服名如聖散藥下可立應效陳氏方名舉卿古拜散蕭存敬方用古老錢煎湯服名一捻金許叔微本事方云此藥委有奇效神聖之功一產後睡久及醒則昏昏如醉不省人事醫用此藥及交加散云服後當睡必以左手搔頭用之果然昝殷產寶方云此病多因怒氣傷肝或憂氣內郁或坐草受風而成宜服此藥戴氏證治要訣名獨行散頁似道悅生隨抄呼為再生丹箋疏此亦治外風之法惟荊芥炒黑亦能下瘀故尚可用但酒必不可服蕭氏用古錢煎湯者是重墜之義以鎮氣火之上衝耳昝殷既知怒氣傷肝憂氣內鬱則病屬內因明矣何以又謂之受風吾國醫學家言每每若明若味乍是又非最令人昏昏欲死此習醫之所愈覺其難也沈堯封曰丁丑三月練塘金虞旬第四媳產後變證伊郎夾請先述病狀云上年十月生產甚健至十二月初旬面上浮腫驅風不應加麻黃三帖通身脹腫小便不利更用五皮雜治反加臍凸更用肉桂五芩小便略通脹亦稍減續用桂附八味其腫漸消惟右手足不減忽一日口眼歪斜右手足不舉舌不能言因作血虛治變為俯不得仰數日後吐黑血盈孟吐後俯仰自如旬餘復不能仰又吐黑血而定投以消瘀忽然口閉目開如脫狀伊母一夜煎人參三錢灌之得醒醒來索飯吃一小杯近日又厥灌人參不醒已三晝夜矣余遂往診右手無脈因腫極不以為快左脈浮取亦無重按則如循刀刃余曰此是實證停參可醫遂用膽星半夏石菖蒲橘皮天蟲地龍紫草水煎入竹瀝薑汁一劑知四劑手足能舉不換方十二劑能出外房診脈諸病悉退惟舌音未清仍用前方而愈金問奇病之源余曰人身臟腑接壞受胎後腹中遂增一物臟腑之機括為之不靈五液聚為痰飲故胎前病痰滯居半千金半夏茯芩湯斫以神也至臨產時痰涎與惡血齊出方得無病若止血下而痰飲不下諸病叢生故產後理血不應六神湯為要藥此證初起不過痰飲阻滯氣道作腫血本無病用五芩腎氣腫減者痰滯氣道得熱暫開故也久投不已血分過熱致吐血兩次至若半身不遂口眼歪斜舌絡不靈俱是痰滯經絡見證即厥亦是痰迷所致並非虛脫故消痰通絡病自漸愈何奇之有王盂英曰此等卓識皆從閱歷而來朱生甫令郎仲和之室娩後患此醫治不能除根再產亦然延已數年繼復懷妊病發益頻余用大劑滌痰藥服月餘產後安然病根竟刈箋疏口眼歪斜手足不舉舌不能言甚至昏厥豈非素問之所謂血菀於上使人薄厥腦神經病灼然無疑重用豁痰降逆則氣不上升所以有效則上節猶盛稱麻黃附子何耶沈堯封曰震澤一婦產十餘日延我師金大文診視余從據述新產時證以虛脫服溫補藥數削近日變一怪證左邊冷右邊熱一身四肢盡然前後中分冷則如冰熱則如炭鼻亦如之舌色左白右黑師問曰此是何病用何方治余曰書未會載目未會睹不知應用何方師曰奇證當於無方之書求之經不云乎左右者陰陽之道路也陰陽者水火之徵兆也敗血阻住陰陽升降道路不能旋轉陽盛處自熱陰盛處自寒所以偏熱偏寒用澤蘭查肉劉寄奴蘇木桃仁琥珀等藥兩劑病熱減半繼服不應遂更醫雜治以至不起由今思之此證不但血阻必兼痰滯我師見及阻住陰陽升降道路病源已經識出特跳不出產後消瘀圈子耳倘通瘀不應即兼化痰或者如前案金婦得起未可知也此時彭尚初學我師見識過人特未悟徹痰滯一證惜哉箋疏此是奇症誠不能勘破其真相升降阻塞於理甚是破瘀豁痰洵可以備一說然必曰能收全績亦正難言薛立齋案郭茂恂嫂金華君產十日不食始言頭痛頭痛已又心痛作既而目睛痛如割如刺更作更止相去無瞬息間每頭痛欲取大石壓良久漸定心痛作則以十指抓臂血流滿掌痛定目復痛復以兩手自剜目如是十日不已眾醫無計進黑龍丹半粒疾少間中夜再服乃瞑目寢如平時至清晨下一行約三升許如蝗蟲子病減半已刻叉行如前痛盡除黑龍丹治產難及胞衣不下血迷血暈不省會事一切危急惡候垂死者但灌藥得下無不全活當歸五靈脂川芎良薑熟地各二兩銼砰入砂鍋內紙筋鹽泥固清火煆過百草霜一兩硫黃乳香各二錢琥珀花蕊石各一錢為細末醋糊丸如彈子大每用一二丸炭火煆紅投入生薑自然汁中浸碎以童便合酒調灌下箋疏此藥人火煆紅則止有花蕊石硫黃尚存餘質此外盡為灰燼復有何用而謂大有神靈於理難信薛案仍是瘀血耳謂為下如蟲子蓋亦言之太過小便不通產乳集用鹽填臍中命平蔥白搗鋪一指厚安鹽土以艾炷餅上灸之覺熱氣入腹內即通最靈沈堯封曰此法不效必是氣虛不能升舉黃耆補氣之中已寓上升之性用以為君五錢麥冬能清上源用以為臣一錢五分白通草利水達下用以為佐八分水煎服一劑可效箋疏沈所謂之氣虛不升是中州清陽之氣下陷反致膀胱窒塞不通即所謂州都之氣化不行者黃耆補氣能升舉清氣而不致如升麻之輕迅即在產後亦可無弊重用固宜謂麥冬能清上源者肺氣不宣則小水閉塞麥冬潤肺是滋其源然尤宜先通肺氣紫苑兜鈴桑白皮路路通等俱為通泄小水極驗之藥而桂枝能遍太陽之陽氣下元陽虛者宜之頤編醫案平議太陽府證中有張洛鈞治案一條頗可法也又通關係滋腎丸亦佳尿血大全云產婦尿血面黃脅脹少食此肝木乘脾土也用加味逍遙散補中湯箋疏此症雖在產後必有虛實之殊虛者中州之氣陷逍遙補中洵可以備一法實者則膀胱蘊熱亦必清理非蠻補可愈而升清又在禁例亦當與平人一例論治不以產後而有異尿胞被傷小便淋瀝
