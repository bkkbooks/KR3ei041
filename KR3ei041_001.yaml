body:
  text: 卷上小引女科之有專書自陳良甫大全良方而以後王氏準繩最為羞富武之望叔卿氏又依據準繩別為濟陰綱目門分類別非不粲然可觀而讀之輒覺陳陳相因腐氣滿紙者以袁集古人空泛議論絶少切要發明則通套之詞未免隔膜而搔不著癢處如是而求臨證之時必收捷效蓋亦僅矣竊謂宋金元明諸家醫籍皆未能脫此痼習固不必專以為女科書之病惟堯封沈氏女科輯要寥寥數十葉精當處勘透隱微切中肯繁多發前人所未發實驗彰彰始覺軒爽豁目頤早歲習醫治婦女病即從是書入手臨證以來獲益不少而盂英按語更能刻進一層洞見癥結皆是此道之金針雖僅小小兩冊大有取之無盡用之不竭之妙近來舊刻極不易得滬上新有石印本在潛齊醫藥叢書十四種內繕寫不精錯落處至不可讀爰議重緑一過少少引申其餘義以徵經驗適本校授課有以分科之說進者乃即用是編以示女科之涯略附以二十餘年閲厯所得作為箋注姑以自識心得是耶非耶請讀者於臨狀治療時自證之何加壬戌仲春張壽頤記時寓浙蘭江之中醫專校經水素問女子七歲腎氣盛齒更髮長二七而天癸至任脈通太衝脈盛月事以時下沈曰天癸是女精由任脈而來月事是經血由太衝而來經言二十而天癸至緣任脈通斯時大沖脈盛月事亦以時下一順言之一逆言之耳故月事不來不調及崩是血病咎在衝脈衝脈隸陽明帶下是精病咎在任脈任脈隸少陰蓋身前中央一條是任脈背後脊裡一條是督脈皆起於前後兩陰之交會陰穴難經明晰靈素傳誤帶脈起於季脅似束帶狀人精藏於腎腎繫於腰背精欲下泄必由帶脈而前然後從任脈而下故經言任脈為病女子帶下孟英曰俞東扶云經言男子二八而腎氣盛天癸至精氣溢瀉若天癸即月水丈夫有之乎蓋男女皆有精易謂男女構精可據燃指天癸為糖亦不妥天癸為精不當又云精氣溢瀉矣後賢誹受孕之道有陽精陰血先至後沖等說亦謬夫男女交接會見女人有血出耶交接出血是病豈能募精及為精所里哉大約兩情酣暢百脈齊到天癸與男女之精偕至斯入任脈而成胎耳男胎女胎則由夫婦之天癸有強弱盈虛之不同也吾友徐亞枝曰如沈氏說一若天癸即精者加俞氏說一若血與精之外別有一物所謂天癸者竊謂天癸者指腎水本體而言癸者水也腎為水藏天一生水故謂腎水為天癸至謂至極也猶言足也女子二七男子二八腎氣始盛而腎水乃足蓋人生五藏惟腎生最先腎氣之充足最遲而衰獨早故孩提能悲能喜能怒能思而絶無欲念其有情竇早開者亦在腎氣將盛天癸將至之年可見臂氣未盛癸水未足則不生欲念也逮腎氣衰癸水絶則欲念自泯矣解此段經文者當云女子必二七而腎水之本體充足任脈乃通太衝之脈始盛月事因而時下矣夫前陰二竅溺之由水竅者無論矣其由精竅者皆原於天癸者也月水雖從衝脈下謂為天癸之常可也泄精成孕是任脈施受謂為天癸之能可也帶下乃任脈之失其擔任謂為天癸之病可也然則稱月水為天癸亦無不可前賢解此皆重讀上二字而略下一字惟將至字當作來字看遂至議論紛紜耳箋疏吾國醫學之十二經絡及奇經八脈原是西學解剖家所無治新學者恆誚舊籍為鑿空然以人身內外各部分之病狀而言某處是某經所過若發現某症即是某藏某府之虛實寒熱為病則固確然可信投藥得當而效如影響證據章章不可誣也蓋經脈之循行即西學之所謂血管而血管之周流莫不與藏府息息相通則某藏某府自必各有一定血管循行之道路吾國醫學發源最早古之神聖倡此學說自必神而明之洞矚其互相感應之理固不繫乎血管之實在形跡若必刻舟求劍剖而視之以驗其形相如何吾知古之人必無以巽於今之人手足肌肉之間必無此十二條直行血管可尋是亦今之所敢斷言者此中自有神化功用彼專以解剖為實驗雖曰器具精良物理細密竊恐尚不足以語此而猶以耳目器械之推測囂囂然笑吾舊學之荒誕殆無巽於夏蟲之語冰惟奇經八脈諸條則甲乙經經脈篇之所示詳雖內難中時一見之不可謂非上古發明之舊無如一鱗一爪語焉不詳巳覺難於徵實即以經脈二字言之既同是血管而古今人之言督脈者輒以脊骨之髓當之則獨具此顯然之形與十二經及其他之奇經不類豈非生理學中之絶大疑竇且督任之經最直何以前後之形又大相歧巽若此又十二經皆有動脈可按而督任亦有俞穴則皆不動且踽維沖帶則所過之穴即交會於其他諸經又似蔦羅附松不能自成一險者疑是疑非果何從而證實之徐亞枝謂天癸是腎水本體最合真理所以經文明言男子亦是天癸又謂腎生最先腎足最遲腎衰最早從孩提成年及老憊之實境徵之洵是濰鑿不移而從來未經道破之語須知癸水是腎藏真陰不能如女子之月事時下亦不能即以陽施陰受者當之堯封謂天癸由任脈而來月事由太衝而來又謂沖隸陽明任隸少陰精欲下泄由帶脈而前然後從任脈而下云云看似頭頭是道言之有物其實全由想像得來隨意指揮惟吾所命假使藏府能語吾知其必曰否否不然豈不知督任沖帶既是經脈從未聞任脈與陰竅相通而可謂女子月事男子施糖竟由太衝帶任諸脈而下那不令人駭絶試以西學生理求之此身結構自有隧道方悟吾國女科書中談及懷妊情狀備極千奇萬怪噴飯者不一而足正不獨陽精陰血先至後沖彼包此裹幾條之可哂東扶謂入任脈而成胎亦與堯封之言精泄出精泄出於任脈同一奇悟要之任稱為脈亦是血管之一枝安有精可泄而胎可受請細讀西學生殖一門然後知吾國醫界名賢固終其身未由悟到也王冰曰男以氣運故陽氣應日而一舉女以血滿故陰血從月而一下箋疏男以氣言女以血言就陰陽二字本義倣佛想像似不可以為不是然吾人之身氣血兩者果可以分道而行不相聯屬否即此一端已覺其立言之不妥況更謂陽氣應日而一舉真不知其從何處悟人有此奇語且月事時下亦不得謂為血滿此說極謬堯封氏何所取而録之月事不調素問天地溫和則經水安靜天寒地凍則經水凝泣天暑地熱則經水沸溢卒風暴起則經水波湧而隴起箋疏泣讀為澀素問此節本以脈象而言人之脈道譬於地之水道人在氣交之中脈道流行本與天地之氣默相感應故天地之氣和調則脈亦應之而安靜寒則澀滯熱則沸騰皆理之所必然者而猝然風起雲湧斯脈亦為之洶湧泛溢此言脈隨氣化為變遷則疾病作而脈狀應之亦事之所必至而理之所宜然者然此節經水並不指婦女月事經文彰彰可據堯封竟以經水二輯入月事條中頗似誤會惟月事為病其理本亦如是斷章取義固無不可耳楮澄曰女子天癸既至逾十年無男子合則不調未逾十年思男子合亦不調不調則舊血不出新血誤行或漬而入骨或變而為腫或雖合而難子合多則瀝枯虛人産乳衆則血枯殺人盂英曰此不盡然惟産乳衆而枯至死者頗多然吾鄉吳醞香大令夫人半産三次不計外凡生十男四女並已長成而夫人年逾五旬精力不衰猶能操家政而撫馭群下也箋疏楮氏遺書原是贋本四庫全書提要已詳紀文達所論洵不誣也就中論婦女體質雖未嘗無精當語然皆以理想推測言之不盡可信此節十年二句尤為臆斷至謂不調為舊血不出措詞更缺圓相須知不調二字所賅者廣有血於者有血枯者亦有固攝無權而崩漏者安得以不比二字概括之若謂新血誤行者皆因於舊血之不出豈漬而入骨變而為腫皆於血為患乎且漬而入骨一句更是故為奇僻駭人聽聞絶非病理所應有惟謂合多則瀝枯産乳衆則血枯二句確是不刊之論但以瀝枯興血枯相對言之詞近於鄙殊非高尚文字即此可為唐以後人僞託之證且産乳二字古人必不並稱乳即是産說文謂人及鳥生子曰乳獸曰産廣雅釋詁乳生也尸子胎生曰乳月令季冬雉沁雞乳注卵也皆非以乳汁飼兒之謂而此節産乳則必以乳汁飼兒言之惟其飼乳太多故血易枯尤為唐後文字之確證蓋嘗見有力之家生育極多惟不自乳則為之母者年逾大衍而形色不衰孟英所稱吳大令室人必非自乳其子可知方約之曰婦人不得自專每多忿怒氣結則血亦枯孟英曰此至言也氣為血帥故調經必先理氣然理氣不可徒以香燥也鬱怒為情志之火頻服香燥則營陰愈耗矣箋疏婦女見聞不廣故性多卡急其始也以心褊而生鬱怒逮基繼則愈郁愈怒而性愈偏此非藥餌所能療者豈獨不得自專者為然恆有得向專而更以長其偏心者總之吾國婦女多不學所識者小斯為氣結之真源耳孟英謂調經必先理氣洵是名言然理氣之方亦必不能屏除香燥高豉峰之滋水清肝飲魏柳洲之一貫煎皆為情志之火而設亦當參加氣藥並轡而馳始有捷效否則滋膩適以增壅利未見而害隨之惟不可止以香燥為兔園冊子耳趙養葵曰經水不及期而來者有火也宜六味丸滋水如不及期而來多者加白芍柴胡海螵蛸如半月或十日而來且綿延不止者屬氣虛宜補中湯如過期而來者火衰也六味加艾葉如脈遲而色淡者加桂此其大略也其間有不及期而無火者有過期而有火者不可拘於一定當察脈視稟滋水為主隨證加減盂英曰婦人之病雖以調經為先第人稟不同亦如其面有終身月泛不齊而善於生育者有經期極准而竟不受孕者雄於女科閲歷多年見聞不少始知古人之論不可盡泥無妄之藥不可妄投也箋疏先期有火後期火衰是固有之然特其一端耳如虛不能攝則雖無火亦必先期或血液漸枯則雖有火亦必後期六味之丹芩澤瀉滲泄傷陰豈滋養之正將不及期而經多肝氣疏泄無度固攝猶虞不及再以柴胡疏肝為害奚若至於綿延不絶更必大封大補而乃欲用東垣之補中湯則是肝腎陰虛於下而升提以拔其根株尤為可怪過期縱是火衰六味之丹澤何用溫經之藥又豈可獨特一艾葉脈遲色淡亦豈專恃一肉桂總之養葵所論無一句不庸陋膚淺開口便錯語病百出朱不足道孟英謂所稟不同實從閲歷經驗而來無妄藥之不可妄投二句足為呆讀古書者痛用針砭趙氏所論不過耳食之學辨色及痛趙養葵曰衝任藏經系胞又恃一點命門之火為之主宰火旺則紅火太旺則紫火太衰則白所以滋水更當養火甚有乾枯不通者雖曰火盛之極亦不宜以苦寒藥降火只宜大補其水從天一之源以養之使滿又曰紫與黑者多屬火旺亦有虛寒而黑色者不可不察若淡白則無火矣箋疏衝任是脈道脈中血旺則月事時下脈中血虛則月事不正非即經血之竅道何可竟以為經水所藏之所藏經一說豈非杜撰滋水養火雲云意中只有六味八味二方也沈曰王宇泰以寒則凝既行而紫黑定非寒症然投熱藥取效十中嘗見一二色白無火亦屬近理然間有不宜補火者嘗見元利一婦經水過期十日方至色淡穩婆據此投肉桂藥數劑經水來多遍身發黃不能飲食身熟脈數竟成危候此是丹溪所謂經水淡白屬氣虛一證要之臨證時段細察脈象復參旁證方識虛實寒熱倘疑似中有兩證兼見者先用其輕劑如色淡一證先用補氣法不效再投補火庶幾無誤録葉氏之說於後葉氏曰血黑屬熱此其常也亦有風寒外束者十中嘗見一二蓋寒主收引小腹必常冷痛經行時或手足厥冷唇青面白尺脈遲而虛或大而無力熟則尺脈洪數或實而有力參之脈證為確孟英曰色淡竟有屬熱者古人從未道及須以脈證互勘自得但不可作實熱論而瀉以苦寒也更有奇者方氏婦産後經色漸淡數年後竟無赤色且亦結塊平常亦無帶下人日以嬴餘診之脈突數口苦時有寒熱與青蒿白薇黃柏歸柴龜鱉芍藥烏惻杞子地骨等出入百劑而痊此僅見之證矣箋疏經淡古人多謂虛寒蓋氣血交虧所以其色不能化赤是虛字為重寒字為輕但宜益陰養血而少少加溫和之藥以流通之化育之斯得治療之正奈何耳食之徒但知其寒而忘其為虛剛燥溫辛益耗其血則其虛愈甚變爻自在意中趙謂淡白無火豈非只知其一不知其二沈案王案皆是虛證一以肉桂而難作一以清養而即安則彼之齦齦於黑屬熱淡屬寒者其亦可以憬然悟矣滑伯仁曰經前臍腹絞痛寒熱交作不如黑豆汗兩尺脈澀餘皆弦急此寒濕搏於衝任寒濕主濁下如豆汁與血交爭故痛宜辛散苦溫血藥徐曰辛散血藥是川穹之類苦溫血藥是艾葉之類箋疏經前腹痛無非肝家氣滯絡脈不疏治以疏肝行氣為主但須選用血中氣藥如香附烏藥玄胡之類不可專恃辛溫香燥耳伯仁謂兩尺脫澀即是絡中氣滯之徵況復弦急肝氣抑塞又其明證惟為寒為熱更當以其他兼症參之必不能僅據絞痛一症指為寒濕溉與苦溫蓋肝絡為病鬱熱極多寒症絶少滑氏此節殊嫌武斷李氏曰經水帶黃混濁者濕痰也箋疏經水色黃已是濕熱之徵況復混濁濕熱尤甚是宜清理不得以色淡並論概與滋補且舌苔脈症亦必有可據更宜參證丹溪曰經將行而痛者氣之滯也香附青皮桃仁黃連或用抑氣散四物加玄胡丹皮條芩又曰經將來腹中陳痛乍作乍止者血熱氣實也四物加小川連丹皮徐曰抑氣散出嚴氏香附四兩陳皮一兩茯神炙草各一兩半為末每服二錢治婦人氣盛於血變生諸證頭暈膈滿取內經高者抑之之義汪認庵謂和平可用若補血以平陽火亦正治也箋疏痛在經前誠是氣滯正惟氣滯而血亦滯故以香附青皮與桃仁並用而能行血中之滯清肝木之橫則玄胡金鈐尤為捷驗又以陳痛乍作乍止定俏為熱氣實則殊不然是當以脈證互參方有寒熱虛實可辨但據陳痛乍作乍止則虛寒者亦何必不然連芩丹皮安可為訓蓋丹溪遣著本非自定之本此後人附會為之致有此弊不可遞以丹溪病也嚴氏抑氣者仍是行氣之滯謂治氣盛於血大有語病究竟此非氣之有餘認庵謂其和平可用所見尤陋藥以去病為主唯在對症安問其和平不和平若以其和平而後可用是以嘗試敷衍為手遐更何有醫學之價值可言又曰經後作痛者氣血俱虛也又曰成塊者氣之凝也沈曰經後腹痛必有所滯氣滯脈必沈寒滯脈必緊兼寒兼熱當參旁證至若風邪由下部而入於脈中亦能作痛其脈乍大乍小有時隴起葉氏用防風荊芥桔梗甘草虛者加入參各一錢培黑取其入血分研末酒送神效又曰經前後俱痛病多由肝經而其中更有不同脈弦細者是木氣之郁宜逍遙散及川楝小茴香橘核之類脈大者是肝風內動體發紅塊者是肝陽外越俱宜溫潤戴禮亭室人向患經前後腹痛連及右足體發紅塊脈大右關尺甚已卯秋豫作肝風內動治用生地四兩炒枸杞一錢細石斛二錢杜仲二錢干淡蓯蓉麥冬牛膝各一錢歸身一錢五分炒白芍一錢服之痛止後於經前後服數劑經來甚適不服即痛因作丸服此方屢用有驗箋疏腹痛蓮足是肝腎之陰虛肝絡不能條達而虛陽外越故脈為之大右關尺尤甚是肝腎相火不藏之明證方以養陰涵陽為主不用香燥氣藥治本不治標最是良法與魏玉璜一貫煎同意但病是肝陽未嘗有內動之風藥中亦無息風之味則案語肝風內動尚未貼切宜易之曰肝陰不足肝陽不藏庶於脈大及體發紅塊俱能切合沈又曰經來聲啞症苟氏女嫁斜塘倪姓早寡體氣虛弱每逢月事聲音必啞豫用天冬地黃蓯蓉歸身等藥喑益甚張口指畫無一字可聞即於此方加細辛少許以通少陰之絡藥才入口其聲即出十餘劑後桂附八昧丸調理遂不復發箋疏此證此方亦是治肝腎陰虛之法所以音喑者所謂少陰之絡系舌本也腎氣不榮於舌本而音為之喑此非舌本強而無聲可知細辛少許以通少陰之陽氣大有巧思可法也撮耍經後圍暗屬血虛箋疏此是肝腎陰虛不能上榮於目治法亦當仿上二條若用魏氏一貫煎治之亦必有效汪石山曰經行泄瀉脾虛多濕宜參芩白朮散盂英曰亦有肝木侮土者箋疏脾陽不振最多此候宜加乾葛少許以升清氣王所謂肝木侮土者則左脈弦而右脈弱宜扶土而柔肝亦有左關反而而右關反徑者所謂木乘土位肝尤橫而土德益衰矣繆氏曰經行白帶屬陽虛下陷用參朮助陽氣盂英曰亦有鬱火內盛者淺疏帶下多濕熱及相火不藏為病惟臨經帶下則下元不能固攝可知此奧平素帶下不同仲醇陽虛下陷之論是也宜固攝肝腎而升舉清陽故止言參朮不用溫燥陽藥若盂英所謂鬱火當亦指肝腎龍相之火而言陰火不藏以致疏泄無度宜苦以堅之月事不來素問二陽之病發心脾有不得隱曲女子不月其傳為風消其傳為息奔者死不治沈曰二陽指陽明經言不指藏府言二陽之病發心脾者陽明為多血之經血乃水穀之精氣藉心火煆煉而成憂愁思虛慮心因及其子不嗜飲食血無以資生陽明病矣經云前陰總宗筋之所會會於氣衝而陽明為之長故陽明病則陽事衰而不得隱曲也太衝為血海並陽明之經而行故陽明病則衝脈衰而女子不月也箋疏經言不得隱曲節指所思不遂謀慮拂逆而言則心脾之陰螢暗耗而不月之病成矣堯封之解不得隱曲作為男子陽衰不能人道太覺奇特然亦不可謂之無理孟英曰經水固以月行為當然陰虛者多火經每先期陰愈虛行愈速甚至旬日半月而一行更有血已無多而猶每月竭蹶一行者其涸也可立而待也若血雖虛而火不甚熾汛必愆期此含蓄有權雖停止一二年或竟斷絶不行但其脈不甚數者正合坤主吝嗇之道皆可無慮味者不知此理而但憑月事以分病之輕重聞其不行輒欲通之竭澤而漁不仁甚矣箋疏陰血虛而月事不至但無少腹脹痛等證必不可妄投攻破希圖速效誤攻則崩漏之禍作矣且即有腹脹腹痛之證亦是血少而肝絡不疏宜滋養肝腎真陰兼之宣絡以疏達氣滯方是正本清源之治亦未必果是於滯而脹痛也盂英謂陰虛汛停皆可無慮所見極是頤治此症惟以養陰和肝稍參行氣宜絡俾胃納蘇而色澤轉自有水到渠成之妙淺者不知此理每用通經豈徒竭澤而漁孤注一擲抑柳且礱糠打油亦必無效甚至激動血管之血橫決暴崩不知崩中大下之血皆絡脈之血失其故道走入衝任而直注非月事之血誅伐無辜那不擾動氣營演成慘劇金匱云婦人病血虛積冷結氣經水斷絶張景嶽曰經閉有血隔血枯之不同隔者病發於暫通之則愈枯者其來也漸補養乃充沈曰金匱三證積冷結氣有血不行他景嶽謂之血隔積冷宜用肉桂大辛熱之藥導血下行後用養榮之法調之結氣宜宣如逍遙散或鳥藥香附行氣之品宣之虛者無血可行也景嶽謂之血枯宜補趙養葵補水補火補中氣三法最為扼要王孟英曰補水勿泥於六味補火勿泥於八味補中氣勿泥於歸脾箋疏金匱言婦人經水不來之證分三大綱積冷結氣二者皆血滯不行於法宜通冷者溫經行血金匱歸芎膠艾湯即治此症之鼻祖而千金婦入門中方藥最多皆會溫辛逐於之法亦皆為此症而設堯封只言肉桂一味尚嫌未備惟又言瘀通之後必以養榮調之善後良圖至不可少若氣結者自須先疏氣分之滯逍遙所以疏肝絡香附烏藥等皆宣通氣分而不失於燥固是匹宗又玄胡索一物血中氣藥流通活潑威而不猛亦是良藥獨用重用頗有奇功而俗子僅知其破血不敢頻用則未明其實在力量也亦有血本少而氣乃滯者則合之養榮法乃為萬全無弊僅事行氣尚失之偏至於虛而無血可行以致不月則非補何以蘇涸轍之鮒而回槁木之春趙氏補水補火補中氣七字確是挈領提綱最為要訣然試問養葵心目中當用何等方法則止有六味八味歸脾耳一經孟英喝破只恐俗醫聞之便失所恃將不知更用何藥而後可頤請為之申一義曰補水必以魏柳洲之一頁煎為骨而廣筆記之集靈膏董思翁之延壽丹陸九芝之坎離丸等可參也補火則河間之地黃飲子陰陽調劑不偏溫燥最堪則效補中則歸脾湯本是正宗但人之體質各有不同用古方者止可師其意而斟酌損益方能合轍不可如養葵之輩之渾侖吞棗耳寇宗奭曰童年情竇早開積想在心月水先閉蓋憂愁思慮則傷心心傷則血耗竭故經水閉孤火既受病不能榮養其子故不嗜食脾既虛則金氣虧故發嗽嗽既作則水氣竭故四肢干木氣不充故多怒髮鬢焦筋痿五藏以次傳遍故猝不死而終死也比於諸勞最為難治沈曰此條亦從金匱虛孛內分出實有是證但此證所願不得相火必熾非補水無以制之六味地黃湯補陰瀉陽固是妙法然脾虛食減倘嫌地黃膩膈炒鬆可也不然以女貞易之顧名思義並瀉相火盂英曰此證最難治六味礙脾歸脾助火惟薛一瓢滋營養液膏加小麥大棗遠志庶幾合法一瓢又有心脾雙補丸亦可酌用箋疏寇氏所述此症即素問所謂不得隱曲女子不月者也意淫紛擾神志蕩矣相火燔灼血安得不耗經安得不閉其食減而脾不司運化者血耗不行脾無所統安得不承其弊況病由情志而來所思既專忘餐廢寢水穀所供早已置之度外胃之減納初由若人之忘其所以繼而習慣自然穀神能無困乎經文特提心脾二真是犀燃牛渚洞燭隱微此不得隱曲四字節以所恩不遂而言特忠厚待人措辭尤為蘊籍耳其作嗽者即相火之上衝多怒者即肝陽之外越發焦筋痿無一非壯火灼爍津液一言以蔽之火炎水竭而已寇氏必以五行生勉附會五藏遞傳未免陳腐氣坌集滿紙令人對之欲嘔如此談醫實是魔道必不足徵沈謂六味補陰瀉陽亦嫌膚淺病到此關峻補肝腎真陰猶嫌不及尚何有瀉之可言丹澤茯芩豈能制此亢極之火熟地炒鬆更有何用未能免俗聊復爾爾竊為堯封不取惟謂女貞顧名思義云云可作則格言讀須知此是心病非於受病之源自知懺悔痛下針砭無論方藥如何終無逃出鬼門關之望世恆有及並之齡得勞層症已諸虛接踵醫家望之卻步而於歸之後竟弗藥有喜漸以康復者即以此症也婁全善閉有汙血凝胞門一證羅謙甫血極膏一味大黃為末醋熬成膏服之利一二行經血自下是婦科仙藥沈曰金匱論經閉有冷無熱非闕文也蓋天暑地熱則經水沸騰豈反有凝泣不來之理潔古東坦降心火瀉三蕉之說不可盡信即骨蒸肉熱亦屬陰虧非同實火之可寒而愈也孟英曰王子亨全生指迷方地黃煎以生地汁八兩熬耗一半內大黃末一兩同熬候可丸丸如梧子大熟水下五粒未效加至十粒治女子氣竭傷肝月事不來病名血枯蓋瘀血不去則新血日枯也即內經烏鯽蘆茹丸仲景大黃庶蟲丸之義後人但知彼血枯為血虛而不知血得熱則瘀反用溫補豈能愈此血枯之病堯封亦為此諭毋乃缺考箋疏得熱則血行過寒而血瘀乃理之常堯封之說自是正論然近世之人陰虛火旺者最多先以血本少也而生內熱繼則血更少而熱更熾乃火益壯而血益枯遂並其殘餘之血液而灼鑠煎熬盡為瘀垢羅謙甫之血極膏王子亨之地黃煎誠為此症而設然頤則謂來源已竭而尚欲從事於疏通亦是竭澤而漁少用之則緩不濟急多與之則正不能支必以大劑滋養之煎方相輔而行庶幾標本兩顧堯封竟謂熱則血無凝泣不來之理是未悟到此層誠為筆下失檢致貽盂英之譏然降心火瀉三焦之二說竟欲以寒藥治血閉則亦是虛家鴆毒斷不可行堯封固明知骨蒸內熱原屬陰虧者既浪狼用寒涼之理亦必不致專用溫補以治血熱血瘀者也淋漓不斷一名經漏陳良甫曰或因氣虛不能攝血或經行而合陰陽外邪客於胞內盂英曰亦有因血熱而不循其常度者箋疏經事延長淋漓不斷下元無固攝之權虛象顯然良甫謂經行交合一層亦是擾動衝任有關無闔皆宜封鎖滋填氣血並補此症總是屬虛何有外邪陳謂陰陽外邪殊不可解王謂有因血熱而不循其常亦是肝經疏泄無度必當替藏龍相封固滋填非僅清血熱所能有濟須知淋漓之延久即是崩陷之光機古人恆以崩漏二牢相提並論良有以也月事異常經云七七而天癸竭有年過五旬經行不止者許叔微主血有餘不可止宜當歸散産寶主勞傷過度喜怒不時李時珍作敗血論三說不同常參脈證箋疏二七經行七七經止言其常也然賦稟不齊行止皆無一定之候柔弱者年未不惑而先絶壯實者年逾大衍而尚行此隨其人才體質而有異故五十經行未必是病學士謂之有餘固可無庸藥餌然亦本無止血之法産寶所言則肝絡之泄疏太過是為病之一端當從崩例主治獨瀕湖以為敗血頗不可解總之當止而不止有餘者少不固者多崩漏根萌不可不慎似無認作敗壞之血而徑投攻破之理李時珍曰月事一月一行其常也或先或後或通或塞其病也有行期只吐血衄血或眼耳出血是謂倒經有三月一行是謂居經有一年一行是謂避年有一生不行而受胎者是謂暗經有受胎後月月行經而産子者是謂胎盛俗名胎垢有受胎數月經忽大下而胎不隕者是謂漏胎此雖以氣血有餘不足言而亦異常矣盂英曰有未及二七之年而經水已行者有年窬花甲而月事不絶者有無病而偶停數月者有壯年而泛即斷者有帶下過甚而經不行者有數月而一行者有産後自乳而仍接月行經者有一産而停經一二年者秉賦不齊不可以常理論也箋疏經行日期應月而輔亦言其常故或先或後參差數天苟無腰痠腹脹疼痛及經色或紫或淡或有瘀塊諸症皆因稟賦不齊不可謂病妄投藥餌即有經行腹痛頭痛目暈腰痠脊楚胸協脹滿乳房乳頭脹痛及經色不正諸症治療之藥亦止應中和柔順調養肝脾運行氣分為主不可偏熱偏寒大攻大補反致欲速不達故病未已新病復起倒經一症亦曰逆經乃有升無降倒行逆施多由陰虛於下陽反上浮非重劑折降無以復其下行為順之常蓋氣火之上揚為病最急不可認作無病諉為不必用藥且此是偶然之事必無一生常常倒行者若其倒逆頻仍則其後將諸症蜂起即生大變矣居經避年固有因於秉賦者然總緣體弱血少之故若其先本不愆期而忽致間月乃行亦是不足之病惟間隔之期殊無一定有偶間一二月者亦有常三五月者居經避年等稱亦是隨意定名無甚義理可據至於暗經之人能孕者少不育者多其為虛症尤可想見若妊後月月行經又不礙胎惟旺盛者偶有之然雖如期而來亦必不如平時之多方為有餘而溢之徵如其按月能行且亦如未孕之狀則終恐固攝無權半産可慮苦胎前血忽大下則墮者其常不墮者其偶且恐有暴崩之變瀕湖溉以為稟賦之奇並不為病殊難盡信即盂英所述各種雖不為病者固亦有之惟以理法推測皆屬反常縱令一時尚無病狀發見逮積之日久必有變幻亦可斷言頤常見一瘦弱女子及並而嫁不及三年孕育兩次即月事淨絶而居恆無病者十餘年其後僅病感冒不三日即至不起其年才逾三旬此可徵壯年泛斷之必非壽徵矣血崩血大至曰崩此是急病素問陰虛陽搏謂之崩許叔微曰經雲天暑地熱經水沸溢陰虛者尺脈虛浮陽搏者寸脈弦急是為陰血不足陽邪有餘故為失固內崩宜奇效四物湯或四物湯加黃連奇效四物湯當歸酒洗川芎白芍炒熟地黃阿膠艾葉黃芩炒各一錢箋疏素問此節俱以脈言陰脈獨虛則其人真陰不能自固而陽脈偏搏擊有力則陽氣陷入陰中陰為陽迫能無崩中妄下之變乎頤竊謂即以病情言之亦即此理惟陰氣既虛則無自主之權而孤陽乘之搏擊肆擾所以失其常軌而暴崩直注且肝氣善於疏泄陰虛者水不涵木肝陽不藏疏泄太過此崩中一證所以多是虛陽妄動也奇效四物湯即金匱之歸芎膠艾湯去甘草而加黃芩以地芍阿膠固護陰營而川穹以升舉下陷之清陽治此證乃為恰好惟固攝無權非大封大固而清理血分之熱亦無以制其陽焰則龍齒牡蠣早蓮女貞紫草地榆之屬必須相輔而行始有捷效附録近陳君室人年逾三旬庚申十月來校就診崩漏不絶已將兩月易醫屢矣脈細軟神疲色奪頤授參朮耆地歸芍龍牡地榆紫草艾炭川芎阿膠萸肉烏藥骨桑螵蛸二至川柏杜仲川斷香附香砂陳皮青皮烏藥等出入為方三劑知十餘劑而胃納加餐脈起色輕漸以即安叔微又曰女人因氣不先理然後血脈不順生崩帶等證香附是婦人仙藥醋炒為末久服為佳每服二錢清米飲調下徐朝奉內人褊藥不效服此獲安徐曰叔微埋氣二字專主怒氣鬱氣傷肝故用香附埋氣以和肝慎不可用破氣藥箋疏氣為血帥氣調則血不妄行凡血為病氣固無不先病者血之妄升妄降何一非氣病為之厲階況婦女所見者偏多郁多怒乎敘微雖止稱香附一味然陳皮青皮烏藥香砂之類皆當隨宜佐使必不可缺徐謂不可破氣誠是但香燥之藥重用之即是破耗輕用之所以吹噓是在臨證時斟酌分量不如畏如鴆毒又如玄胡一物血中氣藥能通滯氣而亦和平不燥實治此症理氣之良藥而世俗但知破瘀必不敢用實未嘗於臨證時細心體驗之耳薜立齊曰肝經風熱或怒動肝火俱宜加味逍遙散加味逍遙散當歸白芍柴胡甘草茯芩白朮丹皮黑山梔加簿荷姜棗煎箋疏肝經風熱而為血崩仍是肝家火擾內熱生風震動血絡疏紲太過是宜滋水清肝以潛息其風火若怒動肝火而為崩中尤宜柔潤以平其火加味逍遙之柴胡薄荷俱是疏泄夫豈所宜立齊之議終是顢頇節曰崩中是降之太過升舉似無不可究竟肝腎陰虛升提之法皆在禁例益氣逍遙斷非崩中者所可妄試立翁慣伎最不可訓李太素曰崩宜埋氣降火升提箋疏崩症多因氣火橫逆下擾衝任以致關闡不守漏泄無恆理氣洵是要圖其有火者誠宜清而固之然已是火擾於下又安有降火之可言惟氣火之所以動者原於肝腎陰虛不能涵陽況復脫血下虛益則亦不能再與升提搖其本根以速大禍昔賢論束垣升柴之法謂利於脾胃陽虛不宜於肝腎陰虛最是精切彼但為陰液暗耗者言已恐有拔動根株之變則崩漏之大失其血者又當何如雖是症之因於脾家清陽下陷者間亦有之然亦止可補脾氣而兼事固攝決無升舉之理是亦須於脈症參考於病情上求其源委必不能舉一病名而謂可有通治之大法即以本條六字言之降火升提兩層正是自相背謬而乃可以連類書之不亦怪哉金匱云寸口脈微而緩微者衙氣疏疏則其膚空緩者胃弱不實則谷消而水化谷入於胃脈道乃行水入於經其血乃成營盛則其膚必疏三焦絶經名曰血崩箋疏金匱雖亦仲景舊本燃今之所謂金匱要略者則宋人王冰於祕閣蠹簡中得之陳振孫書録解題言之鑿鑿豈獨脫爛殘缺調舛訛誤所不能免竊恐改竄點綴亦必不少是以此書之不可解者最多此條謂三焦絶經名曰血崩已不可知其命意何若叉謂衙疏則膚空營盛則膚疏云云似導以皮毛言之果與血崩一證何涉且既謂胃弱不實而又謂谷消水化此二句如何連貫得下究竟胃弱胃強真是莫名其妙堯封何以來此得母徒亂人意趙養葵曰氣為陽主升血為陰主降陽有餘則升者勝血出上竅陽不足則降者勝血出下竅氣虛者面色必白尺脈虛大箋疏湯升太過血出上竅其說是也若血出下竅是陰血之不守多有陽氣下入於陰中而疏泄無度者亦是陽之太過豈可概謂之陽不足即偶有陽虛不能攝血之症亦止有固攝真陰而不宜擾動陽焰此養葵陽不足一層之大不可訓者其意固指脾胃清陽下陷者言故曰氣虛者面色必白然補脾欲以統血亦非補陽之不足尺脈虛大養葵固自言之脈症如是豈非下元陰虛此必不可認定降者勝三字而妄行東垣補中益氣之法者然養葵意中隱隱有當用升清一層在後之學者切弗用此言外之意東垣曰下血證須用四君子補氣藥收功箋疏下血原是脾氣無權失其統血之職此指便血而言尚非專論崩漏然崩漏固亦有脾陰不守一症止曰四君補氣不說到升舉清陽一層以為便血崩血善後良圖最為允當又曰人傷飲食醫多妄下清氣下陷濁氣不降乃生腹脹所以胃脘之陽不能升舉其氣陷下致崩宜補中湯箋疏血既大下謂為清氣下陷固無不可然陰脫於下誤用升舉是猶樹木根抵巳空而復拔之無不立厥喘汗厥脫之變可以翹足而待東坦生平升舉脾胃清陽是其獨得之玄奧而未悟到不可移治肝腎一層此條所謂傷食妄下清氣下陷仍是為脾胃言崩中病因豈專在此未免狃於所長濫用板方之弊補中升陽諸法均以升柴為運用之靈機藥病相當效固立見而相反者害亦隨之夫以明之手定之方尚猶未知其蔽又何怪立齊養葵輩活侖吞吐誤盡天下後世哉丹溪曰有涎郁胸中清氣不升故經脈壅遏而降下非開涎不足以行氣非氣升則血不能歸隧道其證或腹滿如孕或臍腹㽲痛或血結成片或血出則怏止則悶或臍上動治宜開結痰行滯氣消汙血沈曰沖為血海並陽明之經而行故東垣丹溪皆主胃脘之陽不升顧其病源各異率曰妄下朱曰痰鬱有腹滿如孕血出反怏止反悶等症可認妄下則無有也非問不得箋疏痰涎積於經隧則絡中之血行必滯鬱結成壅理有固然積而愈積非下脫何以自尋去路故有腹滿㽲痛結成片塊之症所謂宜開痰行氣消瘀是治瘀血成崩之不二法門然所謂涎郁胸中則清氣不升經脈壅遏降下云云殊非此病真相痰血互結不可附會到清氣下陷一層且自謂宜開結痰竹滯氣消汙血此三者皆導淤攻破之法更與清氣不升無涉此節語氣明明兩面不相照顧決非丹溪之言考丹溪論東垣升陽之法嘗謂西北之人陽氣易於降東南之人陰火易於升見戴九靈丹溪翁傳故立知柏降火以救東垣之偏此條以瘀血立論既曰開痰行滯何致雜以升氣二字反與自己立法矛盾此蓋後有淺者為之附益讀丹溪書者不可為其所愚堯封墮其術中遂有衝脈並陽明而行之附會甚至說到胃脘之陽不升須知瘀血在下胃脘在上既欲破瘀明是下行為順尚何得以升舉清陽一層叢雜並論堯封亦未之思耳戴元禮曰血大至曰崩或清或濁或純下紫血勢不可止有崩甚腹痛人多疑惡血未盡又見血色紫黑愈信為惡血不敢止截凡血之為患欲出未出之際停在腹中即成紫血以紫血為不可留又安知紫血之不為虛寒乎瘀而腹痛血行則痛止崩而腹痛血止則痛止芎歸湯加姜附止其血而痛自止箋疏大崩而後腹痛血既脫而氣愈亂固不比乍崩腹痛血色紫瘀成塊成片者當用行滯消瘀之法至於離經之血一時未即下脫即成紫色其說甚是亦不可執定紫為淤血必投攻破蓋所失既多斷無不以固攝為急之理若復見痛即破見紫即攻虛材益虛落阱下石為禍益烈但紫血之虛寒症竟不多芎歸加姜附決非必能止崩之法是當以脈症參之不可執一而論惟脫血既多者必以補脾養胃峻滋肝腎真陰而合封固攝納為治庶可無投不利腹痛者固當運氣和肝如香附烏藥川棟玄胡之屬必不可少即無痛者參朮耆阿膠杞地等氣血雙補方中亦必加香砂青陳一二昧以吹噓而運化之始能活潑靈通補而不滯否則失之呆笨非徒無效且有中滿礙化之弊矣薛立齊曰有婦患崩過服寒藥脾胃久虛中病未已寒病復起煩渴引飲粒米不進昏憤時作脈洪大接之微弱此無根之火內虛寒而外假熱也十全大補加附子崩減日服八味丸而愈又有久崩服四物湯涼血劑或作或止有主降火加腹痛手足厥冷此脾胃虛寒所致先用附子理中湯次用濟生歸脾補中益氣二湯崩頓止若泥痛無補注誤矣沈曰崩證熱多寒少若血大至色赤者是熱非寒若色紫黑者出絡而凝其中有陽虛一症經雲陽氣者衛外而為固也營行脈中衛行脈外脈外之陽虛失於術護則脈中之螢血漏泄既出絡脈凝而不流漸漸變紫變黑然必須少腹惡寒方可投溫箋疏崩中一症因火者多因寒者少然則使屬熱亦是虛火非實熱可比縱當清熱止有地榆紫草柏葉柏皮梔子丹皮之類擇用一二宜於芩連者已不多見本無純用寒涼之理況失血之後陽氣亦餒更無頻服寒涼之法薜案十全八昧一症明言過服寒涼則溫補所以治藥誤非其本病之果宜於溫但虛熱煩渴不當引飲薛曰引飲恐是筆下之失檢處其第二條先服四物涼血或已過當再主降火以致腹痛支厥亦是為藥所誤此頤所以謂縱使有火已是陽陷入陰安得有降之一字可言者也沈論陽虛一症謂必少腹惡寒方可投溫固是認證耍訣然須知其餘見證發竟可參脈狀舌苔亦必有據惟血去既多氣隨血耗真陽往往無權多有宜於溫煦者溫煦之藥乃溫和之溫非辛燥大熱一類昔人謂暴崩宜清可知久崩者不可恣用涼藥否則執呆方以治活病正以招立齊之譏矣崩證極驗方地榆生牡蠣各一錢生地四錢生白芍三錢黃芩丹皮各一錢半川連五分甘草八分炒蓮鬚黑梔各一錢水煎服沈曰一婦日服人參阿膠血不止投此即效因帶多偶以苦參易芩血復至用芩即止去連血又至加連即止頤按苦參太嫌苦寒芩連必因症而投不可拘泥又曰一婦患崩月餘余診時大崩髮量幾脫是方加人參一錢服之即安十劑而愈頤按大崩發暈本非人參不可又曰一婦患此年逾五旬投入參阿膠不效一日加黃連五分甚不相安醫工是氣病用炒香附婦芍丹皮黃芩牡蠣棗仁黑荊芥各二錢鬱金一錢五分橘皮一錢上沈香磨沖三分柴胡五分棕櫚皮八分煎服一劑崩止除柴胡荊芥棕皮數劑食進復加白朮為散服之作脹減去即安頤案用藥必隨症加減乃能活潑靈動觀是案加連不安可見前方本非呆板必驗之藥人參阿膠皆有應有不應視佐使之相稱否耳白朮亦非必脹者惟阿膠非胃納尚佳不宜早用又曰一崩證少腹惡寒用桂附八味丸收全效箋疏右方清而不補微加固檣斂陰為陰分有火者立法未嘗不輕清靈活然惟氣體尚強陰火偏熾之症為宜若血去已多恐嫌太寒且固護亦嫌不及頤治此症必以介類潛陽收攝橫逆龍相之火如龍牡決明玳瑁之屬俗子每謂一味兜澀蠻封蠻鎖甚且望而生畏不知血之所以妄行全是雷龍相火疏泄無度惟介類有情能納肝腎泛濫之陽安其窟宅正本清源不治血而血自止非強為填塞之法視蓮鬚苦澀者不同故收效捷而無流弊且沈重質豎納入煎劑氣味俱薄非重用不能有功而無識者見用一雨人錢分量又復舌嬌不下傳為談柄耳食者不辨真理一至於此真是令人絶倒頤終謂是方牡蠣僅止二錢難生效力孟英曰經漏崩淋並由精竅出惟溺血從溺竅而下婦女雖自知然赧於細述醫者不知分辨往往誤治更有因病汛愆而衝脈之血改從大腸而下者人亦但知為便血也監證均須細審箋疏由精竅出者時時自下其人不能為主從溺竅出者小溲可以自主故溺血一症必隨小溲而見不小溲則無有也醫者能以此辨症則閨中人雖不能自述亦可一問其溲便而知之王又謂汛愆改從大腸而下其治案中確有此一則然幹人之一不可恆有之症也帶下與男子遺濁同治素問任脈為病男子內結七疝女子帶下瘕聚箋疏一任脈以擔任身前得名仕脈病則失擔任之職斯氣結者成疝血結者成瘕或不能固撮則帶下作矣此症有濕熱膠結清濁混淆而淫溢者有相火亢甚疏泄太過而滲漏者其肝腎陰虛不自固攝之症止是帶下之一而任脈為病一句實兼此三者而包涵其中故一見帶下即指為衝任不固帶脈無權之虛症而輒投補澀者絶少見效堯封謂與男子遺濁同治誠然治遺濁者固不可僅以兜檣為能事也又曰脾傳之腎名曰疝瘕小腸冤結而痛出白名曰蠱箋疏一此脾濕下流由腎而傳之膀胱者蓋即輸尿管之清濁不分故小腹為之冤結作痛而白液自下是即男濁女帶之因於濕熱膠結者也冤讀菀實即鬱塞之郁又曰少腹冤熱溲出白液箋疏此亦男子之白濁與女子之白帶少腹鬱熱是即相火亢甚之所致也又曰思想無窮所願不得意淫於外入房太甚發為白淫箋疏所思不遂龍相之火因而外越是即亢火疏泄太過之帶下入房太甚則衝任不守是為虛脫之帶下合觀素問數即則男子遺濁女子帶下之病因總不外濕火相火及陰虛不守三途而已沈堯對曰帶下有主風冷入於脖絡者巢元方孫思邈嚴用和楊仁齊樓全善諸人是也有主濕熟者劉河間張潔古張戴人羅周彥諸人是也有主脾虛氣虛趙養葵薛立齊諸人是也有主濕痰者朱丹溪是也有主脾腎虛者張景嶽薛新甫是也又有主木鬱地中方細之繆仲淳是也其所下之物嚴主血不化赤而成張主血積日久而成劉主熱極則津液溢出其治法有用大辛熱者有用大苦寒者有用大攻伐者有用大填補者雖立論制方各有意義然其所下之物究竟不知為何物惟丹溪云云婦人帶下與男子蘿遺同顯然指著女精言千古疑竇一言道破但精滑一證所因不同惜其所指之方囿於痰火二字中耳由是言之白帶即同白濁赤帶即同赤濁此皆滑膩如精者至若狀如米坩或臭水不黏者此乃脾家之物氣虛下陷使然高年亦有患此非精氣之病不可混治箋疏古病多屬虛寒故巢氏病源孫氏千金皆以辛熱治帶下此今時所絶無僅有之候可以存而弗論若濕熱則今病最多而亦最易治艾所了者必穢濁腥臭甚者且皮膚濕癢淫溢欲腐若夫脾虛氣虛之證固亦有之節東垣之所謂清陽下陷果屬氣陷溫煦脾土而少少升清亦尚易治但立齊養葵所言則几几萬病盡然斷不足據丹溪以濕痰立論實即濕熱之病不足為異景嶽以脾腎兩虛為言則帶出精竅言腎較為切近視專論脾胃清氣不升者頗覺言之有物新甫即立齊而堯封幾認作二人未免失檢若繆仲淳以為木鬱地中實即相火鬱窒橫行而疏池太過耳古人治法惟戴人大攻斷不可法此外則大溫大寒大補各有封藥之症因症立方具有至理不可偏廢丹溪謂帶下同於夢遺頤愚謂遺之與濁雖同是精竅為病但遺則一泄而即止濁則自下而無時其證不同帶下是時時頻下非遺症之發作有時者可比當以濁症論不當以夢遺為擬雖用藥無甚分別但病狀確是不同不可混合為一丹溪專以痰火主治亦以是症之屬於濕熱者最多耳若大腥穢不黏之帶下則是溺竅為病由腎之輸尿管來不比於輸精之管脾胃濕濁下流腎中輸溺管不能泌別清濁所致高年童稚皆有此症在濕盛熱甚之人當以實火論未必皆氣虛之下陷是當淡滲以通理水道堯封固亦知其非精氣病也沈堯封曰戴元禮論赤濁雲精者血之所化有濁去太多精化不及赤未變白故成赤濁此虛之甚也何以知之有人天癸未至強力好色所泄半精半血若溺不赤無他熱症縱見赤濁不可以赤為熱只宜以治白濁法治之觀此則以赤帶為熟者謬矣箋疏赤濁赤帶本因相火太亢熱毒擾其血分使然其人小溲必少熱如沸湯一問可知此非大劑清火泄導何能有效戴氏所論確有是症然止其一端非凡是赤濁皆如此也無論何症各有真源本木不可僅擾症狀以斷寒熱虛實發竟各有其他之脈症可擾不可一概論也孟英曰帶下女子生而即有津津常潤本非病也故扁鵲自稱帶下醫即今所謂女科是矣金匱亦以三十六病隸之帶下但過多即為病濕熱下注者為實精液不守者為虛苟體強氣旺之人雖多亦不為害惟乾燥則病甚蓋營津枯涸即是虛勞凡汛愆而帶盛者內熱逼血而不及化赤也並帶而枯燥全無者則為乾血勞之候矣窠而觀之精也液也痰也濕也血也皆可由任脈下行而為帶然有虛寒有虛熱有實熱三者之分治遺精亦然而虛寒較少故天士治帶必以黃薜為佐也箋疏盂英謂女子生而帶下不足為病即其所謂津津常潤者本屬無多亦不機惡俗有十女九帶之諺誠不必藥且閨中隱曲原不告人亦未有以此求治者如其太多或五色稠雜或五臭間作斯為病候虛寒虛熱實熱三層已足包涵一切濁帶詣症果能明辨及此治法巳無餘蘊至謂枯燥全無者即是虛勞之候此即褚氏遺書之所謂枯則殺人者苟非真陰之告匱皆其斷囊太過合多而津干液耗者也盂英體驗及此確是古人未道之語妙香散治脈小食少或大便不實者能骨益智仁人參各一兩白茯芩遠志去心茯神去木各五錢硃砂二錢五分炙甘草錢半為末每服酌用數錢箋疏此王荊公方為虛證之遺濁帶下設法於固澀之中仍以利水化痰輔之補而不滯頗為靈動地黃飲子去桂附腎陰不足肝陽內風鼓動而滑精其脈弦大者宜之葉雲天地溫和風濤自息又云坎中陽微下焦失納又云肝為剛藏不宜剛藥只宜溫柔養之水制熟地八錢川石斛麥冬茯芩各一錢五分石菖蒲遠志肉巴戟肉乾淡蓯蓉各一錢五味于山萸肉沈曰末二味酸藥可去箋疏河間地黃飲子治猝然音喑支廢不用是為腎藏氣衰陰陽兩脫於下而濁陰泛溢於上氣血沖激擾亂神經者立法其證必四逆支清或冷汗白出其脈必沈微欲絶其舌必滑潤淡白故以麥冬熟地峻補真陰桂附戟蓉溫養元氣五味萸肉酸以收之所以招納渙散返其故宅理法極密本不可以治肝陽上衝之腦神經病今去桂附借用以治陰虛陽擾之道濁崩帶填攝真陰本欲以靜制動以陰固陽則方中昌遠開泄尚非所宜而巴戟蓯蓉更嫌其溫煦之性反以助陽尚宜斟酌損益而堯封反謂萸肉五味酸收可去似失之制方之意蓋本為虛而不固者立法正是利用其酸收既無濕熱實邪尚復何嫌何忌又引葉氏說天地溫和風濤自息則為陰霾肆逆之病而言可論地黃飲之全方既去桂附而治肝風鼓動葉說已全不相涉而坎中陽微下焦失納二句更是盲人捫燭無此情埋須知坎中陽微而不能固者有之何所謂納若曰肝為剛藏不宜投剛燥之藥則滋養肝陰惟以甘潤為主亦宜柔而不宜溫要之腎家陰虛相火鼓動而為遺濁崩帶之病本是最多脈弦且大龍雷方張是方與繆氏廣筆記之集靈膏柳洲續名醫類案之一貫煎皆滋養真陰攝納浮陽之上乘禪也補腎陰清肝陽方王宇泰曰腎為陰主藏精肝為陽主疏泄故腎之陰虛則精不藏肝之臘強則氣不固沈堯封曰此方以清芬之品清肝不以苦寒之藥傷氣藕節青松葉側柏葉各一斤生地玉竹天冬各八兩女貞子旱蓮草各四兩熬膏服箋疏此治肝腎相火亢而疏泄無度之遺濁崩帶火之偏旺實由於陰之不涵故清火不在苦寒而在甘潤又選用清香芬芳之品以疏絡中鬱熱之氣尤為心靈智巧八味丸戴元禮曰有赤白濁人服玄兔丹不效服附子八味丸節愈者不可不知沈堯封曰此即坎中陽微下焦失納之意屢用有效王孟英曰陰虛而兼濕火者宜六味丸甚者加黃蘖尤妙箋疏濁帶之因於下元陽虛不能固攝者其症甚少如不見有確切之脈症不可輕率引用是方仍以養陰為主稍加桂附燠下元而仍頓丹澤秩芩通泄水道本非專為補陽之藥用於是症方與崔氏腎氣丸之主旨符合與立齊養葵竟認作溫補元陽主劑者識見不同胡可以道里計孟英謂陰虛而兼有濕火宜六味加黃柏惟其有濕火在下六味全方始為合轍則彼之竟謂六味補水者其謬何如松硫丸此是方外之方治赤白濁赤白帶日久不愈無熱證者其效如神松香硫黃鐵銚溶化將醋頻頻灑上俟藥如飴稱銚置冷處用冷水濡手丸如豆大必須入衆方可否則凝硬難丸每服一錢孟英曰此方究宜慎用箋疏此必下焦無火而虛不能固之濁帶方是對症然此症極少如其有之則硫能溫養腎火而性滑利非蠻鈍封鎖之比所以神效固精丸選注云陽虛則無氣以制其精故寐則陽陷而精道不禁隨觸隨泄不必蘿而遺也必須提陽固氣乃克有濟鹿茸一具鹿角霜分兩同茸韭子淡干蓯蓉各一兩五味子茯苓熟附子巴截肉龍骨赤石脂各五錢酒糊丸箋疏此方專為腎家無陽關閘不守者立選謂寐則陽陷正以陰分本弱寐則氣靜而陽陷入陰故以茸角通督脈之陽而舉其陷制方確有精義然須知陽陷之陽與相火不藏之陽大有區別不可混治溫柔檣法葉氏治白淫白龍骨桑螵蛸湖蓮芡實茯芩茯神金櫻子覆盆子遠志肉蜜丸箋疏此方一派收滴必純屬虛不能固者可用然未免呆笨難收實效且蓮子芡實終是食物混入藥劑用非所用殊覺無謂自天士老人筆頭弄巧以開其端而吳子音為撰三家醫案隨其流而揚其波於是海參淡菜魚膠之屬悉入煎方頤戲謂之廚子開單惜乎不調酸鹹而雜入草木隊中物苟有知亦當叫屈赤水玄珠端本丸治脈大體肥大便晨泄不爽濕熱遺精極驗葉云濕熱之病面色赤亮可證苦參川檗各二兩特蠣蛤粉葛根青蒿白螺獅殼煆各一兩神粬和丸箋疏苦能勝濕兼以固澀而葛根能升胃氣以治濕熱遺濁亦能分清泄水選藥自有巧思但白螺蜥殼有處極多而無處難見究屬非主任之藥不如特蠣取淨粉用之攝納固下而亦清利濕熱頗有實效本事方清心丸戴元禮曰有經絡熱而滑精者此方最妙大智禪師云腰脊熟而遺者皆熟遺也黃檗冰片鹽湯為丸徐曰亦有陰虧之極致腿足腰脊肝腎部位作熱而遺者又宜填陰固澀以斂虛陽非可妄投清火宜詳辨脈證箋疏冰片大寒非熱症不可用且分兩不可過多許白沙方為相火不藏者立法是實證徐氏則言虛甚而火反外浮者病情天淵然脈症必有不同盂英所謂凡勘一症有正面必有反面治醫者胡可以心粗氣浮導赤散李瀕湖曰一壯年男子夢遺白濁少腹有氣上衝每日腰熱卯作酉涼腰熟則手足冷前陰無氣腰熱退則前陰氣動手足溫又旦多下氣暮多噫氣時振逾旬必遺脈弦滑而大偶投澀藥則一夜二遺遂用此方大劑煎服遺濁皆止生地木通甘草梢箋疏東璧所述正在壯年明是相火太亢鬱極而泄少腹氣衝是腎火之上奔正與傷寒論之奔豚症為腎中寒水上溢者一水一火兩相對時而其屬於腎氣上奔則一又是盂英之所謂同症而一正一反者腰熱卯作酉涼又是實熱見症故盛於日中陽氣正旺之時其手足冷者熱聚於裡而四末反寒亦即熟深厥深之義而前陰氣定則其熱別有所注也腰熱退而手足溫前陰氣動亦是此往彼來但氣運作用未易說明其實在理由耳且腰是腎之部此部獨熱非賢熱而何脈弦滑大情狀昭著澀之則鬱反盛腎肝愈鬱則疏泄之力愈甚所以一夜二遺木通苦泄宣通以洽火亢鬱熱恰合分寸大劑灌沃尤為力專任重是方是症大有心思此條見症頗與上條所主之病相近然上方較呆此方靈活在木通一味以通為用故也王盂英曰任脈虛而帶下不攝者往往滋補雖投而不能愈余以海螵蛸一味為粉廣魚鰾煮爛杵丸緑豆大淡菜湯下久服無不收效真妙法也箋疏虛不能固滋填收澀最無近功良以奇經滑泄草木無情故未易奏全績盂英此法血肉有情竹破竹補別有會心雖奇而不離於正妙在丸以緩治方能漸入下焦視葉派竟以海味作湯藥之腥膩難咽者自有涇渭之別頤嘗以海金砂真者合川檗末兩味用鮮生豬脊髓打和丸治陰虛有火之濁帶多效亦引清理之藥直入督任者也小求子素問女量二七而天癸至任脈通太衝脈盛月事以時下故有子七七而任脈虛大沖脈衰少天癸竭地道不通故形壞而無子沈堯封曰求子全賴氣血充足虛衰即無子故薛立齊曰至要處在審男女尺脈若右尺脈細或空大無力用八味丸左尺洪大按之無力用六味丸兩尺俱微或浮大用十補丸此遵內經而察脈用方可謂善矣然此特言其本體虛而不受胎者也若本體不虛而不受胎者必有他病繆仲淳主風冷乘襲子宮朱丹溪主衝任伏熱張子和主胞中實痰丹溪於肥盛婦人主脂膜塞胞陳良甫謂二三十年全不産育者胞中必有積血主湯胞湯諸賢所論不同要皆理之所有宜察脈辨症施治湯胞湯在千金為婦人求子第一方孫真人鄭重之箋疏生育之機純由天賦本非人力之所能勝天更何論乎藥物惟能遂其天機而不以人欲亂性斷無不能生育之理世之艱於孕育者大率皆斫喪過度自損其天真者欲求孕育惟有節欲二字善乎袁簡齊之引某理學家答其門人問求子者謂汝能學鳥獸則有子矣乍聆此論豈不可駭須知鳥獸之合純是天機不妄作為用時而動所以無有不生而亦無有不長者簡齊更為之申一說曰行乎其所不得不行止乎其所不得不止節生乎其所不得不生是豈草木根荄所能代天宣化者素上古天真論謂任脈通太衝脈盛則有子任脈虛太衝脈衰少則無子雖為女子言之亦豈僅為女子言之衝脈任脈陽施陰受胥由此道堯封氣血充足四字固巳包舉一切則反是以思行乎其所不當行天癸那不早竭地道不通形壞無子又豈必俟乎七七八八之齡耶立齊審察尺脈一言其埋不可謂不切而八味六味十全三方豈是確當之藥若沈所謂本體不虛而不受胎則不虛即實子宮必有所蔽故不能感諸賢持論未當不極其理想之能事然生理之真亦未必果與諸家所論盡能符合所以如法用藥縱使脈症近似亦必不能一索而得而千金方之主破瘀張戴人之主湯滌尤恐不顧其後利未可得而弊即隨之學者必不可孟浪從事湯胞湯朴硝丹皮當歸大黃桃仁生用各三銖厚朴桔梗人參茯芩桂心甘草牛膝橘皮各二銖附子六銖蟲蟲水蛭各十枚右十七味哎咀以清酒五升煮取三升分四服日三夜一每服相去三時更服如前覆被取微汗天寒汗不出著火籠之必下膿血務須斟酌下盡二三服即止如大悶不堪可食酢飯冷漿一口即止然恐去惡不盡忍之尤妙盂英曰子不可以強求也求子之心愈切而得之愈難天地無心而成化乃不期然而然之事非可以智力為者惟有病而礙於孕宥之人始可用藥以治病凡無病之人切勿妄藥以求子弄巧反拙豈徒無益而已耶縱使有效而藥性皆偏其子稟之非天札即頑悖余歷驗不爽箋疏孕育之事無所為而為豈有人力可以矯揉造作之理所謂夫婦之愚可以能知能行而聖人有所不知不能者如謂金石草木可以強無為有是直以人欲勝天理使造物退處於無權吾知雖有高賢斷不敢作此無端之夢想而俗子偏能為此說者止以逢迎富貴為衣食計當亦智者所共諒不意孫氏高明千金方以婦人居首而求嗣又為婦科之開宗明義第一章一若藥石無情果有挽回造化之能力蓋亦未脫方士習氣孟英謂非可以智力為頂門一針吾知求方者與方者聞此不啻冷水澆背默爾而息快人快事揭盡俗子醜熊那不曲踴三百又謂有病而礙於孕育者始可用藥以治病須知所以不得不用藥者止是為冶病計實非作藍田種玉想然後知千金方求嗣一門絶非醫家分內之事頤恆見艱於子嗣者不悟其喪失之多日以求方求藥為當務之急而醫家工於獻媚藥為處方抵掌高談莫不自謂果有奇術令人一索可得究竟羅列溫補興陽數十味欲以搜括老人垂竭之脂膏妄冀背城借一縱令如願以償而先天既薄又以燥烈之藥石助之生兒必多胎毒奇病百出長育極難頤已屢見之而苦不敢為乃翁說明原始以重傷垂暮之心孟英更說到頑悖一層正是陽藥剛烈之餘焰有以成其稟賦此理之常無足怪者彼癡心夢想之流讀此當亦可以廢然返矣孟英又曰湯胞湯雖存深意其藥太峻未可輕用惟保胎神佑丸善舒氣鬱緩消積血不但為保胎之良藥亦調經易孕之仙丹每日七丸頻服甚效余歷用有驗最為穩妙方見下卷箋疏湯胞湯以湯滌胞中惡淤取義其意蓋謂婦人無不生育之理其所以不孕者由淤毒積於胞中故耳頤謂此是理想已不足據而許多湯滌走竄之物足以擾亂之而有餘果用是方必犯盂英所謂豈徒無益之弊雖是古方斷不可信惟盂英所稱之保胎神佑丸亦極平常且每服止桐子大之七丸何能有效乃孟英頗推重之謂有殊功極不可解豈聊以徇求方種子者之意姑以和平淡泊萬全無弊者應之耶此亦仁人之用心惟恐俗子謬服毒藥反以為禍耳若曰果為調經之仙丹願敢斷其必無是事惟謂其善舒氣鬱應幾近之孟英又曰世有愚夫愚婦一無所知而敏於生育者此方靈皋所謂此事但宜有人欲而不可有天埋也觀於此則一切求子之法皆不足憑況體氣不齊豈容概論有終身不受孕者有畢世僅一産者有一産之後逾十餘年而再妊者有按年而妊者有娩甫彌月而即妊者有每妊必駢胎者且有一産三胎或四胎者駢胎之胞有合有分其産也有接踵而下者有逾日而下者甚有逾一旬半月而下者諺云十個孩兒十樣生是以古人有寧醫十男子莫醫一婦人之說因婦人有胎産之千態萬狀不可以常理測也世之習婦科者不可不究心焉箋疏孕育純是天然即胎前狀態亦復萬有不齊莫名其妙脈不足憑證不可據閲歷愈多而所見愈奇盂英謂於態萬狀不可以常理測真是從見聞廣博得來非淺學者所能道隻字孟英又曰古人五種不男曰螺紋鼓角脈而人多誤解余謂螺乃騾字之僞騾形之人交骨如環不能開坼如受孕必以産厄亡紋則陰竅屈曲如螺紋之盤旋礙於交合俗謂之石女是也後人不知騾形之異而改為螺遂以紋之似螺者有混於豉豉者陰戶有皮鞔如豉僅有小竅通溺而巳設幼時以鉛作鋌逐日紅之久則自關尚可以人力為也角則陰中有物興至亦有能舉者名曰二陰人俗云雌雄人是也脈則終身不行經者理難孕育然暗經亦可受胎錢國賓云蘭溪孫篾匠之妻自來無經而生四子一女故五種之中惟三者非人力所能治而紋角二種並不可交也特考定之以正相傳之僞騾形之女初生時穩婆技精者捫之即知其可男可女之身名人亦角顛也疏繞此所謂不男者言婦女不能與男子相接者也王謂螺當騾是騾不生育惟以交骨不能關圻之故婦人稟此則受孕而必不能産頤所知者有一人嘗兩次受孕其先則由接生婆用鋒刃將小兒孿割而下其後又妊身彌月則到滬上醫院中經西醫剖腹取兒僅保殘喘然後知天地之大果有此傀異之事至所謂角者並有時而可男正史五行志中吒為人妖實亦稟賦之自然但不恆有故世以為怪耳受胎總論李東璧曰易云男女構稻構精萬物化生幹道成男坤道成女褚洽澄言血先至里精則生男精先至里血則生女陰陽均至非男非女之身精血散分駢胎品胎之兆道藏言月水亡後一三五日成男二四六日成女東垣言血海始淨一二日成男三四五日成女聖濟言因氣而左動陽資之則成男因氣而右動陰資之則成女丹溪乃罪褚氏而是東垣主聖濟左右之說立論歸於子宮左右之系可謂悉矣竊謂褚氏未可非東垣亦未盡是也蓋褚氏以氣血之先後言道藏以日數之奇偶言東垣以女血之盈虧言聖濟丹溪以子宮之左右言各執一見會而通之理自得矣蓋獨男獨女可以日數論駢胎品胎亦可以日數論乎史載一産三子四子有半男牛女或男多女少或男少女多則一三五日為男二四六日為女之說豈其然哉褚氏聖濟丹溪主精血子宮左右之論為有見而道苦惱垣日數之論為可疑矣叔和脈經以脈之左右浮沈辨所生之男女高陽脈訣以脈之縱橫逆順別駢品之胎形恐臆度之見而非確論也王盂英曰閲微草堂筆記云夫胎者兩精相搏翕合而成者也媾合之際其情既洽其精乃至陽精至而陰精不至陰精至而陽精不至皆不能成皆至矣時有先後則先至者氣散不攝亦不能成不先不後而精並至陽先沖而陰包之則成男陰先沖而陽包之則成女此化生自然之妙非人力所能為故有一合即成者有千百合而終不成者愚夫婦所知能聖人有所不知能此之謂矣端恪後人沈君辛甫云胎脈辨別處誠醫者所當知若受妊之始曷以得男何緣得女生化之際初無一定諸家議論雖奇無關損益置之可也箋疏孕育之理天然生化既非人力所能作為又豈理想可以推測瀕湖所引諸說無非憑空結撰雖竭盡理想之能事終是捫燭扣般殊可不論紀文達天資聰穎理想尤精閲微草堂筆記一節托之神怪本是小說家體裁所論較之從前諸家確是高出一層究竟亦是筆上生花粲蓮妙舌何可認作實事沈辛甫一律置之不問真是快刀斬亂絲之無上妙法辨胎素問婦人足少陰脈動甚者妊子也沈堯封曰足少陰腎脈也動者如豆厥厥動搖也王太僕作手少陰手少陰脈應在掌後鋭骨之後陷者中直對小指非太淵脈也必有所據全元起作足少陰候尺中經云尺裡以候腹中胎在腹中當應在尺此為近理箋疏氣血結滯脈象應之而不條達故其形如豆如珠一粒突起指下厥厥動搖因謂之動所以大痛之病於脈為動以痛則氣血交結脈亦總而不舒也妊娠之初胎元乍結正是陰陽凝合之時其應在脈於是亦呈凝聚之態素問脈動主妊一條其理極精而注家似未有能申明其真義者但必在結胎數曰之間乃有此象若曰久則胎孕已有明徵生機洋溢何致更有結塞之態形之脈上此所以脈滑亦主妊身即是生氣盎然之朕兆故滑脈必於一月後始可見之蓋動之興滑一為蘊蓄不行一為活潑爽利形勢態度適得其反而以論妊子固是各有至理必不可誣惟足少陰當從全元起本為是胎結下元自宜應之於尺啓玄本誤足為手必不可通又曰陰搏陽別謂之有子沈曰王注陰尺中也搏謂搏觸於手也尺脈搏擊與寸迥別則有孕之兆也箋疏搏是應指迫迫有力而形勢分明與動甚妊子之意相臺但是於陰分之尺部與陽分寸部顯然有別正其陰陽團結之初富有是象啓玄注此亦知以尺中立論則動甚妊子一節作手少陰者豈非訛誤叉曰何以知懷子之且生也曰身有病而無邪脈也箋疏一身有病者謂婦人不月豈非病狀且多有食減嘔啞之證亦是病徵但以脈察之則調而有序不見其病是為懷子無疑凡惡阻之甚者食減神疲病狀昭著然而必無恙臨證以來確乎可據始知經說之精難經曰女子以腎系胞三部脈浮沈正等按之不絶者有妊也箋疏三部脈浮沈正等按之不絶是節活潑流利之滑脈故知有妊沈堯封曰婦人三部脈浮沉正等以手按之不絶者孕子也妊脈初時寸微呼吸五至三月而尺數也脈滑疾重以手按之散者胎已三月也脈重手按之不散但疾不滑者五月也此即陰搏陽別之義言尺脈滑數寸脈微小尺與寸脈別者孕子也箋疏三月尺數三月滑疾而散云云不確辨男女胎王叔和曰妊娠四月其脈左疾為男右疾為女俱疾為生二子箋疏疾即滑利之意左脈滑應男胎右脈滑主女胎自有確徵又曰左尺偏大為男右尺偏大為女左右俱大産二子大者如實狀即陰搏之意尺脈實大興寸迥別但分男在女右也又曰左脈沈實為男右脈浮大為女箋疏沈實亦即陰搏之義亦當於尺徵之右脈浮大為女則不知其意何在然理不可通不足信也婁全善曰按丹溪云男受胎在左子宮女受胎在右子宮推之於脈其義亦然如胎在左則氣血護胎必盛於左故脈左疾為男左大為男也胎在右則氣血護胎必盛於右故脈右疾為女右大為女也亦猶經文陰搏陽別謂之有子言胎必在身半之下氣血護胎必盛於下故陰尺豉搏與陽寸迥別也箋疏天地之氣左升而右降升屬陽而降屬陰故左為陽而右為陰且南面而立左在東而右在西東主升而右主故東為陽而右為陰男女胎之分主於左右脈即是陰陽升降之氣為之確有徵驗而亦自有至理丹溪以左右子宮受胎為分別卻非生理之實讀西學家言子管子核確有左右兩處而子宮則有一無二此是實在形骸不可信筆寫來惟吾所欲者也卷末附英醫合信氏全體新論可徵千金云令妊婦面南行從背後呼之左回首者是男右回首者是女又女腹如箕以女胎背母足膝抵腹下大上小故如箕男腹如釜男胎向母背脊抵腹其形正圓故如釜也沈堯封曰內經妊娠數條惟陰搏陽別尤為妙諦素問診法上以候上下以候下氣血聚於上則寸脈盛氣血聚於下則尺脈盛其勢然也試之瘡瘍無不驗者況胎在腹中氣血大聚豈反無徵驗之理胎繫於腎在身半以下故見於尺部但人脈體不同有本大者有本小者節懷妊時有見動脈者然尺中或疾或數總奧寸脈迥然有別細審自得節左右男女亦然受胎時偏左成男氣血聚於左則左重故呼之則左顧便脈必形於左尺受胎時偏右成女氣血聚於右則右重呼之則右顧便脈必形於右尺此一定之理也至若丹溪受胎於左於宮女受胎於右子宮此是語病猶言偏於子宮之左偏於子宜之右耳原非有二子宮也惟左男右女指醫人之左右手言恐未必然箋疏左顧右顧之說殊屬不確堯封偏左偏右亦是空話子宮惟一教他偏到何處去此非禮記月令之九宮可以左個右個擇居其一者也王孟英曰諸家之論皆有至理而皆有驗有不驗余自髻年即專究於此三十年來見聞多矣有甫受孕而脈即顯呈於指下者有半月一月月後而見於脈者有二三月而見於脈者有始見孕脈而五六月之後反不見孕脈者有始終不見於脈者有受孕後反見弦澀細數之象者甚有兩脈反沈伏難尋者古人所論原是各杼心得奈死法不可以限生人紙上談兵未嘗閲歷者何足以語此惟今春與楊素園大令談之極蒙折服殆深嘗此中甘苦也憶辛丑秋診周光遠令正之脈右寸關忽見弦大滑疾上溢魚際之象平昔之脈未嘗見此頗為駥然及詢起居諸無所苦惟汛愆半月耳餘曰妊也並可必其為男繼而其父孫際初聞之診乃女脈曰妊則或然恐為女孕余曰肺象乎天今右寸脈最弦滑且見上溢之象豈非本乎天者親上耶孫曰此雖君之創解然極有理究不知後隘何似耳逮壬寅夏果舉一男聊附一端以為鑿鑿談脈者鑑箋疏孟英有驗有不驗之說以闊歷得之最宜真諦古人所論或憑理想或偶然符合而自以為確究竟稟賦木齊各如其面豈可執板法以談天然之生化故孕脈最難憑頤亦留心二十餘年而始敢為此說若門外人聞之必嗤為脈理之不精矣知凡百學問必親自體驗潛心默察而後能於板法中參活法彼篤信好古常在故紙堆中求生活者何足以語此然亦止可為知者道不足為俗人言也王論周氏夫人一證弦滑上溢而斷為妊且斷為必男必無真切理由可說本乎天者親上一句空空洞洞何可為訓然竟協徵蘭之兆此正頤之所謂們燃符合而自以為確者請教後人更從何處學步然即此更可徵孕脈之變幻無窮萬不能刻舟求劍按圖索驥矣妊婦似風盂英曰即子癇證沈堯封曰妊婦病源有三大綱一曰陰虧人身精血有限聚以養胎陰分必虧二曰氣滯腹中增一障礙則升降之氣必滯三日痰飲人身臟腑接壤腹中遽增一物臟腑之機括為之不靈津液聚為痰飲知此三者庶不為邪說所惑妊發卒倒不語或口眼歪斜或手足瘛瘀皆名中風或腰背反張時昏時醒名為痙又名子癇古來皆作風治不知卒倒不語病名為厥陰虛失納孤陽逆上之謂口眼歪斜手足瘛瘀瘲或因痰滯經絡或因陰虧不吸肝陽內風暴動至若腰背反張一證臨危必見戴眼其故何歟蓋足膀胱從太陽之脈起於目內皆上額交巔循肩膊內夾脊抵腰中足太陽主津液虛則經脈時縮脈縮故腰背反張經云童子高者太陽不足謂太陽之津液不足也脈縮急則童子高甚則戴眼治此常用地黃麥冬等藥滋養津液為主胎前病陽虛者絶少慎勿用小續命湯王孟英曰陰虛氣滯二者昔人會已言之痰飲一端可謂發前人之未發因而悟及産後譫妄等症誠沈氏獨得之祕反覆申明有裨後學之功不已多乎箋疏妊身陰虛以精血凝聚下元無暇旁及致令全身陰分偏於不足至理名言必不可易頤因此而悟及子癇發痙即從此陰虛二字而夾蓋癇症痙厥猝然而作亦可倏然而安近人腦經病之真理早已發明已是萬無疑義顧腦神經之所以為病者無非陰不涵陽孤陽上逆沖激震湯擾其神經以致知覺運動頓失常度若産後得此明是陰奪於下陽浮於上其理易明獨妊脈之時真陰團結必說不到陰虛二字何以而陽亦上浮至於此極今得堯封精血有限聚以養胎陰分必虧三句為之曲曲繪出原理乃知陽之所以升浮者正惟其陰聚於下有時不得上承遂令陽為之越發生是證燃究屬陰陽偶爾乖離非真陰大虛者可比則陽氣暴越能升亦自能降所以子癇病自動亦即自安不為大患亦與其他之癲癇發作有時恆為終身痼疾者不同堯封陰虛失納孤陽逆上及陰虧不吸肝陽內風暴動四句說明癇痙根源早已窺透此中癥結惜乎當時腦神經之病情尚未傳播遂以卒倒不語口眼歪斜手足瘛等症僅能以痰滯經絡解說尚是未達一間而論腰背反張臨危戴眼亦不得不從足太陽經起於內皆上額交巔說入引作確證豈知反張戴眼亦是腦經變動必與足太陽經無涉經謂童子高者太陽不足乃指平時無病而言不能援為猝然戴眼之證而足太陽主津液一說則經言膀胱者津液之府本屬可疑亦復可笑膀胱儲尿原是應當排泄之廢材何得謂之津液抑且治反張戴眼猝然為變者必以潛降為主攝納浮陽決非地黃麥冬滋養津液所能有效況堯封既以歪斜瘛瘲反張等症作為痰滯經絡則地黃麥冬寧不與痰飲一說自相矛盾總之氣火既浮上衝激腦者必挾胸中痰濁隨氣而升所以癇病發作之時無不口湧冷涎者滋膩養陰之藥必不可投何以沈氏附會津液不足而謂常用地黃麥冬等耶末調弗用小續命湯則所見最真凡吾同道不可不書諸紳無論昏憒歪余不仁不遂痙厥瘛瘲癲癇譫妄敬投續命必為催命之符此則頤之所敢斷言者孟英謂痰飲一端沈氏獨得之祕洵是確論子癇痙厥産後昏冒類多由此其實皆虛陽挾痰上逆所以沈氏蠲飲六神一方最多奇效然則地黃麥冬更不可不謂智者之一失矣沈堯封曰錢鵠云正室飲食起居無恙一夜連厥數十次發則目上竄形如尸次日叉厥數十次至晚一厥不醒以火炭投醋中近鼻熏之不覺切其脈三部俱應不數不遲並無怪象診畢伊父倪福增曰可治否余曰可用青鉛一斤化煬傾盆水內撈起再煬再傾三次取水煎生地一兩天冬二錢細石斛三錢甘草一錢石昌蒲一錢服倪留余就寢書室晨起見倪復治藥云昨夜服藥後至今止厥六次厥亦甚輕故照前方再煎與服服後厥遂不發後生一子計其時乃受胎初月也移治中年非受胎者亦屢效箋疏猝厥一症總是陽氣上浮沖激腦經所以頃刻之間能失知覺運動其脈有變有不變有伏有不伏其支體亦有冷有不冷病情與癇症大同但猝厥者無涎沫癇必有涎沫故治癇必兼滌痰冶厥可投滋膩養陰兼顧其本而必賴潛陽鎮墜之品始克有濟則是症必無二治其脈之不皆伏亦以腦經為病本與血管無涉大抵脈不伏而支溫者其症尚輕脈伏絶而支冷者其症為劇是其神經之激動尤甚更進一步即素問之所謂氣不返者死矣堯封此案雖不能識破腦神經病而以青鉛水煎湯正合鎮定氣火使不升騰之意所以覆杯得效如鼓應桴此症之發於初結胎時者固以真陰凝聚於下不暇他顧致令孤陽無宅俄傾飛揚既得青鉛攝引而復峻養真陰標本雙顧所以定厥而井無礙胎之慮宜為子癇猝厥之無上神丹自謂屢效必非虛語吳門葉氏治一反張發時如跳蟲雕席數寸發過節如平人用白芍甘草紫石英炒小麥南棗煎服而愈捷徑方載一毒藥攻胎藥毒衝上外證牙開緊急口不能言兩手強直握拳自汗身有微熱與中風相似但脈浮而軟十死一生醫多不識若作中風治必死用白扁豆二兩生去皮為末新汲水調下即效箋疏葉氏此案石英鎮納臺甘麥棗芍柔潤卷液與上條堯封用藥異曲同工真是雙璧雙珠無獨有偶讀此可悟善學古人者止當師其意而不必拘其方若必依樣葫蘆描寫一遍則抄書胥矣至捷徑方所述亦即此症生扁豆末例以必效恐是蜇言吾斯未信沈堯封曰痰滯經絡宜二陳加膽星竹瀝薑汁箋疏癇雖皆有痰然特其顯而易見者耳其實病在腦經氣升為本痰為標堯對此條是未知腦經為病尚覺隔膜初娠似勞沈堯封曰錢彬安室人內熱咳嗆涎痰夜不能臥脈細且數呼吸七至繳余診視問及經事答言向來不準今過期不至余因鄰近素知伊稟怯弱不敢用藥就診吳門葉氏云此百日勞不治歸延本邑浦書亭療投逍遙散不應更萎蕤湯亦不應曰病本無藥可治但不藥必駭病者可與六味湯聊復爾爾困取六味丸料二十分之一煎服一劑咳減二劑熱退四劑霍然惟覺腹中有塊日大一日彌月生一女母女俱安越二十餘年女嫁母故後以此法治懷妊咳嗆涎痰或內熱或不內熱或脈數或脈不數五月以內者俱效五月以外者有效有不效箋疏素稟本弱而入結胎則陰不上承虛火燔灼致為咳嗆涎痰內熱諸症六味本可以養陰而亦攝納清熱投之極輕不嫌呆笨正是恰如地位王孟英曰亦有勞損似娠者蓋凡事皆有兩面也喘丹溪曰因火動胎逆上作喘急者用條芩香附為末水調服箋疏此節以胎前言之喘是氣逆而上奔尋常治法皆宜開泄抑降然在有娠則重墜之藥皆有墮胎之慮不可不防故丹溪止以條芩香附治胎火則反是以思如有寒飲泛溢之喘逆自常舉一反三不能僅以黃芩為定喘之主藥亦自可悟但喘逆甚者開肺肅降亦不必忌正以有病則病當之適可而止未必開泄皆致墮胎觀上文堯封用青鉛一條胎元乍結之時尚不為害其故可思但不可大劑金石只止鎮壓耳呂滄洲曰有婦胎死腹中病喘不得臥醫以風藥治肺診其脈氣口盛人迎一倍左關絃動而疾兩尺俱短而離經因曰病蓋得之毒藥動血以致胎死不下奔迫而上衝非外感也人劑芎歸湯加催生藥服之下死胎其夫曰病妾有懷室人見嫉效藥去之衆所不知也箋疏此胎死而氣迫土沖非下死胎必不可救然亦有子懸重症母命危在旦夕苟再顧護胎元勢且母子莫保則急用大劑鎮逆不遑保胎亦是兩害相權處其輕者而已下文子懸條有旋覆代赭湯胎墮得生一節正合此旨頤十年前荊人兩度子腫寒水土溢喘急危極皆投真式湯合旋覆代赭俱胎墮而後即安實迫於事勢之無可奈何如其為他人處方似不常為此背城借一之計即使幸而得安容或有以胎墮為口實者設或元氣不支俱傷兩敗則悠悠之口更當如何然為醫家事實上思之但求吾心之所安以敗聽之天命則當危急存亡之秋亦不妨用此法蓋舍此必無可以兩全之策無寧放膽圖之尚有一線生機惟必以此中理由先為病家說明聽其自主可耳沈堯封曰外感作喘仍照男子治故不録他病仿此王海藏醫壘元戎曰胎前病唯常順氣若外感四氣內傷七情以成他病治法與男子同當於各證類中求之惟動胎之藥切不可犯惡陰金匱曰婦人得平脈陰脈小弱其人渴不能食無寒熱名妊娠於法六十日常有此證設有醫者治逆卻一月加吐下者則絶之沈堯封曰婁全善云惡阻謂嘔吐噁心頭眩惡食擇食是也絶之者謂絶止餘自安箋疏惡阻是胎元乍結真陰凝聚不得上承而虛陽上越故為嘔吐噁心頭眩惡食等證但陰結於下陰脈當沈實而不當小弱素問謂少陰動甚亦是有力搏擊之狀即證以閲歷所得必尺部有神而後敢信為妊兆如其兩尺微弱即未必是妊而金匱乃謂陰脈小弱者為妊娠殊不可嘵即謂六十日當有此證亦覺太泥凡惡皿早者珠胎乍結才十餘日而即有見症其遲者亦有發見於兩三月後者亦有連舉數胎而不知不覺者大率強壯之體皆無此症其惡食擇食嘔吐泛亞者皆柔脆者也而治之應否又各各不同其應手者三五劑即有大效其不應者雖竭盡智能變盡方法而嘔不可止則又本乎其人之性質非藥石所能為力醫有必不能自恃寸力可操勝算停藥一說雖似有理其實停藥而不能自安者亦正不少朱丹溪曰有妊二月嘔吐眩暈脈之左弦而弱此惡阻因怒氣所激肝氣傷又挾胎氣上逆以茯芩半夏湯下抑青丸箋疏一嘔吐皆肝氣之上逆縱無怒氣激動其病亦本於肝是方主治所以多效千金半夏茯芩湯治妊娠阻病心中憒悶空煩吐逆惡聞食氣頭眩體重四肢百節疼煩沉重臥臥少起惡寒汗出疲極黃瘦半夏生薑各三十銖乾地黃茯芩各十八銖橘皮旋覆花細辛人參芍藥芎躬桔梗甘草各十二銖右十二味哎咀以水一斗煮取三升分三服若病陰積月日不得治及服藥冷熱失候病變客熱煩渴口生瘡者去橘皮細辛加前胡知母各十二銖若變冷下痢者去幹地黃入桂心十二銖若食少胃中虛生熱大便閉塞小赤少者宜加大黃十八銖去地黃加黃芩六銖餘依方服一劑得下後消息看氣力冷熱增損方更服一劑湯便急使茯芩丸命能食便弦健也忌生冷酷滑油膩箋疏一是方開泄降氣化痰定逆而以旋覆干旋干運參地固護真陰又加細辛以通中州陽氣則脾之消化健而痰濁自退嘔吐可定但芎藭太升甘草太膩是可減之或謂細辛氣味俱雄古人謂其直透巔頂是升騰之勢較之川芎殆將倍荇蓰謂眩暈嘔吐不宜於升似當先除細辛而後再藏芎藭頤則謂細辛質堅而細氣雖升而質則降用以開中州郁窒而化痰濁尚無不可惟川芎形質氣味無一不升嘔惡必非所宜是有至理非臆說也千金茯芩圓服前湯兩劑後服此即效茯芩人參桂心熬乾薑半夏橘皮各一兩白朮葛根甘草枳實各二兩右十味蜜丸梧子大飲服二十丸漸加至三十丸日三次徐曰肘後不用幹姜半夏橘皮白朮葛根只用五物又云妊娠忌桂故熬王孟英曰雄按胎前産後非確有虛寒脈證者皆勿妄投熱劑暑月尤宜慎之又方青竹茹橘皮各十八銖茯芩生薑各一兩半夏三十銖上五味水六升煮取二升半分三服千金橘皮湯治妊娠嘔吐不下食橘皮竹茹人參白朮各十八銖生薑一兩厚朴十二銖上六味水七升煮取二升牛分三服沈堯封曰費姓婦懷妊三月嘔吐飲食服橘皮竹茹黃芩等藥不效松郡車謂津用二陳湯加旋覆花姜皮水煎沖生地汁一杯一劑吐止四劑全愈一醫笑曰古方生地半夏同用甚少不知此方即千金半夏茯芩湯除去細辛桔梗芎窮白芍四味又曰嘔吐不外肝胃兩經病人身臟腑本是接壞懷妊則腹中增了一物臟腑機括為之不靈水穀之精微不能上蒸為氣血凝聚而為痰飲窒塞胃口所以食入作嘔此是胃病又婦人既娠則精血養胎無以攝納肝陽則肝陽易升肝之經脈夾胃肝陽過升則飲食自不能下胃此是肝病千金半夏茯芩湯用二陳化痰以通胃也用旋覆高者抑之他用地黃補陰以吸陽也用人參生津以養胃也其法可謂詳且盡矣至若細辛亦能散痰桔梗亦能理上焦之氣芎窮亦能宣血中人滯未免升提白芍雖能平肝斂陰仲景法胸滿者去之故車氏皆不用斟酌盡善四劑狄安有以也王盂英曰發明盡致精義入神沈堯封曰蔡姓婦惡阻水藥俱吐松郡醫用抑青丸立效黃連一昧為末粥糊丸麻子大每服二三十丸又曰肝陽上升補陰吸陽原屬治本正理至肝陽亢甚滴水吐出即有滋陰湯藥亦無所用不得不用黃連之苦寒先折其太甚得水飲通然後以滋陰藥調之以收全效王盂英曰左金丸亦妙沈堯封曰沈姓婦惡陰水漿下咽即吐醫藥雜投不用身體骨立精神困倦自料必死醫亦束乎一老婦云急停藥八十日當愈後杲如其言停藥者即金匱絶之之義也至八十日當愈一語豈金匱六十日當有此證之誤耶不然何此言之驗也箋疏惡阻甚者每每百藥不效有至八九月而漸安者亦有直侍分娩而始平者停藥者打之亦未必皆安老婦所謂八十日常愈者想亦屢驗而始有此說鰍終是偶爾巧合不必一概皆然也沈堯封曰朱宗承正室甲戌秋體倦吐食診之略見動脈詢得停經兩月惡阻證也述前治法有效有不效如或不效即當停藥録半夏茯苓湯方與之不效連更數醫越二句復邀余診前之動脈不見但覺細軟嘔惡日夜不止且吐蛔兩條余曰惡阻無礙吐蛔是重症姑其蛔以觀動靜用鳥梅丸早晚各二十丸四日蛔止嘔亦不作此治惡陰之變局也故志之箋疏嘔之甚者即不吐蛔用烏梅丸亦佳以酸收合苦辛發中有合干旋樞機最有妙理嘔字從區正是樞關之失於運用乃有此症頤治嘔吐習用川椒紅烏梅炭或少加細辛效者不少功在左金丸之上椒紅至多不過十粒烏梅細辛各三四分皆不可多少則神應重則辛烈太過大耗津液不可不知子煩妊婦煩名子煩丹溪曰因胎元壅鬱熱氣所致沈堯封曰子煩病因曰痰曰火曰陰虧因痰者胸中必滿仲景云心中滿而煩宜瓜蒂散此是吐痰法妊婦禁吐宜二陳湯加黃芩竹茹旋覆花陰虧火甚者仲景黃連阿膠湯最妙箋疏煩是內熱心煩悶悶不樂亦以陰聚於下不得上承總是陰虛火擾但挾痰者十恆七八黃連溫膽湯觸飲六神湯皆佳瓜蒂吐法不獨妊身不宜即常人亦不可用以其本是痰熱卜壅更與激越適以引動其氣是助虐矣醫方集解汪認庵有竹葉湯一方治妊娠心驚膽怯終日煩悶名子煩因受胎四五月相火用事或盛夏君火大行俱能乘肺以致煩躁胎動不安亦有停痰積飲滯於胸膈以致煩躁者麥冬錢半茯芩黃芩一錢人參五分淡竹葉十片竹葉清煩黃芩消熱麥冬涼肺心火乘肺故煩出於肺茯芩安心人參補虛妊娠心煩固多虛也如相火盛者單知母丸君火盔者單黃連丸神不安者硃砂安神丸切不可作虛煩用梔豉等藥治之一方茯芩為末無人參有防風一方有防風知母無人參有痰者加竹瀝箋疏妊身心煩果是虛火無痰是方極合然挾痰者十之七八參麥胡可妄投認庵方下謂亦有停痰積欲滯於胸膈是渠亦未嘗不知有此一症而乃並列於本方之下一似此方並可治停痰積飲者豈非大謬方後且謂人參捕虛妊娠心煩固多虛症云云又與停痰積飲一層兩不照顧汪氏書之敝預模糊最易引初學人重霧中皆此等騎牆兩可之說誤人實是不淺又謂不可作虛煩用梔豉等藥頤謂梔子清心而不大苦大寒心家有火胡不可用且香豉質松本治心中煩熱之藥惟今之江浙市肆中以麻黃湯制過用為發汁之藥則非心煩者所宜耳方後既曰心煩多虛而又曰切不可作虛煩出爾更是可笑子懸嚴氏紫鰥散許叔微曰治懷胎近上脹滿疼育謂之子懸陳良甫曰妊至四五月君相二火養胎熱氣逆上胎腠心胸腹滿痞悶名曰子懸用此加黃芩山梔之類一方無用芎名七寶散許叔微云六七月子懸者用之數數有驗不十服便近下紫蘇一兩腹皮人參川芎橘皮白芍當歸三分甘草一分銼分三服水一盞生薑四片蔥白煎去渣服徐藹輝曰去川芎因避升提之故汪認庵曰治胎氣不和湊上胸腹腹滿頭疼心腹腰脅皆痛名子懸因下焦氣實相火旺盛舉胎而上上通心胸也每服止用蘇葉一錢當歸七分腹皮以下皆五分甘草二分無蔥白心腹痛者加木香延胡陳來章曰芎歸芍葉以和其血蘇橘大腹以順其氣氣順血和則胎安矣即利其氣復以人參甘草養其氣者順則順其邪逆之氣養則養其沖和之氣也徐藹輝曰延胡動血恐未可用箋疏子懸是胎元之上迫良由妊婦下焦氣分不疏腹壁逼窄所以胎漸居上而脹滿疼痛乃作濟生紫蘇飲用蘇葉腹皮橘皮芎歸疏通下焦之氣再加薑蔥亦是通陽作用不可認作發散通套程鍾齡醫學心悟解釋保生無憂散一方謂全用撐法故使易産頤謂嚴氏此方亦是摟法令其腹壁開展而胎自安於故宅惟其分兩甚輕故疏展而無擾動之慮陳氏不用川芎徐藹輝謂其嫌於升提洵是確論但本方止用三分開展氣機亦無不可若不知此理而重用之則大謬矣認庵所謂相火旺盛認症未切須知方中並無清火之藥並不為火旺而設總之汪氏書中議綸不少總覺膚浮甚則溢出題外所以徒授俗子簡陋惡習而此道乃愈趨愈下又謂心腹痛加本香延胡則運行氣滯尚是正著徐雖謂延胡動血惟恐礙胎然止是行血中之氣俗雖謂其破血其實氣體旺者尚可無妨惟柔脆者忌之陳來竟說解亦極浮泛是汪認庵之流亞非能闡發醫理之實用者趙養葵有命門虛寒胎下湊心就暖一說沈堯封曰此是百中僅一非實是虛寒脈證熱藥不可嘗試箋疏養葵此條純是謬想心雖屬火而位居膈上豈胎能湊得其暖氣者且腹中豈無熱度命門虛者將全腹寒止有其心獨暖耶向壁虛構而不顧其理有難安養葵之謬一至於此堯封採之得毋失榆沈又曰郁姓婦懷妊九月偶因勞動遂覺腹痛胎漸升至胸中氣塞不通忽然狂叫咬人數人扶持不住病名子上撞心即子懸之最重者用旋覆花代赭湯去參棗連灌兩劑胎墮得生又一婦證亦如之服前藥胎墮而死箋疏此誠是子懸之重症上逼太甚竟致神志為蒙此非重劑鎮墜復有何藥可以救急胎之墮否本已不暇兼顧即使墮胎而母命難全亦止有盡人力以聽氣數而已頤謂代赭石入煎劑尚非末子沖服可比亦未必皆墮胎果有急症不妨借用此時母命極危更不當疲藥塞責井此一線可生之機而絶之也案中升至胸中四字終是言之太甚胎在腹部必不能撞破膈膜直犯心主此是古人下筆之不慎讀者不可誤認沈又曰陸檢修正室子上撞心江穩婆教磨代赭汁服遂産兩子一子在上橫於心下一子撞著上子故經一晝夜不至撞心得不死産下遂安箋疏此條一子在土橫於心下一子撞著上子三句亦是理想而云然誰能入其母懷認得清楚如是蔥白湯治胎上逼心煩悶又治逼動困篤本草云蔥白通陰安胎婁全善曰此方神效脈浮滑者宜之蔥白二七莖濃煮汁飲之胎未死即安已死即出未效再服箋疏蔥白是根莖故能達下焦而通陽氣此亦頤之所謂摟法其陽氣宣通腹壁不窄則胎自安矣陳良甫曰治一婦孕七個月遠歸忽然胎上衝作痛坐臥不安兩醫治之無效遂云胎已死矣用萆麻子研爛和射香貼臍中下之命在呼吸召余診視兩尺脈絶他脈和平余問二醫作何證以治之答云死胎余問何以知之曰兩尺沈絶以此知之餘曰此說出何書二醫無答余曰此子懸也若是死胎欲有辨處面赤舌青子死母活面青舌赤吐沫母死幹活唇舌俱青子母俱死今面不赤舌不青其子未死是胎上逼心宜以紫蘇飲連進上十服而胎近下矣箋疏子死而舌青者以胎死則陰寒之氣上乘故舌無華採而現青黯之色李氏曰子懸證火盛極一時心氣悶絶而死紫蘇飲連准可救若兩尺脈絶者有誤服動胎藥子死腹中則增寒手指唇爪俱青全以舌為證念芎歸湯救之箋疏子懸本非火盛之證所以蘇葉蔥白皆能桴應李氏此言真是臆說王孟英曰戊申秋荊人妊八月而患咳嗽礙眠鼻衄如射面浮指腫諸藥不應諦思其故素屬陰虛內火自盛胎因火動上湊心胸肺受其沖咳逆乃作是不必治其嗽仍當以子懸治之因以七寶散去參芍生薑為其胸滿而內熱也加生石膏以清陽明之火熟地黃以攝根蒂之陰投匕即安今年冬仲亦以八月之娠而悲哀勞瘁之餘胎氣衝逆眩暈嗽痰脘脹便溏苔黃口渴豫觸飲六神湯去膽星茯芩加枳實蘇葉大腹皮以理氣開鬱黃芩卮子竹茹以清熱安胎一劑知二劑已凡子懸因於痰滯者余每用此法無不應如桴鼓箋疏此症是陰虛有素氣火上升為咳為衄為面浮膚腫尚非胎元之上逼然凡胎之能逆上者亦無非氣升使然病狀雖殊其理則一故治法皆同且凡所謂子懸者本是氣升為多亦不必其胎之果能上升也七寶六神只是順氣化痰所以不致礙胎若使投以大劑重墜之藥亦將有傷胎之變妊娠腫脹沈堯封曰妊婦腹過脹滿或一身及手足面目俱浮病名子腫或名子氣或名琉璃胎但兩腳腫者或名皺腳或名肥腳名色雖多不外有形之水病與無形之氣病而已何則胎礙藏府機括不靈腎者胃之關也或關門不利因而聚水或脾不能散精行肺或肺不能水精四布此有形之水病也又腹中增一物則大氣升降之道窒塞此無形之氣病也病在有形之水其證必皮薄色白而亮病在無形之氣其證必皮厚色不變說見內經脹論細玩自明更有痰滯一證痰雖水類然凝聚質厚不能遍及皮膚惟壅滯氣道使氣不宣通亦能作腫其皮色亦不變故用理氣藥不應加化痰之品自然獲效箋疏妊身發腫良由真陰凝聚以養胎元而腎氣不能敷布則腎中之輸尿管無權遂致水道不通泛溢莫制治當展布腎氣庶幾水行故道小溲利而腫脹可消此惟仲景腎氣丸最為正治但附子最是礙胎苟非症勢危急慎弗輕率援用以貽口實其頭而腫者則肺氣不降上源不清而水道亦不利則當關宣肺氣復基肅降之常而即不浮徐藹輝曰靈樞水脹論曰水始起目窠上微腫如新臥起之狀其頸脈動時咳陰股間寒足脛腫腹乃大基水已成矣以手按基腹隨手而起如裹水之狀此其候也膚脹者寒氣客於皮膚之間鑿鑿然不堅腹大身盡腫皮厚按其腹窅而不起腹色不變此其候也愚按於膚脹言皮厚色不變則水脹之皮簿色變可知矣存參千金鯉魚湯治妊娠腹脹脹滿或渾身浮腫小便赤澀沈按此治有形之水也以腹脹滿為主身腫溺澀上加一或字乃或有或無之詞不必悉具陳良甫曰胎孕至五六個月腹大異常此由胞中畜水名曰胎水不早治恐胎死或生子手足軟短宜干金鯉魚湯蓋鯉魚歸腎又是活動之藥臣以芩術姜橘直達胞中去水又恐水去胎虛佐以歸芍使胎得養真神方也當歸白芍各一錢茯芩一錢五分白朮二錢橘紅五分鯉魚一尾去鱗腸作一服白水煮熟去魚用汁一盞半入生薑三片煎一盞空心服胎水即下如腹悶未盡除再合一服金匱葵子茯芩湯治妊娠有水氣身重小便不利灑淅惡寒起即頭眩按此滑利之劑亦治有形之水葵子一斤茯芩三錢為散飲服方寸匕日三服小便利則愈箋疏葵子滑而下行近入有傷胎之說雖是古方必須慎用天仙藤散治妊娠自三月成胎之後兩足自腳面漸腫至腿膝行步艱難喘悶妨食狀似水氣甚至足指間出黃水者謂之子氣此元豐中淮南名醫陳景初制也本名香附散後李伯時更名天仙藤散按此理氣方也腳面漸腫至腿膝並足指間黃水出是水與氣同有之證不得即謂之氣病必皮厚色不變方是氣病用此方為對證天仙藤即青木香藤洗略焙香附炒陳皮甘草烏藥木香等分銼末每服五錢加生薑三片紫蘇五葉水煎日三服腫消止藥箋疏是方專從氣分著想意謂氣得通調而腫可自愈然方下則謂三月成胎之後腳腫至膝甚至喘悶妨食足指間出水則水之泛濫甚矣豈僅理其氣所能有效沈堯封謂必皮厚色不變方是氣病用此為對症乃是認症要決齊仲甫曰妊娠八九月見腳腫不必治當易産因胎中水血不多不致燥胎故也若初妊即腫者是水氣過多兒未成體恐胎傷壞箋疏妊至八九月而始有腳腫尚是常事其症本輕既不上升大腫則娩後自消固不必治非若妊身三四月而即腫者可比也腳腫主男胎宋少主微行徐文伯從見一妊婦不能行少主脈之曰此女形也文伯診之曰此男胎也在左則胎色黑少主怒欲破之文伯惻然曰臣請針之補合谷瀉三陰交應手而下男形而色黑箋疏此節出於正史似乎必有此事然言其然而不能言其所以然雖針刺家書言之鑿鑿曲為附會咸推徐氏仁心妙手頤竊謂文士言醫不諳此中真理每每侈詡新奇而實無理可喻二十四史力伎術中十九難信更何論諸家文籍及郡縣志乘而此外之小說家言益可知矣江氏魏氏名醫類案不知芟剃以多為貴可笑者不知凡幾又圖書集成醫部之末數卷搜輯醫術名流列傳專採省縣志書奇奇怪怪復疊重纍依樣描摹者甚至前後十餘條如比一手文人之筆鄙俚一至於此頤戲為之集成一編名之曰古今怪案可為醫界中一部笑史文伯此條亦其一耳必不可信薛立齊案云一妊婦腹脹小便不利吐逆諸醫雜進溫胃寬氣等藥服之反吐轉加脹滿湊心驗之胎死已久服下死胎藥不能通因得鯉魚湯其論曰妊婦通身腫滿或心胸急脹名曰胎水遂看妊婦胸肚不分急以鯉魚湯三五服大小便皆下惡水腫消脹去方得分娩死胎此證蓋因懷妊腹大不以為怪竟至傷胎可不慎哉箋疏水既洋溢胎浸其中安有不壞之理必二便暢行而死胎始下亦是至理妊娠經來王叔和曰婦人月經下但少師脈之反言有娠其後審然其脈何類曰寸口脈陰陽俱平營衛高和沈注寸口脈陰陽俱平自然營衛調和也按之則滑浮之則輕沈注重按之以候陰分則滑是有餘之象浮取之以候陽分則輕是不足之象竊謂此即陰搏陽別之義陽明少陰各如經法沈注沖隸陽明主血任隸少陰主精各如經法精血無損是有娠而下墮之象身反灑浙不欲食頭痛心亂嘔吐沈注諸症經所謂身有病而無邪脈妊子也呼之則微吸之不驚陽多氣溢陰滑氣盛滑則多實六經養成所以月見沈注呼出之氣微數吸入之氣舒徐不驚是陽氣多溢於外今陽氣不足於內陰脈滑則陰血內盛所以月見經來六經養成句無解尚須查詳陰見陽精汁凝胞散散者損胎沈注若陰分虛而陽精乘之胞中必散方是胎墮然胞中若散脈必散而不滑今脈滑無虞也設復陽盛雙妊二胎今陽不足故令激經也沈注設陰陽俱盛必雙胎今氣不足而血有餘非雙胎乃激經也箋疏此節出脈經第九卷考脈經一書單行佳本極不易得金山錢氐守山關叢書有之光緒十七年皖南周澄之亦刻入醫學叢書中則據嘉定黃氐道光間校刻本頗與錢本微有出入茲據周本校沈氐所引此節録其同異於下以備考竅但本節文義亦頗有不甚明瞭者吾國極古醫書多有此可疑之處本不能勉強注釋強求真解亦不容自吾作古妄詡聰明姑付闕如以俟賢者考異月經下周本作經月下但少作但為微少娠作軀何類周本下有何以別之四字按之則滑周無則字不欲食周本下有飲字嘔吐周本作嘔噦欲吐呼之則微周作呼作微數吸之不驚周作吸則不驚散者損胎周作散者損墮産乳集曰妊婦月信不絶而胎不損問産科熊宗立答云此婦血盛衰其人必肥既妊後月信常來而胎不動若便以漏胎治之則胎必墮若不作漏胎治則胎未必墮宗立之言誠為有見然亦未必因血盛者榮經有風則經血喜動以風勝故也則所下者非養胎之血若作漏胎治投以滋補是實實也胎豈有不墮若知是風瑞以一味風藥投之經信可止即不服藥胎亦無恙然亦有胎本不固因房室不節先漏而後墮胎者須作漏胎治又不可不審也沈堯對曰妊娠經來與漏胎不同經來是按期而至來亦必少其人血盛氣衰體必肥壯漏胎或因邪風所迫或因房室不節血來未必按期體亦不必肥壯且漏胎因不盡風邪房室更有血熱肝火諸證不可不察脈辨證風人脈中其脈乍大乍小有時隴起所云一味治風藥是舉卿古拜散沈注即華陀愈風散荊芥略炒為末每服三錢黑豆淬調服血熱證必五心煩熱治以黃芩阿膠涼血之藥肝火內動脈必弦數並見氣脹腹痛治以加味逍遙散房勞證脈必虛宜人參或虛而帶數宜六味湯箋疏産乳集今未見此書考四庫書目提要産肯寶慶方二卷系從永樂大典録出重編嘗引産乳備要似即此書乃宋人舊本頤謂榮經有風一層殊不可信荊芥一味非可浪投堯封所謂血熱肝火二者其症最多可師可法房室不節擾動衝任尤為墮胎半産之根萌則必有腰痠等證亦不僅脈虛二字足以概之並非人參所能有效六味太泛亦非必需之藥虞天民曰或問妊婦有按月行經而胎自長者有三五個月閒其血大下而胎不墜者或及期而分娩或逾月而始生其理何歟曰按月行經而胎自長者名曰盛胎其婦氣血充盛養胎之外其血有餘故也有數月之胎而血大下調之漏胎因事觸胎動其衝脈故血下而不傷子官也然孕中失血胎雖不墮氣血亦虧多致逾月不産會見十二三月十七八月或二十四五月生者往往有之俱是氣血不足胚胎難長故耳凡十月之後未産者當大補氣血以培養之庶無分娩之患也箋疏花溪老人此論分別有餘不足甚是明析謂逾月不産因於不足宜用培養一層洵是要訣縱使其人本未漏胎而既以逾期不生母氣不旺亦復河疑李氐曰胎漏自人門下血尿血自尿門下血箋疏此胎漏與溲血之辨別處一由精竅一由溺竅此惟患者有能知之非善問不可然閨中人赧於啓齒節問之亦不易得其詳則下條蕭氏一說尤握其要蕭賡六云胎漏下血頻出無時尿血溺時方下不溺則不下沈堯對曰尿血小薊飲子妙箋疏溺血多膀胱蘊熱清熱利水是也然在妊身則傷胎之藥宜避王盂英曰懷孕屢漏之後氣血耗傷有遲至三四十月而生者若妊娠帶下多主生女亦大不然也吳醞香大令五令媳素患帶婚後帶益盛繼漸泛愆醫皆以為帶所致也久投溫澀無效余診之脈甚滑數以懷麟斷清其胎火而愈及期果誕一子箋疏帶下屬熱者多是必有脈症可憑俗子輒認為虛本極可笑終
